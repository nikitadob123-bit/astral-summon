{t:'Клоун из Оранж-Тауна',s:'В Оранж-Тауне свирепствует Багги-Клоун, чей красный нос известен по всему Ист Блю. Нами ловко ворует у него карту Гранд Лайна и падает в ваши руки: «Не выдавайте меня!» Багги ревёт, и его тело разлетается на куски, а Разлом добавляет ему яростных Теней. Пока горожане вылезают из подвалов, Нами шепчет вам: «Только не смейте делить добычу без меня». Бой начинается.',e:[['Багги-Клоун','🤡','Caster',1.4,1.1],['Пират Багги','🏴‍☠️','Lancer',1],['Пират Багги','🏴‍☠️','Rider',1]],w:'Багги собрался обратно по кусочкам, но не смог остановить Луффи. Нами присоединяется к команде и ворчит: «Только не думайте, что я стала доброй».'},
{t:'Деревня Сироп',s:'В деревне Сироп Усопп рассказывает небылицы, а Кая болеет в особняке. Капитан Куро, бывший «Кот с Чёрным Пером», решил уничтожить девушку ради денег. Усопп заслоняет дорогу: «Я, Капитан Усопп, не пущу вас!» Вы улыбаетесь и выходите вперёд. Вокруг деревни стелется чёрный туман, и в нём мерещатся тени кошек. Вы чувствуете, как дрожат ладони, но не отступаете.',e:[['Капитан Куро','🐱','Saber',1.4],['Сям','🐈','Rider',1],['Буччи','🐈','Lancer',1]],w:'Куро сбежал ни с чем, а Усопп понял, что может быть храбрым по-настоящему. Кая дарит ему корабль «Мерри», и команда теперь готова к дальней дороге.'},
{t:'Плавучий ресторан Барати',s:'На море появляется плавучий ресторан Барати, где готовит одноглазый Санджи. Но в воды входит Дон Крик, «Адмирал Ярости» с броневым щитом и грудой оружия. Санджи ловит вас взглядом: «Он оскорбил моего повара. Придётся его проучить». Повара и официанты выстраиваются вдоль борта, готовые бросить в бой хоть кастрюли. Санджи усмехается и закуривает.',e:[['Дон Крик','🛡️','Lancer',2]],w:'Дон Крик упал, а Санджи закуривает: «Я хочу найти Олл Блю». Дальше плывёт вся команда, и дым сигареты растворяется в ветре.'},
{t:'Ястребиный Глаз',s:'Над океаном звучит хищный смех — на маленькой лодке плывёт Дракуль Михавк, лучший мечник в мире. Зоро выходит вперёд с тремя клинками: «Я хочу проверить, как далеко до вершины». Вы чувствуете: тьма Разлома вплетается в чёрный клинок. Волны разбегаются кругами, а Мерри скрипит, будто прощается с вами. Зоро втягивает воздух и обнажает Вадо, Сандай и Сюсуй.',e:[['Дракуль Михавк','🦅','Saber',1.8,1.3],['Тень Ястреба','👤','Archer',1]],w:'Зоро проиграл, но поклялся: «Однажды я стану сильнее тебя». Михавк уходит, а на палубе остаётся тишина, полная уважения и решимости.'},
{t:'Ложь Нами',s:'Нами внезапно исчезает с Мерри, унеся всё золото, и уплывает в остров Коко. Луффи ворчит, но не тревожится: «Она вернётся». Вы догоняете её на побережье, где Нэдзуми из Дозора берёт дань с деревни Кокояси. Луффи обещает вернуть её силой, если понадобится. Санджи и Усопп бегут следом, а Зоро только ворчит, но идёт первым.',e:[['Капитан Нэдзуми','🐀','Archer',1.3],['Дозорный-Тень','👤','Lancer',1],['Дозорный-Тень','👤','Saber',1]],w:'Нэдзуми бежал, но настоящий враг ещё впереди. Нами дрожащим голосом признаётся, что работает на Арлонга, чтобы выкупить свою деревню. Она отворачивается, чтобы скрыть слёзы, но вы видите, как дрожат её плечи.'},
{t:'Хатчан и Ёсиэй',s:'Перед Арлонг-Парком вас встречает Хатчан, шестирукий осьминог, мастер боя с мечами. «Людишки недостойны океана!» — кричит он. Луффи и Зоро обмениваются взглядами: пора расквитаться за Нами, а Разлом делает рыболюдей ещё безумнее. Хатчан размахивает шестью клинками и хохочет, а вокруг Парка воют Тени. Вы понимаете: без боя внутрь не пройти.',e:[['Хатчан','🐙','Saber',1.4],['Морской Пират-Тень','👤','Rider',1]],w:'Хатчан размяк, его шесть клинков сломаны. Зоро подмигивает Луффи: «Осталось двое». Арлонг-Парк уже виден над волнами. Пираты Арлонга разбегаются по коридорам, а вы уже слышите, как впереди громыхают двери.'},
{t:'Кубоджу и Чу',s:'В здании Арлонг-Парка ждут Кубоджу — мастер каратэ рыболюдей — и Чу, стреляющий водой. Санджи и Усопп уже сражаются на других этажах. Нами кричит, срывая голос: «Луффи, помоги мне!» Он поворачивается: «Конечно, Нами!» Ваши шаги гулко отдаются в коридорах, а вокруг падают плиты, разбитые чужими кулаками. Впереди слышен хохот Арлонга.',e:[['Кубоджу','🐡','Berserker',1.4],['Чу','🐟','Archer',1.2],['Тень рыболюда','👤','Lancer',1]],w:'Кубоджу и Чу побеждены. Луффи надевает шляпу на голову Нами и говорит: «Ты часть моей команды». Остался только Арлонг. Пираты Арлонга затихли, но главный зал уже близко, и вы слышите, как Арлонг смеётся.'},
{t:'Арлонг-Парк',b:1,s:'Арлонг, Пила-Акула, рушит стены, как бумагу, и хохочет: «Люди — ничтожные создания!» Нами воткнула нож в свою татуировку, но Луффи поднимает её на руки: «Скажи мне это слово». — «Помоги мне!» — «Вот теперь можно драться!» Вы слышите за спиной, как Санджи, Зоро и Усопп уже заняли позиции, а Чоппера ещё нет, но бой сам не ждёт.',e:[['Арлонг, Пила-Акула','🦈','Berserker',3.5,1.3],['Морской Пират-Тень','👤','Saber',.7],['Морской Пират-Тень','👤','Archer',.7]],w:'Арлонг-Парк рухнул под ударом Луффи. Нами плачет от счастья, а над деревней Кокояси взлетает флаг Соломенной Шляпы. Ист Блю остаётся позади.'},
{t:'Логтаун: город начала и конца',s:'Логтаун — город, где родился и был казнён Гол Д. Роджер. Багги, преследующий вас с места на место, готовит эшафот, а капитан Смокер уже держит в руках дымовую сеть. «Не убегайте, пираты», — рычит он. Ветер приносит запах грозы, и в небе вспыхивает молния. На площади шепчут, что любой, кто придёт сюда, увидит свою судьбу. Вы сжимаете руки в кулаки и идёте вперёд.',e:[['Капитан Смокер','💨','Lancer',1.5,1.2],['Багги-Клоун','🤡','Caster',1.2],['Тень дозорного','👤','Rider',1]],w:'Молния в небе спасла вас: эшафот рассыпался, а Драгон, стоя на башне, исчез в буре. Мерри снова вышла в море, ловя попутный ветер.'},
{t:'Обратная гора',s:'Мерри поднимается по потоку Красной Линии к вершине Реверс-Маунтин, и все кричат от ужаса. У входа в Гранд Лайн вас встречает огромный кит Лаборн, глотающий корабли. Разлом искажает его глаза, и он идёт на таран, а Луффи в ярости бьёт по скале. Мерри бросает, как щепку, а Нами орёт, чтобы все держались крепче. Луффи в восторге и спрашивает: «А это можно повторить?»',e:[['Лаборн, Кит-Страж','🐋','Berserker',2,1.2],['Тень морского зверя','👤','Rider',1]],w:'Лаборн успокоился и проглотил лишь воздух. Доктор Крокус смеётся из маяка: «Добро пожаловать в Гранд Лайн, мальчики. Вам ещё многое предстоит».'},
{t:'Виски-Пик и охотники за головами',s:'Город Виски-Пик встречает вас пирами и песнями, но за столом прячутся Барочные Работы. Зоро один разгоняет сотни охотников за головами, пока Нами шепчет вам: «Здесь что-то не так». Вивиль, переодетая Мисс Уэнсдей, дрожит от страха у окна. Вы замечаете, как трое охотников подозрительно переглядываются, а над крышами скользит чёрная тень Разлома.',e:[['Мистер 9','🎯','Archer',1.2],['Мисс Вторник','🌸','Caster',1.2],['Охотник-Тень','👤','Saber',1]],w:'Охотники разбежались, и Зоро допивает бокал: «Веселье закончилось?» Вивиль признаётся, что она принцесса Алабасты, и просит отвезти её домой. Путь на остров, где вас ждёт правда об Алабасте, открыт, и корабль поднимает паруса.'},
{t:'Мистер 5 и Мисс Валентайн',s:'Пара агентов Барочных Работ гонится за вами через пустыню Виски-Пика, взрывая всё вокруг. Мистер 5 плюётся бомбами, а Мисс Валентайн парит в воздухе. Санджи бросается вперёд: «Я не бью женщин, но с зонтиками можно и поговорить». Пустыня дрожит от взрывов, песок забивается в глаза, но Вивиль уже бежит к выходу, зовя вас за собой.',e:[['Мистер 5','💣','Archer',1.3],['Мисс Валентайн','☂️','Caster',1.3],['Пират Барочных Работ','🏴‍☠️','Lancer',1]],w:'Взрывы стихли. Вивиль вздохнула с облегчением, а Карю, гигантская утка, подхватила вас и понесла в сторону Литтл-Гардена. Вы обмениваетесь усталыми улыбками и пожимаете друг другу руки, зная, что отдых будет коротким.'},
{t:'Литтл-Гарден: два великана',s:'Литтл-Гарден — остров, застрявший в эпохе динозавров. Два великана, Дориб и Брогги, дерутся уже сотню лет. Луффи с восторгом жарит мясо, а Усопп восхищённо шепчет: «Вот это воины!» Над островом клубится тьма Разлома, искажая динозавров. Лианы шевелятся под ногами, а из зарослей доносится рёв. Вы вытаскиваете оружие и встаёте спина к спине с Зоро.',e:[['Тираннозавр-Тень','🦖','Berserker',2],['Вожак стаи','🦕','Rider',1.2]],w:'Динозавр отступил, и Брогги протягивает вам огромный бокал эля. «Вот это настоящий пир воинов!» — смеётся великан. В лесу шевелится Мистер 3.'},
{t:'Мистер 3 и Свечное Заточение',s:'Мистер 3 и Мисс Золотая Неделя заточили вас в свечной воск, и Нами с Вивиль в ловушке. Зоро режет воск клинками, но Разлом делает свечи прочнее стали. «Ну что, проверим на прочность?» — Санджи разминает ногу и бросает вызов Мистеру 3. Вивиль в панике зовёт вас, а Нами оценивает, сколько золота стоит выбраться. Вы решаетесь на отчаянный ход.',e:[['Мистер 3','🕯️','Caster',2],['Мисс Золотая Неделя','🎨','Archer',1.2],['Восковой Двойник','👤','Saber',1]],w:'Свечи растаяли, и Мистер 3 вынужден признать поражение. Брогги и Дориб наконец скрестили клинки в последней схватке — острову есть чем гордиться.'},
{t:'Пир воинов на Литтл-Гардене',s:'Пока вы приходите в себя после боя, Брогги делит с вами гигантское мясо, а Вивиль осторожно спрашивает о вечном поединке. Внезапно из тумана выступает отряд Барочных Работ, желающий отобрать Вивиль. «Она нужна нашему боссу», — скалится один из агентов. Луффи набивает рот и прыгает в бой.',e:[['Агент Барочных Работ','🕶️','Archer',1.2],['Агент Барочных Работ','🕶️','Lancer',1.2],['Тень джунглей','👤','Rider',1]],w:'Агенты бежали в туман, а великаны поклялись, что остров запомнит Соломенную Шляпу. Мерри снова в море, и вдали уже маячит зимний остров.'},
{t:'Остров Драм',s:'Нами заболела: температура растёт, и вас несёт к острову Драм — зимнему королевству. Вапол, изгнанный король, захватил замок и выгнал врачей. «Мы ищем врача, а не короля!» — кричит Луффи. Санджи несёт Нами на спине по снегу. Ветер швыряет снег в лицо, и мир вокруг превращается в белую стену. Вы прикрываете Нами плащом и идёте вверх.',e:[['Вапол, Король-Изгнанник','👑','Caster',1.5],['Солдат Вапола','🛡️','Lancer',1],['Тень зверя','👤','Berserker',1]],w:'Вапол сбежал, а Хогбэк, лекарь-в-сердце, ведёт вас в горы к Хилурук, ведьме-врачу. Там Нами наконец получает нужное лечение. Вы укрываетесь в хижине лекаря, а за окном метель воет так, будто злится на весь мир.'},
{t:'Чоппер: олень-доктор',s:'Тони Тони Чоппер — олень с синим носом, изгнанный из своего стада. Он мечтает вылечить любую болезнь, но не доверяет людям. Хилурук усмехается: «Отвези его на корабль, парень». Луффи хохочет: «Ты мой товарищ!» — Чоппер прячется, краснея. Хилурук сидит у камина и курит трубку, а Чоппер смотрит на вас как побитый зверёк. Но вы протягиваете ему руку.',e:[['Тень оленя','🦌','Rider',1.3],['Тень Вапола','👤','Lancer',1.2],['Сторож-Марионетка','🤖','Saber',1]],w:'Чоппер расплакался, но всё же взошёл на борт. «Я поплыву с тобой», — прошептал он. Снег над Драмом расцвёл сакурой, и команда уходит на юг.'},
{t:'Вапол возвращается',b:1,s:'Вапол вернулся с армией и решил взять замок силой. Хилурук зажигает свой знак: «Пусть расцветёт сакура!» Чоппер выбегает вперёд: «Я Тони Тони Чоппер, доктор!» Луффи бьёт первым — и ледяная гора дрожит от удара, а Разлом кипит над замком. Хилурук стоит на краю обрыва с бутылью вина, а ледяной ветер ревёт над Драмом. Начинается настоящая буря.',e:[['Вапол, Король-Пожиратель','👑','Caster',3.5,1.3],['Хаос-Тень','👤','Berserker',.7],['Солдат Вапола','🛡️','Lancer',.7]],w:'Вапол улетел в небо. Драм цветёт: над снегом взлетают розовые лепестки. Чоппер шепчет: «Спасибо за всё, Хилурук». Впереди ждёт Алабаста и большая беда.'},
{t:'Порт Нанохана',s:'На берегу Алабасты вас встречает пыльная пустыня и слухи о восстании. В Нанохане вы натыкаетесь на Смокера и загадочного Мистера 2 Бон Клея, меняющего лица. «Я не выдам вас, дорогие», — подмигивает он. Вивиль мрачнеет: время уходит. Жара давит на плечи, вода в бурдюках заканчивается, но Вивиль ведёт вас вперёд, не оглядываясь и не жалуясь.',e:[['Мистер 2 Бон Клей','🎭','Caster',1.4],['Капитан Смокер','💨','Lancer',1.3],['Пират-Тень','👤','Rider',1]],w:'Бон Клей скрылся, оставив на пристани смешные танцы, а Смокер молча отступил. Вы сами поплыли вглубь пустыни, спеша остановить армию бунтарей.'},
{t:'Эйс из Огненного Кулака',s:'В Нанохане вас догоняет Портгас Д. Эйс — старший брат Луффи и командир Второго дивизиона Вайтбёрда. Он ищет Чёрную Бороду, предателя. Луффи бросается на шею: «Эйс!» Тот смеётся: «Ты всё ещё плакса». Но воздух вспыхивает: Тени уже рядом. Толпа вокруг замирает: не каждый день двое братьев встречаются на краю пустыни. Вы стоите рядом и прикрываете спины.',e:[['Тень Чёрной Бороды','🏴‍☠️','Berserker',1.5],['Пират Барочных Работ','🏴‍☠️','Rider',1],['Пират Барочных Работ','🏴‍☠️','Lancer',1]],w:'Эйс вручает Луффи Вивр Кард: «Мы ещё встретимся». Вы провожаете его взглядом — огонь на горизонте исчезает, но тепло остаётся в груди.'},
{t:'Юха: сердце пустыни',s:'Город Юха умирает от засухи: жители думают, что виновата королевская семья. Коза, лидер повстанцев, готов взять оружие. Вивиль умоляет остановить его. Внезапно из песка выходит Мисс Всё-Воскресенье, а за ней ползёт Разлом, искажающий песчаных зверей. На улицах пыль, сухие фонтаны и пустые лавки, и вы понимаете, что этот город умирал давно. Но вы пришли помочь.',e:[['Песчаный Хищник','🦂','Berserker',1.4],['Мисс Всё-Воскресенье','🎩','Archer',1.3],['Повстанец-Тень','👤','Saber',1]],w:'Хищник рассыпался песком, но Робин исчезла так же тихо, как появилась. Вивиль сжимает кулаки: «Нужно успеть в Аркахард до рассвета».'},
{t:'Рэйн-Бэйз: логово Крокодайла',s:'Рэйн-Бэйз — казино, где Сэр Крокодайл прячет свой замысел. Он приглашает вас в подземелье: «Добро пожаловать, Соломенная Шляпа». Внутри ловушка с песчаным болотом, а Нико Робин лишь холодно наблюдает. Луффи сжимает кулаки: «Ты плохой парень». Стены казино усыпаны золотом, а под ногами журчит зыбучий песок. Вы держите оружие наготове и не отводите глаз от Крокодайла.',e:[['Сэр Крокодайл','🏜️','Caster',2],['Телохранитель-Тень','👤','Lancer',1]],w:'Луффи ушёл под воду — Крокодайл выигрывает в этот раз. Но Санджи вытаскивает его из ловушки, а Вивиль рыдает: «Я не сдамся».'},
{t:'Зоро против Мистера 1',s:'Мистер 1, Даз Боунс, превращает тело в клинок и ждёт Зоро в тени. Он ничего не боится, ведь сталь режет всё. Зоро хмыкает: «Резать сталь — вот что мне нужно». Вы замечаете, как из его рук на мгновение вспыхивает тьма Разлома. Даз Боунс ждёт молча, а лезвия его рук блестят в лунном свете. Зоро делает шаг вперёд и встаёт в стойку.',e:[['Мистер 1 Даз Боунс','🗡️','Saber',2],['Мисс Двойной Палец','💃','Archer',1.2]],w:'Зоро перерезал стальное тело и рухнул без сил. Даз Боунс склонил голову: «Достойный меч». Вивиль ободряюще сжимает его плечо. Разлом на его клинках погас, и вы чувствуете, что Зоро стал ещё на шаг ближе к вершине.'},
{t:'Санджи и Мистер 2',s:'На площади Алабасты Санджи сцепился с Бон Клеем, но обнаружил, что тот не такой уж и злодей. Мистер 2 плачет от душевных ран и всё-таки готов драться за Барочные Работы. «Настоящие друзья не оставляют друг друга», — усмехается Санджи. Вокруг них сгущаются клубы дыма от сигареты, а Бон Клей то и дело меняет лица, дразня Санджи. Бой странный, но серьёзный.',e:[['Мистер 2 Бон Клей','🎭','Caster',1.6],['Пират-Тень','👤','Saber',1.1],['Солдат Барочных Работ','🏴‍☠️','Lancer',1]],w:'Бон Клей падает на колени, растроганный, и бросает Санджи ключ от тюрьмы Крокодайла. «Ступай, дорогой друг». Вы улыбаетесь ему, зная, что в этой команде иногда даже враги становятся друзьями.'},
{t:'Усопп и Мисс Двойной Палец',s:'Усопп остался прикрывать вход, но против него выходит Мисс Двойной Палец с иглами. Он дрожит, но помнит слова Кая: «Ты настоящий герой». Схватив рогатку, он выкрикивает свою самую храбрую ложь и выпускает Огненную Звезду. Вокруг воют Тени, но рогатка в его руках не дрожит. Вы прикрываете его и подбадриваете короткими возгласами.',e:[['Мисс Двойной Палец','💃','Archer',1.3],['Тень пирата','👤','Rider',1.1]],w:'Усопп победил и рухнул на колени, довольный: «Я — мужчина!» Чоппер и Нами уже бегут ему навстречу, обнимая героя. Вы обнимаете его за плечи, а вокруг летят пыль и обломки, но никто этого не замечает.'},
{t:'Ловушка в Аркахарде',s:'В городе Аркахард Вивиль обнаруживает, что Крокодайл ждёт вас в засаде. Солдаты в масках Барочных Работ загоняют вас в узкий переулок, а Санджи и Чоппер держат оборону. «Не сдавайся, Вивиль!» — кричит Нами и тянет принцессу за руку, пока вокруг сгущается тьма Разлома. Вы бежите по крышам, ощущая, как под ногами трещит черепица, а сзади гремят выстрелы. Время неумолимо утекает.',e:[['Мисс Всё-Воскресенье','🎩','Archer',1.3],['Солдат-Тень','👤','Saber',1.2],['Солдат-Тень','👤','Lancer',1.2]],w:'Ловушка захлопнулась впустую: Санджи прорубил путь, а Чоппер вынес Вивиль на плечах. Часы на башне отбивают последние минуты до катастрофы.'},
{t:'Бомба на дворцовой башне',s:'Часы Алабасты отсчитывают время до взрыва: Крокодайл разместил бомбу на башне. Вивиль пытается остановить армии, а Луффи упрямо дерётся с Крокодайлом на земле. «Я не могу проиграть в третий раз!» Земля дрожит, Разлом рвёт небо. Ветер поднимает песок, а колокола во дворце отбивают роковую минуту. Вы бросаетесь наверх по ступеням башни.',e:[['Сэр Крокодайл','🏜️','Caster',2.2,1.3],['Пират Барочных Работ','🏴‍☠️','Rider',1.2],['Тень Крокодайла','👤','Berserker',1.2]],w:'Луффи срывает вращающуюся бомбу с башни и швыряет её в небо, где взрывается облако. Алабаста цела, но поединок ещё не окончен.'},
{t:'Песчаный Король Алабасты',s:'Луффи и Крокодайл сходятся в решающей схватке на площади Аль-Бабы. Крокодайл смеётся: «Я стану королём этой страны!» — а его песчаные руки готовы разорвать любого. Вивиль кричит: «Остановитесь, прошу вас!» Луффи выпрямляется: «Я не проиграю!» Песок завывает, небо чернеет, а Разлом рвётся над столицей багровой раной. Вы вскидываете руки и зовёте героев Астрала.',e:[['Сэр Крокодайл, Король Песка','🏜️','Caster',4,1.4],['Тень пустыни','👤','Berserker',.7],['Тень пустыни','👤','Rider',.7]],b:1,w:'Гому-Гому Гатлинг пробивает песчаную броню, и Крокодайл падает в руины. Дождь льёт над Алабастой. Вивиль обнимает друзей, а Робин молча идёт с командой.'}
]);

EXT_PART('onepiece',[
{t:'Джая: город без закона',s:'Остров Джая кишит пиратами и хвастунами, а в порту вас встречает Беллами-Гиена со своей шайкой. Он высмеивает мечты о Ван Пис: «Времена героев прошли!» Луффи молча слушает, а потом одним ударом вбивает насмешника в землю. Тени Разлома шевелятся в тавернах, подбирая обиженных. Ветер треплет паруса, а Луффи уже тянется резиновой рукой к мачте.',e:[['Беллами-Гиена','🐺','Berserker',1.3],['Пират Беллами','🏴‍☠️','Lancer',1],['Тень-хвастун','👤','Rider',1]],w:'Беллами лежит в пыли и не понимает, как его победил улыбающийся мальчишка. Луффи отряхивает шляпу: «Мечты не смешные». Вы идёте дальше, к лесу, где живёт странный старик.'},
{t:'Крикет и золото Ноландо',s:'В джунглях Джаи живёт Монтэ Крикет, потомок исследователя Ноландо, которого когда-то объявили лжецом. Он ищет остров в небе, где, по легенде, лежит золотой город. Санджи и Зоро смеются, но Луффи горит: «Отправимся туда!» Из чащи выходят Тени Сарки, подстерегающие мечтателей. Вокруг вспыхивают факелы, и вы слышите тяжёлое дыхание врагов за спиной.',e:[['Сарки-Тень','🐒','Berserker',1.3],['Тень охотника','👤','Archer',1],['Тень охотника','👤','Saber',1]],w:'Тени растаяли, а Крикет шепчет: «Ноландо не врал, он просто не успел вернуться». Ветер приносит колокольный звон, будто из самого неба. Команда решительно готовит Мерри к взлёту.'},
{t:'Нокап-Стрим',s:'Чтобы добраться до неба, нужно оседлать Нокап-Стрим, гигантский поток воды, взлетающий в облака. Мерри дрожит на волнах, Нами кричит команды, а из глубин показывается Сарки в маске морского чудища. Разлом делает его втрое злее, но времени для драки почти нет. Над крышей Джаи вспыхивает молния, а вы сжимаете оружие покрепче и готовитесь к бою.',e:[['Мегалодон-Тень','🦈','Berserker',1.6],['Морской пират-Тень','👤','Rider',1.1]],w:'Мерри взмыла ввысь на столбе воды и вылетела в облака. Команда орёт от восторга, Усопп валится на палубу, а вокруг расстилается море, у которого нет дна.'},
{t:'Остров Ангел',s:'На Острове Ангел вас встречает девочка Конис с ручной птицей Пагайей. Люди неба носят крылья, а вместо валюты используют раковины. Вдруг появляется сторож Гамма-Фрок, и Конис просит прощения: «Правила бога строги». Вы вместе с Луффи улыбаетесь: «Мы просто в гости». Вы прикрываете спину Луффи и чувствуете, как холодный ветер Разлома касается затылка.',e:[['Страж Небесного Острова','⚔️','Lancer',1.3],['Жрец-Тень','👤','Caster',1.2],['Небесный Дозорный','🪽','Archer',1]],w:'Стражи отступили, а Конис ведёт вас на Верхний Уровень. Она смотрит вдаль: «Там живёт Бог Эниру, он решает, кому жить, а кому нет».'},
{t:'Жрец Сатори',s:'Первым на пути стоит Сатори, жрец с бородой, читающий мысли. Он встречает Луффи презрительно: «Я слышу каждую твою мысль». Луффи ухмыляется и думает только об одном — мясе. Сатори запутывается, а вы стоите рядом и спокойно готовите атаку, скрывая свои планы. Мерри скрипит, а Зоро и Усопп встают рядом, готовые сражаться до конца.',e:[['Жрец Сатори','🙏','Caster',2,1.3],['Страж Эниру','🛡️','Lancer',1.2]],w:'Сатори повержен, и его борода развевается на ветру. Луффи хохочет: «Мысли читать он умеет, а драться нет». Острые облака расступаются, ведя вас дальше по тропе.'},
{t:'Испытание Шуры',s:'Вы вступаете в Испытание Шуры, где жрец Шура, воин с копьём, подготовил ловушки с облачной верёвкой. Нами и Зоро проходят их с трудом. Санджи вздыхает: «Скорее бы этот бог сдох». Разлом светится в облаках, искажая каждого стража. Вы встаёте рядом с Санджи, и ваши тени сливаются с облаками.',e:[['Шура, Небесный Копейщик','🔱','Lancer',1.5],['Страж-Тень','👤','Archer',1.2],['Страж-Тень','👤','Saber',1.2]],w:'Шура повержен, и пёстрая верёвка рухнула в пропасть. Вы слышите далёкий звон Золотого Колокола, а Вайпер, воин Шандии, наблюдает за вами из тени.'},
{t:'Шандия и Вайпер',s:'Шандия — потомки, жившие на земле Ноландо. Вайпер, их воин, защищает честь предков. Он прижимает рукой ракушку с ядом: «Все, кто нападает на Апер-Ярд, умирают». Вы становитесь рядом с ним, ведь Эниру давно хочет уничтожить эту землю. Вы слышите шёпот жрецов и понимаете, что эта битва решает судьбу целого народа.',e:[['Вайпер','🐍','Archer',1.7,1.3],['Пират Эниру','👤','Rider',1.2]],w:'Вайпер выслушал вас и опустил оружие. «Значит, вы не наши враги», — сказал он тихо. Его воины идут вместе с Соломенной Шляпой на золотой Зов.'},
{t:'Игры Эниру',s:'Эниру — Бог, чей плод Горо-Горо даёт власть над молниями, — устраивает Игры, чтобы очистить Верхний Уровень. Он сжигает участников и смеётся над мольбами. Санджи нашёл ловушку, а Нами вскрикнула: «Он слышит всё!» Луффи выходит вперёд и хлопает по резиновой груди. Небо рычит, воздух пахнет озоном, и у вас по спине бегут мурашки.',e:[['Гром-Тень Эниру','⚡','Caster',1.6],['Небесный Палач','🪓','Berserker',1.5],['Жрец-Тень','👤','Archer',1.2]],w:'Ловушки сломлены. Вы прорываетесь к Кораблю Максим, где Эниру собирается улететь на Луну и оставить остров в пепле. Золотой Колокол ждёт своего часа.'},
{t:'Ковчег «Максим»',s:'Ковчег Максим сверкает над облаками, и Эниру уже готов уничтожить остров. Нами разбирает механизм, Усопп и Чоппер тащат людей к спасению. «Ты бог? — говорит Луффи. — Тогда я надеру тебе зад!» Разлом сгущается вокруг ковчега, превращая его в чудовище. Вы бежите по мокрым доскам, а над головой рокочет гром, заставляя дрожать даже облака.',e:[['Ковчег-Страж','🤖','Rider',1.8],['Электро-Тень','👤','Archer',1.3],['Электро-Тень','👤','Lancer',1.3]],w:'Механизмы Максима рухнули, и путь к Эниру открыт. Резиновое тело Луффи не боится молний. Впереди решающая битва: над облаками воцарилась тишина, будто небо задержало дыхание.'},
{t:'Золотой Колокол',b:1,s:'Эниру швыряет копья молний, но Луффи, сделанный из резины, только смеётся. Каждый удар отдаётся дрожью в облаках, и вы чувствуете, как Разлом питается его гневом. Зов Колокола звучит всё громче: «Мы вернулись, Ноландо!» — кричит Луффи и бьёт золотым шаром прямо в лицо бога. Вы зовёте героев Астрала, и их силуэты вспыхивают золотом в грозовой вышине.',e:[['Эниру, Бог Молний','⚡','Caster',4.5,1.5],['Тень Разлома','👤','Berserker',.7]],w:'Эниру пал, и Золотой Колокол зазвонил на весь мир. Крикет слышит его с земли и улыбается сквозь слёзы. Небесный остров ожил, а команда получила ключ к следующему шагу.'},
{t:'Аква Лагуна',s:'После неба Мерри трещит по швам: киль сломан, борта дрожат. Вы входите в Уотер Севен, город каналов и верфей, в сезон Аква Лагуны, когда приливная стена накрывает улицы. Нами с ужасом смотрит на воду: «Скорее в порт!» Луффи с Усоппом бегут за плотником, а Разлом гонит по каналам хищных теней.',e:[['Морской Король-Тень','🐉','Rider',1.3],['Тень канала','👤','Archer',1]],w:'Мерри доползла до причала, но плотники качают головой: её уже не починить. Луффи упрямо отвечает, что найдёт другого мастера, а над каналами загорается вечерний свет.'},
{t:'Верфь Галлей-Ла',s:'Мэр города Айсберг смотрит на киль Мерри и говорит прямо: «Этот корабль умер. Его можно только проводить». Луффи слышать этого не хочет и хлопает дверью. Усопп молчит, сжав кулаки. В это время на верфи вспыхивает драка: Франки Фемили ищет ссоры, а из-под воды лезут искажённые пираты.',e:[['Заводила Франки Фемили','🔨','Berserker',1.2],['Пират-Тень','👤','Lancer',1],['Пират-Тень','👤','Saber',1]],w:'Драка утихла, но слова Айсберга остались. Санджи, Зоро и Нами уходят искать жильё, а Усопп остаётся один на пристани, разглядывая треснувшие доски Мерри.'},
{t:'Ночной налёт на Айсберга',s:'Ночью в особняк Айсберга проникают люди в масках Соломенной Шляпы и ранят мэра. Робин ушла куда-то ещё раньше, и город подозревает вас. Мировое Правительство уже знает, кто виноват. Вы бросаетесь по крышам за поджигателями, а в темноте тьма Разлома подкрепляет налётчиков. Кто-то в тени явно знает больше, чем говорит.',e:[['Замаскированный Агент','🎭','Saber',1.4],['Наёмник-Тень','👤','Rider',1.1],['Наёмник-Тень','👤','Archer',1.1]],w:'Налётчики скрылись, оставив Айсберга при смерти. Потом выясняется, что это было делом CP9. Франки Фемили клянётся отомстить, а вы слышите, как в тумане захлопывается ловушка.'},
{t:'Дуэль Луффи и Усоппа',s:'Усопп украл деньги на ремонт и решил уйти, обиженный на Луффи. Нет, всё сложнее: он услышал, что Мерри не спасти, и рассердился на капитана, который не хочет слушать. Луффи вызывает его на бой прямо в порту. «Если ты уйдёшь, я не удержу!» — кричит Усопп, размахивая кулаками.',e:[['Усопп, Король Снайперов','🎯','Archer',1.6,1.2],['Тень обиды','👤','Berserker',1.2]],w:'Луффи побеждает, но не радуется. Усопп уходит, гордо подняв голову, а Мерри в последний раз ласково скрипит. Вы держите шляпу капитана и молчите.'},
{t:'Франки, Пушка-Голова',s:'Франки Фемили напал на Усоппа и отобрал деньги, а теперь сам выходит вам навстречу: киборг с пушкой в руке и гривой синих волос. «Суперррр!» — орёт он, выстреливая из кулаков. Луффи скрипит зубами: «Верни деньги и извинись!» Разлом заставляет его машины реветь втрое громче обычного.',e:[['Франки','🤖','Lancer',2],['Механизм-Тень','👤','Rider',1.1]],w:'Франки рухнул, обессиленный, и признался, что тоже любит корабли, но ненавидит Правительство за Тома. Слова падают тяжёлым грузом, и вы понимаете: враг у вас общий.'},
{t:'Прощание с Мерри',s:'На берегу Луффи, Зоро и вы стоите перед Мерри, объятой пламенем. Дух корабля тихо шепчет: «Спасибо, что плыли со мной». Все плачут, даже Зоро отворачивается. Но траур прерывает взрыв: CP9 возвращается за Робин, а Тени Разлома тянутся за ними следом. Слёзы капают на угли, и никто не стыдится их.',e:[['Агент CP9','🕶️','Archer',1.4],['Тень шпиона','👤','Rider',1.1],['Тень шпиона','👤','Lancer',1.1]],w:'Агенты отступили, но Робин ушла с ними, чтобы спасти вас от Правительства. Пламя Мерри гаснет, а Луффи сжимает кулаки: «Мы вернём Робин, что бы ни случилось».'},
{t:'Морской поезд «Рокет-Мен»',s:'Вы садитесь на Морской Поезд «Рокет-Мен», идущий к Эниес Лобби. Вместе с вами Франки, Санджи, Зоро, Чоппер, Нами и Усопп в маске Снайпера. Роб Луччи впереди, Спандам ещё дальше. Ветер воет за окнами, а вагоны трясёт от Теней Разлома, вцепившихся в рельсы. Вода под рельсами чернеет, будто предупреждая об опасности.',e:[['Кабу','🦌','Archer',1.4],['Фукуро','🤐','Rider',1.3],['Вагонная Тень','👤','Lancer',1.2]],w:'Поезд мчится сквозь бурю, и в вагоне впервые звучит общая песня: «Мы идём за Робин!» Сквозь ливень уже видна огромная башня Эниес Лобби с Флагом Правительства.'},
{t:'Ворота Правосудия',s:'На острове вас встречает Спандам, глава CP9, с ключом от наручников Робин. Ворота закрыты, а Правительство объявляет по всему Гранд Лайну: «Пираты объявлены врагами мира». Луффи вскидывает руку: «Я заберу Робин, а вы мне мешаете!» Санджи и Зоро рубят путь сквозь море солдат. Сирены воют, и весь остров просыпается от грохота.',e:[['Спандам','🕴️','Archer',1.5],['Морской Пехотинец','🎖️','Lancer',1.2],['Морской Пехотинец','🎖️','Saber',1.2]],w:'Ворота пали, и вы прорываетесь к Башне Правосудия. Спандам испуганно уползает по коридору, а Робин уже слышит шум боя и прижимается к решётке.'},
{t:'Зоро против Каку',s:'Зоро и Каку встречаются на мосту над пропастью. Каку — мастер меча и Шести Стилей, а Зоро скрестил три клинка. «Ты сильный», — хмыкает Каку. «А ты хитрый», — отвечает Зоро. Вы прикрываете спину и наблюдаете за дуэлью, зная, что кто-то из них уже не уйдёт живым.',e:[['Каку','🦒','Saber',1.8,1.3],['Тень CP9','👤','Archer',1.2]],w:'Зоро одерживает победу, но получает тяжёлые раны. Каку падает, признав силу соперника. Мост дрожит, а впереди ждёт Роб Луччи — самый опасный человек Башни Правосудия.'},
{t:'Флаг Правительства',b:1,s:'Робин стоит у обрыва, и Роб Луччи хохочет: «Мир не узнает, что ты жива». Луффи вырывается из-под обломков и кричит: «Робин, скажи мне, чего ты хочешь!» — «Я хочу жить!» Луффи поднимает руку, и над башней звучит клич: «Сожгите флаг Правительства!» Вся команда поднимает кулаки к небу, крича одним голосом.',e:[['Роб Луччи, Леопард','🐆','Caster',4.5,1.5],['Джабра','🐺','Berserker',.8],['Тень CP9','👤','Lancer',.7]],w:'Роб Луччи пал. Флаг Правительства сгорает над башней, а Робин рыдает от счастья. Вся команда кричит «Да!», и над морем слышен рёв корабля «Флаинг Ламб».'},
{t:'Санни и Бермудский треугольник',s:'Франки достраивает «Тысячу Санни» с львиной головой на носу. Мерри шепчет из памяти: «Плывите дальше». Корабль входит в Бермудский треугольник, где туман закрывает солнце, а по воде дрейфуют обломки. Из мглы слышится хохот и пение скрипки, а Разлом оживляет мёртвые корабли. Где-то во мгле скрипит чужая мачта, и по спине бежит холодок.',e:[['Корабль-Призрак','🚢','Rider',1.4],['Скелет-Тень','💀','Saber',1.1],['Скелет-Тень','💀','Archer',1.1]],w:'Корабль-Призрак рассыпался в щепки, и туман немного отступил. На палубу вскарабкался смеющийся скелет в афро и попросил показать ему трусики. Луффи хохочет: «Ты мой музыкант!»'},
{t:'Брук и потерянная тень',s:'Брук рассказывает: он умер много лет назад, а его тень украл Гекко Мория. Он бродит по морю, потому что обещал вернуться к киту Лабуну. «Йо-хо-хо! Обещание надо сдержать!» Огромный корабль-остров Триллер-Бак выплывает из тумана, и на его палубе стоит тьма. Вы переглядываетесь: странный гость может оказаться и другом, и бедой.',e:[['Дозорный Зомби','🧟','Lancer',1.2],['Тень Мории','👤','Caster',1.2]],w:'Зомби разбежались по палубам. Луффи горит желанием вернуть тень Бруку, а Нами дрожит и просит не идти в замок. Но остров уже не отпустит вас так просто.'},
{t:'Замок Гекко Мории',s:'В замке Триллер-Бака зомби танцуют вальс, а хозяин, Гекко Мория, собирает тени сильнейших пиратов. Ориста, дворцовая красавица, поёт заклятие. Санджи в восторге, Усопп боится, а вы чувствуете, как Разлом сгущается в стенах, превращая мертвецов в чудовищ. Свечи гаснут одна за другой, и коридоры наполняются шёпотом.',e:[['Зомби-Дворецкий','🧟','Lancer',1.3],['Ориста-Тень','👻','Caster',1.3],['Зомби-Страж','🧟','Berserker',1.2]],w:'Стража повержена, но Ориста в слезах шепчет: «Мория украл тени у сотен людей». Вы находите лабораторию, где пахнет формалином, а в стеклянных колбах мерцают тени.'},
{t:'Доктор Хогбэк',s:'В лаборатории Доктор Хогбэк собирает трупы, чтобы оживлять мертвецов. Его ассистентка Цереа парит призраком по комнатам. Он гордо демонстрирует Огара, огромного зомби с татуировкой. «Вы станете моими образцами!» — хохочет доктор. Чоппер побледнел, но встал впереди друзей. Из-за двери доносится скрежет пил и тихий, липкий смех.',e:[['Доктор Хогбэк','🧑‍⚕️','Caster',1.5],['Цереа-Призрак','👻','Archer',1.2],['Зомби-Слуга','🧟','Lancer',1.2]],w:'Хогбэк повержен. Цереа падает на колени и признаёт: «Хозяин безумен». Вы находите ключ к комнате Мории и идёте по тёмному коридору, слыша, как рычит великан.'},
{t:'Огар, Великан-Зомби',s:'Огар — самый мощный зомби Мории, воин с силой сотни мечников. Санджи, Зоро и Луффи встают в круг, а великан замахивается кулаком. «Гекко Мория — наш хозяин», — гудит он. Разлом дрожит в его глазах, делая удары всё яростнее. Вы зовёте героев и вступаете в бой.',e:[['Огар, Зомби-Великан','🧟','Berserker',2.1,1.4],['Зомби-Страж','🧟','Lancer',1.2]],w:'Огар рухнул с грохотом, разбив колонну. Ориста бросается к друзьям, а Луффи вырывает дверь в тронный зал. За ней раздаётся низкий смех Мории и звон цепей.'},
{t:'Пираты Мории',s:'Мория выпускает лучших: Гекко-Мэйд, Хоггбэк, зомби-отряды и Ориста. Он собирает армию мёртвых воинов, вложив в них тени героев прошлого. «Кто из вас достоин стать моим слугой?» — ревёт он. Нами прячется за Санджи, Зоро выхватывает клинки. Стены замка дрожат, а по лестницам топочут сотни ног.',e:[['Зомби-Мечник','🧟','Saber',1.4],['Зомби-Стрелок','🧟','Archer',1.4],['Зомби-Кулак','🧟','Berserker',1.3]],w:'Армия зомби пала, но Мория лишь довольно кивает и делает шаг вперёд. Он вкладывает в себя тень легендарного Кайдо. Стены замка тряслись от каждого его шага.'},
{t:'Санджи против Ориста',s:'Санджи танцует среди свечей, чтобы отвлечь Ористу. Она сама была жертвой Мории и просит освободить её от заклятья. «Любая женщина достойна свободы», — отвечает Санджи и подаёт ей руку. Разлом вцепился в её тень и не отпускает, и вы вступаете в бой. Луна освещает зал, и тени на полу кажутся живыми.',e:[['Ориста, Призрачная Певица','👻','Caster',1.6],['Тень Мории','👤','Archer',1.2]],w:'Заклятие развеяно. Ориста оседает на пол, плача от облегчения: «Спасибо, что не забыли меня». Санджи кланяется и провожает её к выходу, где уже светает.'},
{t:'Битва за тени',s:'Луффи поглотил сто теней зомби через Ниса-Ниса и стал огромным, как великан. Он раздавливает лабораторию, а Мория смеётся: «Ты только тень, Соломенная Шляпа!» Вы поддерживаете друзей, ведь без теней Брук и остальные не смогут видеть солнце. Разлом усиливает противников. Воздух трещит от силы, которой не место в живом мире.',e:[['Гекко Мория, Тень-Тиран','👑','Caster',2.2,1.4],['Огар-Тень','🧟','Berserker',1.4],['Зомби-Великан','🧟','Lancer',1.3]],w:'Мория повержен, но ещё не сломлен. Он готовит последний удар, в котором собрал сотни теней. Небо над замком чернеет, а вы уже слышите вдали шаги Кумы.'},
{t:'Гигант из тысячи теней',s:'Мория собрал в себя тени тысяч людей и превратился в чудовищного гиганта. Луффи, потерявший силы, встаёт снова и кричит: «Я стану Королём Пиратов!» Вы держите строй рядом с Зоро и Санджи, а Разлом раздувает исполина, как огромный чёрный шар над замком. Казалось, сам остров затаил дыхание и ждёт исхода этой схватки.',e:[['Гекко Мория, Тень-Тиран','👑','Caster',2.2,1.5],['Тень Мории','👤','Berserker',1.2]],w:'Мория повержен, а тени вернулись владельцам. Брук получает свою тень и плачет без слёз. Но победа неполная: на острове появляется Кума, и в воздухе пахнет бедой.'},
{t:'Боль Зоро',b:1,s:'Бартоломью Кума, Шичибукай, стоит над лежащей командой и хочет забрать голову Луффи. Зоро поднимается на дрожащих ногах: «Я ничего не помню, ничего не было». Он берёт боль Луффи на себя, а вы встаёте между Кумой и командой, зовя героев из Врат Астрала. Никто на палубе не решается дышать, пока идёт бой.',e:[['Бартоломью Кума','🐻','Berserker',4,1.5],['Пасифиста-Тень','🤖','Lancer',.8],['Пасифиста-Тень','🤖','Archer',.8]],w:'Кума уходит, оставив Зоро израненным, но живым. Команда клянётся никогда больше не быть такой слабой. Мерцающие Врата Астрала ведут вас к архипелагу Саободи, где ждёт Мариенфорд.'}
]);

EXT_PART('onepiece',[
{t:'Архипелаг Саободи',s:'Команда выходит к мангровым рощам Саободи, где пузыри катятся по воздуху, а на улицах сидят Небесные Драконы. Луффи ворчит, что всё блестит, а Хатчан снова всплывает из порта: рыболюд просит помощи. Внезапно над островом вспыхивает Разлом, и по городу поползли Тени, шепчущие о Мариенфорде. Позади остаются пузыри, а впереди только гул сирен.',e:[['Хаос-Тень','👤','Rider',1.2],['Тень охранника','👤','Lancer',1.1],['Пират Нового Мира','🏴‍☠️','Saber',1.1]],w:'Тени растаяли в пузырях, а вы прячете лица под капюшонами. Мир вокруг напряжён: одиннадцать сверхновичков собрались на архипелаге, и все понимают, что скоро кто-то рванёт всё вверх дном.'},
{t:'Одиннадцать Сверхновичков',s:'В порту Саободи сталкиваются Юстасс Кидд, Трафальгар Ло, Базил Хокинс, Апу и другие капитаны с наградами выше ста миллионов. Небесный Дракон Чарлосс выхватывает пистолет, а Луффи в ярости бьёт его в лицо. «Я не могу смотреть, как людей превращают в рабов!» — рычит он. Толпа шепчется, что этот день войдёт в хроники Гранд Лайна.',e:[['Небесный Стражник','🎖️','Archer',1.3],['Пасифиста PX','🤖','Lancer',1.4],['Тень Дозора','👤','Saber',1.1]],w:'Удар Луффи разорвал пузырь и весь остров. Адмирал Кидзару уже спускается с высоты, а Ло шепчет вам: «Бежим. Сейчас здесь начнётся ад».'},
{t:'Жёлтая Обезьяна',s:'Адмирал Кизару лучится светом. Он равнодушно нажимает пальцем, и лучи сжигают улицы. «Ты слишком шумный, Соломенная Шляпа». Пасифисты падают с неба один за другим, а Разлом усиливает и без того невыносимую боль. Вы прикрываете друзей и вызываете героев. Свет слепит глаза, и вы прикрываетесь ладонью от сияния.',e:[['Адмирал Кизару','⚡','Archer',2,1.4],['Пасифиста PX','🤖','Lancer',1.3],['Пасифиста PX','🤖','Saber',1.3]],w:'Кизару отступает, а Кума касается лап друзей одну за другой. Вас вышвыривает в небо, и мир вокруг превращается в свет. Вы падаете туда, где нет ни друзей, ни моря.'},
{t:'Разбросанные по свету',s:'Куб Кумы отправил каждого в свой угол мира: Зоро на остров Кума, Нами на остров погоды Везерию, Санджи на остров Каматбакка. Вы очнулись в тёмной пещере, а над головой висит гигантская летучая мышь. Тени Разлома ползут по стенам. Каждый из вас падает в своё неизвестное, и страх сжимает горло.',e:[['Летучая Тень','🦇','Rider',1.3],['Теневой Хищник','👤','Berserker',1.3]],w:'Тьма отступила, а на стене вы находите вырезанную надпись Луффи: «Встретимся через два года». Вы понимаете, что это не просто прощание, это клятва не сдаваться.'},
{t:'Император Амазон Лили',s:'Луффи выброшен на остров, где царит императрица Боа Хэнкок. Женщины-воины захватывают мальчишку, а Хэнкок влюбляется с первого взгляда. Но под маской любви лежит боль: Небесные Драконы клеймили её рабыней. Вы выходите вперёд, чтобы поддержать его в Амазон Лили, пока Разлом стягивает искажённых стражниц. Слухи о дерзком мальчишке уже облетели все женские острова.',e:[['Кува-Джельм','🐍','Lancer',1.8],['Тень Кувы','👤','Archer',1.4]],w:'Хэнкок сердито кивает: «Тебя пощадят». Она решает помочь Луффи попасть в Импел Даун, ведь там держат Эйса. Гигантская змея Сальоме ждёт у берега.'},
{t:'Импел Даун: врата ада',s:'Тюрьма Импел Даун — подводная крепость с шестью уровнями. Луффи проскальзывает в неё под видом узника, а вы держитесь рядом. У ворот встречает надзиратель Магеллан: ядовитый Хидра-хидра. «Никто не убежит из моей тюрьмы», — шипит он, выплёвывая яд. Крики узников эхом отзываются в каменных коридорах без солнца.',e:[['Магеллан','☠️','Berserker',2,1.4],['Заключённый-Тень','👤','Lancer',1.2],['Тюремный Страж','🎖️','Saber',1.2]],w:'Магеллан скрылся в ядовитом тумане, оставив на Луффи болезнь. Чоппер бы вылечил, но его нет рядом. Вас спасает Ивенков: странный человек в женской одежде, король революционеров.'},
{t:'Багги и Мистер 3',s:'На нижних уровнях Багги встречает Луффи с удивлением. «Я не стану тебе помогать!» — вопит клоун, но обещание свободы решает дело. Мистер 3 рисует воском лестницу, а вокруг ревут заключённые. Разлом гонит по клеткам чудовищ из мёртвых и живых. Вокруг лязгают решётки, и запах сырости бьёт в нос.',e:[['Багги-Клоун','🤡','Caster',1.5],['Тюремный Лев Ру','🦁','Berserker',1.6],['Заключённый-Тень','👤','Rider',1.2]],w:'Багги и Луффи пробили дорогу, за ними идут сотни каторжников. Джимбей, бывший Шичибукай, ждёт на нижнем уровне, страдая от ран. «Луффи, я твой должник», — говорит рыболюд.'},
{t:'Побег из Импел Дауна',s:'Тюрьма ревёт сиренами: узники бегут по лестницам, и Магеллан открывает огонь. Ивенков и Джимбей прикрывают отход, а Луффи тащит Эйса к выходу, но Эйса там нет — его уже увезли на Мариенфорд. Пиратов ждёт Дозор на воде. Позади ревут сирены, а впереди только кипящее море и надежда.',e:[['Магеллан, Ядовитый Дракон','☠️','Berserker',2,1.5],['Морской Пехотинец','🎖️','Lancer',1.1],['Морской Пехотинец','🎖️','Archer',1.1]],w:'Побег удался, и на корабле раздаётся радостный рёв. Но Луффи безмолвен: его брата казнят завтра. Дозор строит вокруг Мариенфорда стену из адмиралов и линкоров.'},
{t:'Война на Мариенфорде',s:'Всё море затаило дыхание: Белоус, Император Вайтбёрд, вышел на войну. Вокруг эшафота выстроились адмиралы, Шичибукай и тысячи солдат. «Эйс — мой сын, — гремит Вайтбёрд. — Кто тронет моих детей, умрёт». Вы стоите рядом с Луффи и готовитесь к бою. Небо над бухтой чернеет от дыма и пушечных залпов.',e:[['Адмирал Аокидзи','❄️','Archer',1.5],['Шичибукай-Тень','👤','Caster',1.4],['Морской Пехотинец','🎖️','Lancer',1.1]],w:'Первые ряды Дозора смяты, ледяные волны замёрзли под ногами. Эйс на эшафоте смотрит вниз и не верит: за ним пришла вся армия Вайтбёрда, а с ней младший брат.'},
{t:'Эйс и Акаину',b:1,s:'Луффи прорвался к Эйсу и разрубил цепи Ключом Бака. Но Акаину, Адмирал Магма, преградил путь. «Огонь Эйса — ничто перед моим», — глумится он. Он бьёт в грудь Эйса, закрывающего Луффи, и мир замирает. Вы бросаетесь на Акаину, и вокруг закипает Разлом. Время будто замедляется, и весь мир смотрит на этот миг.',e:[['Адмирал Акаину','🌋','Berserker',4,1.6],['Хаос-Тень','👤','Lancer',.8],['Хаос-Тень','👤','Archer',.8]],w:'Эйс погиб, шепча: «Спасибо, что любили меня». Луффи теряет сознание, а Джимбей уносит его с поля боя. Вайтбёрд тоже падает, но успевает крикнуть: «Ван Пис существует!»'},
{t:'Слёзы после войны',s:'Луффи очнулся на острове Хэнкок, весь в бинтах, и не хочет жить. Джимбей кормит его, а вы сидите рядом и слушаете, как воет ветер. «Я слабый», — шепчет Луффи. Вдруг приходит Рэйли, Тёмный Король, и говорит: «Два года. Стань сильнее — и вернёшься». Разлом уже караулит у порога.',e:[['Тень Печали','👤','Caster',1.3],['Тень Отчаяния','👤','Berserker',1.4]],w:'Луффи встал. Он кричит на весь остров, что больше никого не потеряет. Рэйли кивает: «Тогда пойдём на Рускаину». Вы обнимаете капитана, зная, что впереди долгая дорога.'},
{t:'Рускаина: остров тренировок',s:'Рэйли учит Луффи Хаки Вооружения и Наблюдения. Каждый день Луффи сражается со зверьми, превращающимися в сильные Тени. «Хаки — это воля», — объясняет старик. Вы тоже тренируетесь, пробуждая дар Призыва и осваивая новые связи с героями Астрала. Ни на день не прекращаются тренировки, и раны заживают лишь к утру.',e:[['Тень Гориллы','🦍','Berserker',1.4],['Гигантский Кабан','🐗','Lancer',1.3],['Хищная Тень','👤','Rider',1.2]],w:'Через год Луффи стал совсем другим. Он победил всех зверей острова и научился чувствовать врага сквозь стену. Рэйли улыбается: «Теперь ты готов вернуться в море».'},
{t:'Два года спустя',s:'Два года прошли. Команда собирается на Саободи, каждый вернулся другим: Зоро с тремя мечами и шрамом, Санджи в новом облике, Нами с погодным жезлом, Усопп с Хеви-Хаки. «Ну что, вернулись?» — улыбается Луффи. Вы обнимаете каждого и садитесь на корабль. Все вспоминают, ради чего два года терпели боль и одиночество.',e:[['Дозорный-Тень','👤','Lancer',1.2],['Пасифиста PX','🤖','Berserker',1.5],['Морской Пехотинец','🎖️','Saber',1.1]],w:'Команда сплотилась вновь. Франки покрыл Санни медью, и корабль готов нырнуть на дно океана. Вы садитесь на борт и слышите общее: «Едем на остров Рыболюдей!»'},
{t:'Путь на дно моря',s:'Санни погружается под Красную Линию на глубину десяти тысяч метров. Вокруг плавают светящиеся рыбы и морские короли. Внезапно пираты Флигера пытаются отобрать корабль: «Отдайте медь, мы вас утопим». Команда смеётся: два года назад так бы не случилось. Тишина глубины давит на уши, и корабль слегка потрескивает.',e:[['Пират Флигера','🏴‍☠️','Rider',1.3],['Морской Король-Тень','🐉','Berserker',1.5],['Пират-Тень','👤','Lancer',1.1]],w:'Пираты уплыли, а Санни продолжил путь. Через часовой пузырь корабль ныряет ещё глубже, и внизу вспыхивает огромный город: остров Рыболюдей с прозрачным куполом.'},
{t:'Остров Рыболюдей',s:'Город в глубине сияет кораллами и китами, а королева Отохиме поёт в пузыре. Луффи мигом теряется, и его забирают Хордди Джонс со своей шайкой Нового Рыболюдского Пиратского Флота. «Люди должны платить за преступления», — рычит он. Разлом усиливает ненависть. Вокруг проплывают огромные тени, а сверху сквозь воду мерцает свет.',e:[['Хордди Джонс','🦈','Berserker',1.8,1.3],['Пират Хордди','🏴‍☠️','Lancer',1.2],['Пират Хордди','🏴‍☠️','Archer',1.2]],w:'Хордди отступил, но не сломлен. Отохиме передаёт Луффи послание о Красной Линии и Ионе. Она просит спасти остров от наступающей ненависти, что растёт в сердцах людей.'},
{t:'Дворец Рюгу',s:'Во дворце Рюгу король Нептун встречает гостей, а принцы, Фукаборши и Шираоши, помогают вам осмотреться. Хордди захватывает Отохиме и убивает Нептуна. Слёзы королевы превращаются в пузыри. Вы сжимаете кулаки и понимаете: без вашей помощи остров обречён. Позолоченные залы дворца гулко отзываются на каждый ваш шаг.',e:[['Вандер Деккен IX','🐟','Rider',1.6],['Убийца-Тень','👤','Saber',1.3],['Пират Хордди','🏴‍☠️','Lancer',1.2]],w:'Вы вырываете Отохиме из рук пиратов. Её глаза блестят, а голос дрожит: «Воля Иона указывает на вас, Луффи». Над островом зловеще гремит гром, будто небо тоже слушает.'},
{t:'Кровь Нептуна',s:'Хордди Джонс запустил Ноах — огромный корабль, который упадёт на остров Рыболюдей и раздавит его. Луффи и принцы бросаются останавливать чудовище. «Я не допущу, чтобы Рыболюдей уничтожили!» — кричит Фукаборши. Разлом кипит вокруг Ноаха, подпитывая корабль. Гигантский корабль нависает над городом, как огромная чёрная гора.',e:[['Кладовщик Ноаха','🚢','Berserker',1.7],['Пират-Тень','👤','Rider',1.3],['Пират-Тень','👤','Archer',1.3]],w:'Ноах замер, а Луффи бросился в последний бой. Вы слышите гул Океана, и все морские короли идут на помощь. Остров Рыболюдей ещё стоит, и надежда жива.'},
{t:'Шираоши и звезда Ион',s:'Принц Шираоши, самый юный и самый слезливый, ведёт вас в Морской Лес к Иону, древней русалочьей воле. Пираты Хордди преследуют вас по пятам. «Отохиме верила, что человек и рыболюд однажды подружатся», — шепчет он. Вы защищаете принца, пока Разлом душит подводные заросли чёрным дымом. Гнев и печаль смешиваются в его голосе, а руки дрожат.',e:[['Пират-Тень','👤','Lancer',1.3],['Морской Охотник Хордди','🏴‍☠️','Archer',1.3],['Пират-Тень','👤','Rider',1.2]],w:'Пираты разбежались среди водорослей. Шираоши вытирает слёзы: «Спасибо, что не бросили». Вы слышите далёкий грохот падающего Ноаха и бежите к палубе, где ждёт главный враг.'},
{t:'Гнев Хордди',s:'Луффи и принцы встречают Хордди на палубе Ноаха. Рыболюд превращается в Гигантскую Акулу, сжигая всё вокруг. «Люди будут страдать!» — рычит он. Луффи улыбается: «А я — Луффи, и я не дам вам этого сделать». Вы бросаетесь на помощь. Волны бьются о борта, и остров содрогается от ударов.',e:[['Хордди Джонс, Кровавая Акула','🦈','Berserker',2,1.5],['Пират-Тень','👤','Lancer',1.2],['Пират-Тень','👤','Saber',1.2]],w:'Хордди падает, но его ненависть не гаснет. Санджи и Зоро добивают последних пиратов, а Отохиме с надеждой смотрит вперёд: остров Рыболюдей спасён.'},
{t:'Слово Ноаха',s:'Ноах остановлен, но Хордди в последний раз ревёт: «Я утащу тебя за собой!» Его тело светится Разломом, он раздувается, готовый рухнуть на остров вместе с Ноахом. Луффи выпрямляется: «Ты хочешь драться? Тогда нужна последняя битва». Вы зовёте героев. Даже киты в глубине замолкают, слушая эхо этой схватки.',e:[['Хордди Джонс, Разломный Тиран','🦈','Berserker',4.5,1.5],['Тень Ноаха','👤','Caster',.7]],b:1,w:'Хордди повержен. Остров Рыболюдей ликует, а Отохиме открывает Луффи новый путь наверх. Вы всплываете на поверхность, где уже ждёт Нью-Уорлд, и команда готова к следующему шагу.'},
{t:'Пылающий остров Панк Хазард',s:'Команда высаживается на Панк Хазард: половина острова горит, половина покрыта льдом. Вдруг из тумана выходят детёныши-великаны, а на снегу лежит отрубленная нога самурая. Чоппер бледнеет, Нами кутается в куртку. «Здесь пахнет бедой», — шепчет Зоро. Разлом гудит в дымящихся лабораториях. Снег под ногами тает от жара, а дым режет глаза.',e:[['Огненный Дракон-Тень','🐲','Berserker',1.4],['Ледяной Пёс','🐕','Rider',1.2],['Тень учёного','👤','Caster',1.1]],w:'Дракон рассыпался пеплом, а из тумана выходит Трафальгар Ло с забинтованным мечом. «Вы опять на моём пути, Соломенные», — усмехается он. Вы понимаете: сюда вас привело не случайное течение.'},
{t:'Дети из лаборатории',s:'В лабораториях Панк Хазарда живут дети с телами, испорченными Дозором. Они боятся всех и ждут своих родителей. Франки разбирает замок, Санджи готовит ужин, а Тени Разлома шепчут в стенах. Дети не хотят уходить: «Нам обещали лекарство от болезни». Вы обещаете, что вернёте им дом. Детский смех эхом отзывается в стальных коридорах, вызывая тревогу.',e:[['Тень Охранника','🛡️','Lancer',1.3],['Мутант-Страж','👹','Berserker',1.4],['Тень учёного','👤','Caster',1.2]],w:'Стражи побеждены, дети выходят на свет. Ло сидит в углу и молчит, вспоминая Коразона. Вы садитесь рядом, и он рассказывает, как когда-то потерял того, кто спас его жизнь.'},
{t:'Цезарь Клаун',s:'Из глубин лаборатории выходит безумный учёный Цезарь Клаун, пожиратель газа Гасу-Гасу. «Ши-ха-ха! Дети — прекрасный материал для опытов!» Он окутывает остров ядовитым облаком. Смокер из Дозора и Таши бросаются в бой, Ло выхватывает меч. Разлом густо клубится в дыму, делая яд ещё смертоноснее. Фиолетовый дым стелется по полу и жжёт лёгкие.',e:[['Цезарь Клаун','☁️','Caster',2,1.4],['Газовая Тень','👤','Archer',1.2],['Мутант-Страж','👹','Berserker',1.3]],w:'Цезарь пойман и связан. Ло молча смотрит на него, а дети радуются: лекарства теперь не украсть. Луффи хлопает в ладоши: «Ло, давай заключим союз!» Тот угрюмо кивает, к общему удивлению.'},
{t:'Союз двух капитанов',s:'На острове Ло и Луффи заключают Союз Пиратов: цель — свалить Кайдо. Самураи из Вано, в том числе Кин’эмон и Момо, слушают с надеждой. «Я хочу спасти Вано», — говорит Кин’эмон. Санджи ворчит, что тесно, но соглашается. Разлом с шипением ползёт по коридорам. Вы чувствуете, как этот союз меняет расстановку сил в Новом Мире.',e:[['Тень Вегапанка','🤖','Caster',1.4],['Дозорный-Тень','👤','Archer',1.2],['Морской Пехотинец','🎖️','Lancer',1.1]],w:'Клятва скреплена чашей саке. Корабль «Тысяча Санни» взмывает вверх, оставив за собой пламя и лёд. Впереди ждёт остров, о котором Ло говорил шёпотом: Дресс Роза.'},
{t:'Мастер Смайл',s:'Перед вами Дресс Роза: остров цветов и армий игрушек. Санджи ищет сладости, а Усопп в костюме Сорри Ковбоя пытается обмануть врагов. Из-за угла выходит Ди Зигги, мастер Смайл: «Хотите играть?» Над городом льются нити Дофламинго, а Тени шепчут его имя. Цветочные аллеи наполнены смехом кукол и тихим плачем людей.',e:[['Ди Зигги','🎩','Caster',2],['Игрушка-Тень','🤖','Lancer',1.3],['Пират Донкихот','🏴‍☠️','Archer',1.3]],w:'Ди Зигги рухнул, а Усопп победоносно машет шляпой. Дрессрозианцы выходят из подвалов. Вы слышите далёкий голос Рэбекки: «Мы хотим свободы!» Впереди Колизей и битва за Мера-Мера.'},
{t:'Колизей Корида',s:'В Колизее идут бои за Мера-Мера но Ми: огненный плод Эйса. Луффи в маске Лаки выходит на арену, где сражаются тысячи. Вы помогаете ему, а Ло из-за кулис ищет Сабо. «Победитель получит Огненную Силу!» — ревёт толпа. Разлом кормится жаждой крови. Трибуны ревут, песок раскаляется, и каждый шаг может стать последним.',e:[['Боец Колизея','🥊','Berserker',1.4],['Боец Колизея','🥊','Lancer',1.3],['Тень гладиатора','👤','Saber',1.2]],w:'Луффи побеждён обстоятельствами, но Сабо приходит и забирает плод. Он клянётся помнить Эйса. Вы наблюдаете, как огонь возвращается брату, и тихо радуетесь.'},
{t:'Сабо и Огненный кулак',s:'Сабо, начальник штаба революционеров, получил Мера-Мера но Ми. Он прощается с Луффи: «Я поговорю с Эйсом по-своему». Внезапно Пират Донкихот Бэй-лан обрушивается с неба, а Лео, король карликов, требует помощи. Вы становитесь в круг с Луффи и Сабо. Пламя вспыхивает так ярко, что все зажмуриваются от жара.',e:[['Пират Донкихот','🏴‍☠️','Rider',1.4],['Тень Сабо','👤','Saber',1.2],['Игрушка-Тень','🤖','Lancer',1.2]],w:'Пираты Донкихот повержены, и Сабо благодарит вас. Лео и его карлики ликуют. Но вдали Дофламинго уже поднимает нити над городом, и небо хмурится.'},
{t:'Птичья клетка',s:'Дофламинго объявляет по всему Дресс Розе: «Птичья клетка закрыта». Нити рассекают воздух, сжимая город. Жители дрожат, а Ло требует убить Дофламинго до конца дня. Луффи, Кавендиш и Ло встают против него. Вы держите строй рядом с Зоро, пока Разлом усиливает нити. Небо над городом затянуто нитями, будто огромной паутиной.',e:[['Пират Донкихот','🏴‍☠️','Archer',1.5],['Диаманте','🃏','Saber',2],['Тень Птичьей Клетки','👤','Caster',1.3]],w:'Диаманте пал, но клетка сжимается. Кавендиш в облике Хакуба ждёт своей очереди, а Санджи с Усоппом прикрывают горожан. Дофламинго улыбается издали, готовясь к финальной игре.'},
{t:'Перо Джокера',s:'Дофламинго спускается на площадь и хохочет: «Вы — лишь игрушки». Ло, Луффи и Коразон в памяти каждого шепчут: «Держись, Ло». Нити Дофламинго сжимаются вокруг города, а Разлом усиливает его силы. Вы вызываете героев, и Ло режет нити Шамблзом. Улицы пусты, только ветер гоняет пыль и обрывки нитей.',e:[['Дофламинго','🕷️','Caster',2.2,1.5],['Пират Донкихот','🏴‍☠️','Rider',1.4],['Тень Клетки','👤','Berserker',1.3]],w:'Нити рвутся одна за другой, и Дофламинго теряет равновесие. Ло дышит тяжело, сжимая меч. Луффи стоит рядом, готовый к финальному удару. Впереди последняя схватка на площади.'},
{t:'Гира Второй: Король Дресс Розы',b:1,s:'Дофламинго применил Пробуждение и превратил землю в нити. Небо раскалывается, а Разлом превращает его в тирана всей страны. «Я — Небесный Дракон!» — рычит он. Луффи в Гире Четвёртом кричит: «Король Горилла!» Вы сражаетесь плечом к плечу с Ло, и прощальный удар решает судьбу королевства.',e:[['Дофламинго, Тиран Дресс Розы','🕷️','Caster',4.5,1.6],['Пират Донкихот','🏴‍☠️','Lancer',.8],['Пират Донкихот','🏴‍☠️','Archer',.8]],w:'Дофламинго падает, и Дресс Роза наконец свободна. Люди рыдают от счастья. Ло поклонился: «Я верну долг». Луффи ест мясо на развалинах: «Теперь плывём за Кайдо!»'}
]);

{t:'Зов Зоны Зо',s:'Санни плывёт к Зоне Зо, слону Зунеше, шагающему по морю. Там ждут Минк-воины: Пёс Инуарашши и Кот Неко Мамуши, правящие днём и ночью. Их лес горит, а Санджи получает письмо о свадьбе с дочерью Бигмам. Луффи пытается догнать друга, и Разлом уже шевелится над Зунеше.',e:[['Пират Бигмам','🏴‍☠️','Lancer',1.2],['Тень Зунеши','👤','Berserker',1.3],['Пират Бигмам','🏴‍☠️','Archer',1.2]],w:'Пираты Бигмам отступили. Санджи ушёл на Тотто-Ленд, оставив письмо, а Луффи стиснул шляпу: «Мы вернём его, даже если придётся разнести пол-океана». Команда разделяется на две группы.'},
{t:'Тотто-Ленд: Страна Сладостей',s:'Тотто-Ленд встречает вас пряничными домиками, шоколадными реками и запахом карамели. Правит здесь Шарлотта Линлин, Бигмам, Императрица Моря, вечно голодная и опасная. Нами кутается в плащ, Чоппер прячется в рюкзаке. «Она съела целый остров», — шепчет Усопп. Разлом ползёт по конфетным аллеям. Воздух пахнет сахаром и чем-то тревожным, хищным и сладким.',e:[['Шарлотта Ломельо','🍬','Caster',1.3],['Сладкая Тень','👤','Rider',1.2],['Пирожная Стража','🍰','Lancer',1.2]],w:'Стража рассыпалась в крошки. Вы пробираетесь по кондитерским улицам к замку Хол Кейк, где Санджи должен встретить невесту. Из окон глядит мама Линлин, и даже сахарная пыль дрожит.'},
{t:'Пудинг и Санджи',s:'Санджи знакомится с Шарлотта Пудинг: она мила, но с тайной. У неё три глаза, и она мечтает о любви без обмана. Санджи не может причинить ей боль, хоть и хочет вернуться к друзьям. Пока шеф-повар готовит свадебный торт, Разлом зажигает конфетные тени в подвалах замка.',e:[['Шарлотта Пудинг','🍮','Caster',1.4],['Сахарный Страж','🍬','Lancer',1.3],['Тень Лакомки','👤','Archer',1.2]],w:'Пудинг отступила, но её взгляд полон слёз. Санджи шепчет вам: «Простите меня, я не хотел». Луффи громко смеётся, не давая ему заплакать: «Ты наш кок, и точка!»'},
{t:'Шарлотта Катакури',s:'Катакури, Сладкий Командующий, встречает Луффи в зеркальном мире Мирро-Мирро. Он не проигрывал никогда, а его Хаки Наблюдения видит будущее. «Ты хочешь моей головы?» — холодно спрашивает он. Луффи ухмыляется и сжимает кулаки, а Нами с Усоппом в панике ищут выход из лабиринта зеркал. Зеркала отражают вас тысячу раз, и все отражения улыбаются.',e:[['Шарлотта Катакури','🍩','Berserker',2.1,1.5],['Зеркальная Тень','👤','Caster',1.2]],w:'Катакури ранен, но всё ещё стоит. Он признаёт: «Ты сильнее, чем я думал». Луффи падает без сил, а вы сдерживаете подоспевших охранников, пока не наступит время последнего отчаянного плана.'},
{t:'Чайная вечеринка',s:'Санджи, Нами и Луффи решают сорвать свадьбу и убить Бигмам. Приходится прикидываться гостями. Пудинг ведёт всех в зал. Вокруг ходят сыновья и дочери Бигмам, а стол ломится от сладостей. «Пожалуйста, не ешь ничего», — шепчет Нами, а Разлом чернит белую скатерть. Тихо звякают ложки, но за каждой улыбкой прячется угроза.',e:[['Шарлотта Перосперо','🍭','Caster',2],['Шарлотта Смузи','🍹','Archer',1.4],['Тень Гостя','👤','Lancer',1.2]],w:'Перосперо повержен, и замок дрожит. Бигмам уже слышит шум. Санджи и Нами прижимаются к стене, а Луффи потирает руки: «Настоящее веселье только начинается!»'},
{t:'Мама Бигмам',s:'Бигмам входит в зал, и свечи гаснут. Она поёт о свадьбе и жуёт торт величиной с дом. Но, услышав стук зубов Санджи, вспыхивает гневом. «Ты нарушил мою свадьбу!» Её кулак пробивает пол. Луффи выпрямляется, не пытаясь скрыть страх: «Мы уходим, но Санджи с нами». Даже стены замка, кажется, съёживаются от одного её взгляда.',e:[['Шарлотта Линлин','🍰','Berserker',2.2,1.5],['Прометей','☀️','Caster',1.2],['Зевс','☁️','Rider',1.2]],w:'Бигмам в ярости разрушила торт. Вы бежите через лабиринт сладостей, унося Санджи. Зеркальный мир Катакури помогает укрыться, но погоня уже настигает вас в кондитерской долине.'},
{t:'Мир Зеркал',s:'Команда бежит через Мирро-Мирро, а Катакури преследует Луффи. В мире зеркал он видит все ходы наперёд, но Луффи учится драться с закрытыми глазами. «Я тебя не вижу, но чувствую», — шепчет он. Вы держите зеркальных стражей, пока Разлом плетёт трещины на стёклах. Отражения множатся, и каждый шаг может привести в тупик.',e:[['Шарлотта Катакури','🍩','Berserker',2.2,1.5],['Зеркальный Страж','🪞','Lancer',1.2],['Зеркальный Страж','🪞','Archer',1.2]],w:'Луффи побеждает Катакури впервые. Тот падает, признав силу. Вдруг из тумана выходит Санджи с Пудинг: они хотят помочь. Корабль Санни готовится к отплытию из мрачного леса.'},
{t:'Побег из Хол Кейка',s:'Бигмам обрушивает на побег весь остров: Холл Кейк движется, сладкие деревья тянут ветви. «Мама! Мама!» — кричат её дети. Санджи и Нами прыгают через мост из карамели. Чоппер, Брук и Франки ждут на корабле, а Джимбей встаёт между ними и погоней. Сладкая земля дрожит и липнет к подошвам, замедляя бег.',e:[['Шарлотта Смузи','🍹','Archer',1.4],['Конфетная Армия','🍬','Lancer',1.3],['Конфетная Армия','🍬','Saber',1.3]],w:'Санни оторвался от острова, но Бигмам уже гонится по морю. Джимбей, стоя на палубе, шепчет: «Я вступлю в вашу команду». Луффи хохочет и хлопает его по спине: «Добро пожаловать!»'},
{t:'Гибель Тотто-Ленда',s:'Бигмам теряет память о Роки и в ярости бьёт по всему побережью. Луффи и команда, спрятавшись в тумане, обстреливают её сладким взрывом. Разлом рвёт остров пополам, превращая леденцы в чудовищ. Вы зовёте героев, чтобы остановить Императрицу, пока Санни не ушёл дальше. Леденцовые башни падают одна за другой, поднимая облака сахарной пыли.',e:[['Шарлотта Линлин, Мать','🍰','Berserker',2.2,1.6],['Сладкая Тень','👤','Berserker',1.3],['Сладкая Тень','👤','Caster',1.3]],w:'Бигмам отступила, и Санни ушёл вдаль. Но Императрица клянётся найти вас, где бы вы ни прятались. Вы понимаете: это не конец, а начало охоты на Соломенную Шляпу.'},
{t:'Охота Императрицы',b:1,s:'Бигмам нагоняет Санни посреди моря, и небо чернеет от грозовых туч. Она хохочет: «Я — Мать Всех Пиратов, и вы мои!» Луффи выходит вперёд, Джимбей встаёт рядом. Вы зовёте героев Астрала, а Разлом сплетает сладкую тьму в огромного гиганта, готового проглотить корабль целиком. Молнии рассекают чёрное небо, и волны встают стеной.',e:[['Шарлотта Линлин, Императрица','🍰','Berserker',5,1.6],['Прометей','☀️','Caster',.8],['Зевс','☁️','Rider',.8]],w:'Шторм швыряет Бигмам в воду, и Санни уносится прочь на всех парусах. Императрица не сдалась, но Соломенная Шляпа ушла живой. Впереди страна самураев, где Кайдо ждёт вас в Онигасиме.'},
{t:'Врата в Вано',s:'Санни взбирается по Карпу-Дракону к Стране Вано, закрытой от мира. Луффи и Зоро высаживаются в сумерках, а вокруг Онигасимы полыхают костры. Кин’эмон встречает нас в лохмотьях: «Вано в оковах Кайдо». Разлом шелестит в бамбуковых рощах, а самурайская тьма прячется в тенях. Запах моря сменяется ароматом цветущей сливы и дыма.',e:[['Разбойник Ямато','🥷','Saber',1.2],['Пират Зверей','🏴‍☠️','Lancer',1.2],['Тень самурая','👤','Archer',1.1]],w:'Разбойники бежали, а Кин’эмон клянётся служить вам. Он ведёт в Ханью, где скрывается вся надежда Вано. Луффи облизывается: «Здесь мясо особенное!» Вы улыбаетесь, но слышите, как далеко воет Кайдо.'},
{t:'Столица цветов Ханью',s:'Город Ханью полон нищеты и пыли, а вокруг ходят стражники Кайдо. Самураи бывшего сёгуна Кодзуки скрываются под масками. Момоносукэ, юный наследник, рыдает в тени. «Отец мёртв, и я не могу помочь», — шепчет он. Луффи кладёт руку ему на голову: «Мы поможем». Разлом бродит по улицам.',e:[['Стражник Ханью','🎖️','Lancer',1.2],['Шпион Орочи','🕵️','Archer',1.2],['Тень нищеты','👤','Rider',1.1]],w:'Шпионы бежали, а вы получили укрытие. Момо объясняет: чтобы вернуть Вано, нужно собрать союзников по всей стране. Трафальгар Ло уже у Онигасимы и ждёт Луффи на границе Пьяного острова.'},
{t:'Куникуда и Тюрьма Удон',s:'Луффи и Зоро попадают в тюрьму Удон: рабов Кайдо заставляют добывать руду в шахтах. Вокруг стоны, Зоро в кандалах, Кид и Ло уже там. Луффи вспоминает Дом Ло, где хотели делать оружие. Его тянет ударить стену, но Кайдо ждёт главного. Цепи звенят на ветру, а руки горят от тяжёлой работы.',e:[['Тюремщик Кайдо','⛓️','Lancer',1.3],['Пират Зверей','🏴‍☠️','Berserker',1.4],['Тень шахтёра','👤','Archer',1.1]],w:'Тюрьма рухнула, а Кид поднимает палец: «Я убью Кайдо первым!» Ло молчит, но соглашается. Четверо капитанов стоят плечом к плечу, и Разлом отступает от их упрямства.'},
{t:'Ясу и Кайдо',s:'Ясу и Ямато, дочь Кайдо, мечтает стать Кодзуки Оденом и открыть Вано миру. «Я хочу видеть океан!» — шепчет она. Луффи сразу признаёт её товарищем. Кайдо врывается в зал и рычит, узнав, что дочь сбежала. Вы вызываете героев, а Разлом раскалывает потолок. Луна отражается в её глазах, полных тоски по свободе.',e:[['Ямато (Ину-Ками)','🐺','Berserker',1.6,1.3],['Пират Зверей','🏴‍☠️','Rider',1.2],['Тень Кайдо','👤','Saber',1.2]],w:'Ямато остановила битву словами. Луффи хлопает её по плечу: «Пойдёшь с нами!» Она улыбается через слёзы. Вдали слышен мерный гул барабанов, зовущих на битву за Вано.'},
{t:'Дракон против Кайдо',s:'Перед лицом Кайдо, Императора Морей, Луффи собирает силу воли. Кайдо превращается в Дракона, небо трещит, и Разлом кормится этим ужасом. «Ты не победишь, Соломенная Шляпа!» Луффи ухмыляется, стягивая шляпу: «Посмотрим!» Вы призываете героев, чтобы встать рядом с капитаном. Пламя и молнии сплетаются в небе, освещая всю Онигасиму.',e:[['Кайдо (Дракон)','🐉','Berserker',2.2,1.6],['Пират Зверей','🏴‍☠️','Lancer',1.4],['Тень Дракона','👤','Caster',1.3]],w:'Дракон падает с высоты, но встаёт вновь. Луффи лежит без сил, а Ло и Кид пытаются его спасти. Вы понимаете: чтобы победить, придётся пробудить нечто большее, чем силу.'},
{t:'Самураи Красного Сокола',s:'Пока Луффи спит, самураи Кин’эмон, Кикунодзё, Кавамацу и Райзо атакуют Онигасиму. Райзо взрывает склад, а Кикунодзё сжимает клинок с яростью. «За Оден-сама!» — кричат они. Вы прикрываете отряд, пока Разлом шипит из лавовых трещин. Дым застилает взгляд, но самураи не отступают ни на единый шаг назад.',e:[['Ульти','🔨','Berserker',1.8],['Пират Зверей','🏴‍☠️','Saber',1.3],['Пират Зверей','🏴‍☠️','Archer',1.3]],w:'Склад взорван, а Ульти ранена. Самураи отступают в лес, но продолжают верить в победу. Вы слышите за спиной шорох, будто сам дух Одена шепчет из бамбука.'},
{t:'Зоро против Кинга',s:'Кинг, Пожар Катастрофы, огненный лунарианец, встречает Зоро в зале с крыльями за спиной. «Ты слабак, Роронои», — насмехается он. Зоро закрывает глаза и вызывает Энма, меч Одена, что высасывает Хаки. Вы стоите рядом и понимаете: битва решит судьбу Вано. Клинки поют, и воздух дрожит от столкновения двух воль.',e:[['Кинг (Лунарианец)','🔥','Saber',2.2,1.5],['Тень Кинга','👤','Archer',1.3]],w:'Зоро падает без сил, но Кинг тоже ранен. Пламя гаснет, а Энма дрожит в руках мечника. Момо шепчет молитву, и над Онигасимой поднимается рассвет, полный дыма.'},
{t:'Санджи против Квина',s:'Квин, Чума Катастрофы, мечтает о мире, где нет дозорных. Санджи сталкивается с ним в подземелье, а тело кока вспыхивает Джермой. «Я не убью женщину, но ты — не леди!» Санджи бьёт ногой. Разлом добавляет Квину яд, но кок не сдаётся. Искры разлетаются по подземелью, а стены гудят от ударов.',e:[['Квин (Динозавр)','🦖','Berserker',2,1.5],['Тень Квина','👤','Caster',1.3]],w:'Квин повержен, а Санджи наконец использует Джерму как оружие. Ветер приносит запах сакэ, и вы слышите далёкий смех Луффи, очнувшегося от сна.'},
{t:'Проснись, Ника',s:'Луффи просыпается в новом теле, и звёзды над Онигасимой смеются. Барабаны Освобождения гремят, а Кайдо хохочет: «Ты — Ника!» Плод пробуждается, и Гир Пятый превращает резину в чистую радость. «Вот это будет весело!» — кричит Луффи, поднимаясь в воздух. Земля отзывается на его смех, а тучи расходятся над Вано.',e:[['Кайдо (Дракон)','🐉','Berserker',2.2,1.6],['Тень Барабанов','👤','Caster',1.3]],w:'Луффи с хохотом сокрушает Кайдо, но Дракон ещё жив. Самураи взывают к богам, а вы слышите, как земля дрожит под ногами. Финальный бой Вано уже близок.'},
{t:'Гир 5: Бог Солнца',b:1,s:'На крыше Онигасимы Луффи смеётся и дерётся, как ребёнок. Кайдо ревёт, разрывая небо, Бигмам присоединяется к нему. Вы зовёте героев: «Ты победишь, Ника!» Разлом сгущается над крышей. Барабаны Освобождения гремят, и весь Вано слышит смех Бога Солнца. Каждый удар отзывается радостным хохотом, и страх исчезает.',e:[['Кайдо (Дракон)','🐉','Berserker',4.5,1.6],['Шарлотта Линлин','🍰','Caster',.9],['Пират Зверей','🏴‍☠️','Lancer',.7]],w:'Кайдо пал под ударом Бога Солнца. Вано свободна: над страной разливается рассвет. Луффи смеётся: «Я стану Королём Пиратов!» Врата Астрала засверкали золотом, приглашая вас дальше.'},
{t:'Остров Будущего Эггхед',s:'Санни причаливает к Эггхеду, острову доктора Вегапанка, где будущее уже наступило. Стеклянные башни сверкают под небом, а роботы приносят чай. Вегапанк радостно встречает гостей: «Наконец-то! Мне так нужны были друзья». Но Правительство уже знает о вас, а Разлом нервно мерцает в лабораториях острова. Над лабораторией парят дроны, а по стеклянным трубам бежит светящаяся вода.',e:[['Робот-Страж Эггхеда','🤖','Lancer',1.3],['Тень Изобретения','👤','Caster',1.2],['Робот-Страж Эггхеда','🤖','Archer',1.3]],w:'Роботы перестали стрелять и выстроились почётным караулом. Вегапанк хлопает в ладоши, а Франки едва не плачет от восторга. Учёный обещает рассказать о Пустом Веке, если вы поможете ему закончить последний проект.'},
{t:'Пустой Век и Вегапанк',s:'Вегапанк открывает вам тайну Пустого Века: сто лет истории стёрты Правительством, а Д. — имя, за которое убивают. Он спорит с Лилит, Эдисоном и Пифагором, своими шестью Сатирами. Внезапно небо чернеет: Разлом усиливает тревогу и вызывает Тени в самой Лаборатории, а Ло не находит слов.',e:[['Сатир-Тень','👤','Caster',1.4],['Тень Знания','👤','Archer',1.3],['Робот-Страж','🤖','Lancer',1.3]],w:'Тени растворились в свете лампы. Вегапанк грустно улыбается: «Я хочу подарить миру энергию. Но за это меня хотят убить». Луффи откусывает мясо и обещает, что никто его не тронет.'},
{t:'Совет Пяти Старейшин',s:'Пять Старейших прибывают на Эггхед и приказывают убить Вегапанка. Дозор высаживает Пасифисты, а адмирал Кизару лично идёт по острову. «Знания опасны», — вздыхает Сатурн. Вы прикрываете отступление Вегапанка, пока Санджи и Зоро сдерживают наступающий Дозор в лабораторном коридоре. Холодный голос Старейшин отражается от стен и заставляет замереть.',e:[['Святой Сатурн','👹','Caster',1.8,1.4],['Пасифиста PX','🤖','Lancer',1.4],['Морской Пехотинец','🎖️','Saber',1.2]],w:'Дозорные отброшены, но Сатурн смеётся и исчезает в тени. Вегапанк передаёт вам маленький чип: «Здесь всё. Сохраните это». Вы понимаете, что доверие учёного стало вашей самой тяжёлой ответственностью.'},
{t:'Правда о Кизару',s:'Кизару, Жёлтая Обезьяна, вновь стоит перед вами. Но теперь он не спешит стрелять. «Приказ есть приказ», — вздыхает он. Луффи бросается вперёд, но лучи Кизару прошивают воздух. Вы вызываете героев и вступаете в поединок, пока Разлом гудит на стеклянных крышах лабораторий. Гроза копится в воздухе, и кожа покрывается мурашками.',e:[['Адмирал Кизару','⚡','Archer',2.1,1.5],['Пасифиста PX','🤖','Berserker',1.4]],w:'Кизару отступает, но не спешит. Он смотрит на Луффи и произносит: «Ты станешь проблемой». Вегапанк торопится закончить трансляцию, чтобы рассказать миру правду, пока не поздно.'},
{t:'Голос Вегапанка',s:'Вегапанк выходит в эфир и говорит всему миру: Мировое Правительство лжёт, а море вот-вот поднимется. Зрители по всему свету слушают, затаив дыхание. Внезапно выстрел Сатурна пробивает лабораторию. Вы пытаетесь прикрыть Вегапанка, но враги уже тянутся к нему из тени. Тысячи экранов по всему миру мигают, показывая одно и то же лицо.',e:[['Святой Сатурн','👹','Caster',2,1.5],['Пасифиста PX','🤖','Lancer',1.4],['Тень Приказа','👤','Saber',1.3]],w:'Трансляция закончена, и весь мир слышит правду. Вегапанк падает, улыбаясь: «Я сделал всё, что мог». Луффи сжимает кулаки, а Ло опускает голову, не в силах сдержать слёз.'},
{t:'Лаборатория в огне',s:'Эггхед горит: адмиралы обстреливают остров, а Санни пытается вырваться из порта. Робин ищет древние тексты, Нами командует навигацией, Усопп прикрывает друзей. Мимо проносится Луччи, живой и злой, в облике Пробуждённого Леопарда. «Пришло время платить», — рычит он, а Разлом питает его тьму. Огненные волны бегут по коридорам, обжигая стены и надежды.',e:[['Роб Луччи (Пробуждённый)','🐆','Berserker',2.1,1.5],['Тень CP0','👤','Lancer',1.3],['Тень CP0','👤','Archer',1.3]],w:'Луччи отброшен, но Санни едва не тонет. Франки латает борт, а Чоппер лечит раненых. Команда вырывается из пламени, оставив за спиной остров, который уже не вернуть.'},
{t:'Бегство с Эггхеда',s:'Санни рвётся из гавани сквозь огонь, а три адмирала стоят в проливе. Акаину, Кизару и Фудзитора хотят покончить с Соломенной Шляпой. Луффи бьёт по всем троим сразу, а Разлом вокруг кораблей вскипает. «Вперёд, Санни!» — орёт Франки, врубая Кури-Кури-Ган. Горящие обломки падают в воду, и пар окутывает корабль.',e:[['Адмирал Акаину','🌋','Berserker',2,1.5],['Адмирал Фудзитора','🎲','Caster',1.8,1.4],['Морской Пехотинец','🎖️','Lancer',1.2]],w:'Санни вырывается из блокады, но Луффи ранен. Команда торжественно провожает Вегапанка в море, отдав ему последний салют. Впереди землю сотрясает эхо: остров великанов Элбаф зовёт вас к себе.'},
{t:'Путь на Элбаф',s:'Вы плывёте к Элбафу, земле великанов и Ясной Надежды. Волны бьются о борта, а над головой пролетают гигантские птицы. Усопп с трепетом вспоминает Брогги и Дориба, а Луффи мечтает поесть мяса с целую гору. Разлом вспыхивает на горизонте и швыряет вам навстречу морских чудовищ. Ветер соленый и холодный, а вдали уже слышен рёв рогов.',e:[['Морской Король-Тень','🐉','Rider',1.5],['Ледяной Змей','🐍','Berserker',1.4],['Тень шторма','👤','Caster',1.3]],w:'Чудовища отступили, и в тумане показались горы. Элбаф стоит перед вами, огромный и древний. Усопп вздыхает: «Вот я и вернулся к мечте». Луффи хохочет и первым прыгает на берег.'},
{t:'Земля великанов: Элбаф',s:'Великаны встречают гостей рёвом рогов. Вожаки Ясной Надежды — Дориб и Брогги — обнимают Усоппа, и тот рыдает. Луффи ест мясо огромного кабана, а Ло тихо смотрит на воинов. Вдруг Разлом взламывает снег, и оттуда лезет тьма, желая поглотить и людей, и великанов. Земля дрожит от шагов исполинов, и даже деревья кланяются им.',e:[['Ледяной Гигант-Тень','🏔️','Berserker',1.8,1.4],['Тень Валгаллы','👤','Lancer',1.4],['Тень Валгаллы','👤','Archer',1.4]],w:'Тьма отступила, а Брогги поднимает Луффи над головой, смеясь. Усопп вытирает слёзы, вспоминая клятву. Вы понимаете, что здесь, среди великанов, решится судьба этого мира и вашего путешествия.'},
{t:'Воля Ди и Ван Пис',b:1,s:'Над Элбафом взмывает тень Разлома, огромная, как сама судьба. Она принимает облик Королей Тьмы и собирает вокруг себя всех павших врагов. «Ван Пис принадлежит нам!» — ревёт она. Луффи ухмыляется, надев шляпу поглубже: «Нет, он принадлежит тому, кто свободен!» Вы зовёте лучших героев Астрала. Небо над Элбафом раскалывается, и мир на миг перестаёт дышать.',e:[['Разлом, Король Теней','🌑','Berserker',5,1.7],['Тень Кайдо','🐉','Caster',.9],['Тень Бигмам','🍰','Lancer',.9]],w:'Разлом рассыпался, и над Элбафом взошло солнце. Луффи смеётся, а друзья радуются рядом. Ван Пис ещё ждёт впереди, но вы знаете: с таким отрядом Король Пиратов найдёт его.'}
]);

{t:'Хранитель Гладсхейма',b:1,s:'У подножия чертога Одина отряд встречает легендарного хранителя, стража врат Гладсхейма. Тело его из живого золота, а меч сияет, как рассвет. «Сюда не ступала нога смертного!» — грохочет голос. Мелиодас касается рукояти Лостведейна: «Тогда мы будем первыми, и пропустим вежливо, без лишнего шума». Хоук прячется за спину Эсканора.',

{t:'Последний совет',s:'Ночью, перед решающей битвой, лидеры армий собираются у костра. Один произносит речь. Мелиодас пьёт эль вместе с Бальдром и Тюром. Гримнир поёт песню о тех, кто станет героями. Внезапно тьму рассекает вой, и из леса выходят Тени, олицетворяющие сомнение, страх и отчаяние каждого из собравшихся.',

{t:'Вигрид, начало битвы',b:1,s:'На рассвете, которого не было, сходятся армии. Хель ведёт мёртвых, Один богов, Мелиодас и Призыватель встают в центре, вокруг них Семь Грехов и союзники. С другой стороны, среди дыма, появляется предводитель Разлома, Тень Рагнарёка, в облике огромного воина. «Довольно сказок! — гремит он. — Мир станет пеплом!»',

{t:'Стена щитов',s:'Первая волна Разлома разбивается о стену щитов, которую держат Брюнхильд и Сигурд. Валькирии кружат над полем, Кинг командует феями-лучниками. Мелиодас врезается в строй врага, оставляя за собой просеку. «Держим фланги!» — кричит Тор. Из чёрных туч на поле летят тучи стрел, сотканных из чистой тьмы.',

{t:'Небесный фронт',s:'Валькирии и вороны Одина сражаются над Вигридом с воздушными тварями Разлома. Мегельда носится между врагами, как молния, Кинг ловит стрелы на лету. Мерлин творит защитные чары над штабом. Но с неба падает исполинский дракон Нидхёгг, освобождённый Разломом, и с рёвом обрушивается на строй союзников. Хоук орёт что-то неразборчивое.',

{t:'Прорыв мёртвых',s:'Хель командует армией мёртвых, но Разлом перехватывает управление: половина воинов поворачивается против живых. Хель кричит, как раненое животное. Фенрир подскакивает к ней и хватает за руку: «Держись, сестра!» Мелиодас рубит кольцо тёмных нитей, а неупокоенные наступают, шатаясь и хрипя. Хоук вцепился Мелиодасу в воротник, дрожа от ужаса и не смея пикнуть даже шёпотом.',

{t:'Возрождённый Фафнир',s:'Из-под земли выходит Фафнир, возрождённый Разломом дракон, некогда убитый Сигурдом. Он вцепляется в золото и жадно реветь: «Всё моё!» Сигурд поднимает Грам и молча идёт ему навстречу. «Я убил тебя однажды и убью снова», — повторяет он свои слова. Лезвие сияет чистым золотом, а земля дрожит.',

{t:'Гунгнир и Бальдр',s:'Один бросает Гунгнир в самую гущу врага, но копьё, поражённое Разломом, разворачивается к самому богу. Бальдр закрывает отца грудью. «Я уже умирал однажды, — улыбается он. — Второй раз проще». Из его ран вырывается ослепительный свет. Он поднимает руки, и нити Разлома, опутавшие копьё, начинают трещать.',

{t:'Тор и Мьёльнир',s:'Тор наконец поднимает молот в полную силу. Небо чернеет, и молнии бьют по армии Разлома. Каждый удар гремит, как рёв бога. «Я Тор! — кричит он. — Я защищаю тех, кто слабее!» Но на его пути встаёт ледяной великан Хримтурс, самый огромный из виденных, и обрушивает на бога кулак размером с дом.',

{t:'Гнев Суртра',s:'Суртр не выдерживает: Разлом прорывается через его волю, и великан вздымает Лэватейн, обрушивая пламя на всех, кого видит. Асгард озаряется огненным заревом, а Иггдрасиль трещит. Элизабет бросается вперёд с молитвой, но Мелиодас оттаскивает её. «Он не слышит, — шепчет он. — Сначала нужно сбить Разлом, потом уже говорить».',

{t:'Падение Асгарда',s:'Золотые башни Асгарда рушатся одна за другой. Разлом, копившийся веками, прорывается наружу огромной чёрной воронкой. Боги и герои бегут, но Мелиодас, Мерлин и Призыватель остаются. «Мы закроем её, — говорит Мерлин. — Это единственный шанс». Из воронки поднимаются Тени всех павших в этой битве, чтобы затянуть живых.',

{t:'Сердце Разлома',s:'В сердце воронки вас ждёт Хранитель Разлома, порождение самого Рагнарёка: гигантская Тень, состоящая из всех бед мира. «Каждый мир умирает, — шепчет она. — Каждый мир хочет тишины». Мелиодас шагает вперёд: «Может, и так. Но пока мы живы, мы будем драться за каждый рассвет». Хоук зажмуривается.',
