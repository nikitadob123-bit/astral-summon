// ====== СЮЖЕТНЫЙ РЕЖИМ ======
let SV=null;
const SPS=()=>{S.sp=S.sp||{};S.seen=S.seen||{};return S.sp};
function wById(id){return WORLDS.find(w=>w.id===id)}
function chStage(w,c,ci){const N=Math.max(2,w.ch.length),t=ci/(N-1),d=w.diff||1,hp=Math.round(1500*Math.pow(1667,t)*d),atk=Math.round(70*Math.pow(21,t)*(1+(d-1)*.6));
 return{n:`${w.n} · ${ci+1}. ${c.t}`,boss:!!c.b,en:c.e.map(e=>[e[0],e[1],e[2],Math.round(hp*(e[3]||1)),Math.round(atk*(e[4]||1))]),g:0}}
function chReward(w,c,ci){const b=c.b?2:(ci%5===4?1.5:1),m=w.mult||1;return{gm:Math.round((40+ci*2)*b*m),gd:Math.round((300+ci*40)*b*m)}}
function endBonus(w){return Math.round(8000*(w.mult||1)*(w.mult>1?1.6:1))}
let SA=null;
function arcOf(w,ci){return Math.floor(ci/10)}
function arcName(w,a){return (w.arcs&&w.arcs[a])||('Арка '+(a+1))}
function vStory(){
 SPS();
 if(!SV){return `<div class="banner"><h2>📖 Сюжет: Врата Астрала</h2><p class="small" style="margin:8px 0">Вы — Призыватель: единственный, кто умеет открывать Врата Астрала и звать героев и существ из других миров. Выберите мир, в который ведёт разлом. За прохождение глав вы получаете 💎 и 🪙, а в конце мира — большой бонус.</p></div>`+
  WORLDS.map(w=>{const p=Math.min(S.sp[w.id]||0,w.ch.length),done=p>=w.ch.length;return `<div class="panel row sb" onclick="openWorld('${w.id}')" style="cursor:pointer;${w.mult>1?'border-color:#ffd76a;box-shadow:0 0 18px #ffd76a55':''}"><div style="min-width:0;flex:1"><b style="font-size:16px">${w.ic} ${w.n}</b>${w.mult>1?'<span class="rbt" style="margin-left:6px">★ Награды ×'+w.mult+'</span>':''}<div class="small">${done?'✅ Пройдено':p?'Глав пройдено: '+p+'/'+w.ch.length:S.seen[w.id]?'Начать первую главу':'Пролог и первая глава'} · ${w.ch.length} глав</div><div class="bar xp" style="margin-top:6px"><i style="width:${p/w.ch.length*100}%"></i></div></div><button class="btn ${w.mult>1?'gold':''}">${p?'Продолжить':'Начать'}</button></div>`}).join('')}
 const w=wById(SV),p=S.sp[w.id]||0;
 return `<div class="panel row sb"><b style="font-size:16px">${w.ic} ${w.n}</b><button class="btn sm" onclick="SV=null;SA=null;render()">← Миры</button></div>`+
  `<div class="panel"><p class="small" style="margin-bottom:8px">${w.mult>1?'<span class="rbt">★ Рагнарёк — самый щедрый сюжет: награды ×'+w.mult+' и огромный бонус за финал.</span><br>':''}<a class="small" style="color:#7cf;cursor:pointer" onclick="showPrologue('${w.id}',1)">📜 Перечитать пролог</a></p></div>`+
  arcBar(w,p)+w.ch.map((c,i)=>({c,i})).filter(x=>arcOf(w,x.i)===SA).map(({c,i})=>{const r=chReward(w,c,i),locked=i>p,dn=i<p;return `<div class="panel row sb" style="opacity:${locked?.45:1}"><div style="min-width:0;flex:1"><b>${c.b?'👑 ':i%5===4?'⚔ ':''}${i+1}. ${esc(c.t)}</b> ${dn?'✅':''}<div class="small">${c.e.map(e=>e[1]+' '+e[0]).join(' · ')}<br>Награда: 💎${dn?Math.round(r.gm/4):r.gm} 🪙${dn?Math.round(r.gd/2):r.gd}${dn?' (повтор)':' (первый раз)'}</div></div><button class="btn ${c.b?'gold':''}" ${locked?'disabled':''} onclick="readCh('${w.id}',${i})">${dn?'Заново':'Читать'}</button></div>`}).join('')+
  (p>=w.ch.length?`<div class="panel small">${esc(w.end)}</div>`:`<div class="panel small">Пройдено ${p}/${w.ch.length}. Финал мира: бонус 💎${endBonus(w)}.</div>`)}
function arcBar(w,p){const n=Math.ceil(w.ch.length/10);if(SA===null||SA>=n)SA=Math.min(n-1,Math.floor(Math.min(p,w.ch.length-1)/10));
 return `<div class="panel"><div class="small" style="margin-bottom:6px">Арка ${SA+1}/${n}: <b>${esc(arcName(w,SA))}</b></div><div class="row" style="gap:5px">${Array.from({length:n},(_,a)=>{const done=p>=Math.min(w.ch.length,(a+1)*10),open=a*10<=p;return `<button class="btn sm ${a===SA?'gold':''}" style="min-width:44px;padding:8px 6px;${open?'':'opacity:.45'}" onclick="SA=${a};render()">${done?'✓':a+1}</button>`}).join('')}</div></div>`}
function openWorld(id){SPS();const w=wById(id);if(!S.seen[id])return showPrologue(id);SV=id;SA=null;render();window.scrollTo(0,0)}
function showPrologue(id,again){const w=wById(id);
 modal(`<h2 style="text-align:center">${w.ic} ${w.n}</h2>${w.intro.map(t=>`<p style="margin:10px 0;line-height:1.5">${esc(t)}</p>`).join('')}${again?'':`<p class="small" style="text-align:center">Подарок за начало пути: ${esc(H(w.starter).name)} присоединяется к вам.</p>`}<div class="row c" style="margin-top:12px"><button class="btn gold" onclick="${again?'closeM()':`beginWorld('${id}')`}">${again?'Закрыть':'Начать путь'}</button></div>`)}
function beginWorld(id){SPS();const w=wById(id);S.seen[id]=1;if(!S.world)S.world=id;const h=H(w.starter),n=giveHero(h);save();closeM();toast(n?'Новый герой: '+h.name:'Герой уже у вас — компенсация получена');SV=id;SA=null;render();window.scrollTo(0,0)}
function readCh(wid,ci){SPS();const w=wById(wid),c=w.ch[ci],r=chReward(w,c,ci);
 modal(`<h3>${w.ic} ${esc(w.n)}</h3><h2 style="margin:6px 0">${c.b?'👑 ':''}${ci+1}. ${esc(c.t)}</h2><p style="margin:10px 0;line-height:1.5">${esc(c.s)}</p><div class="small">Враги: ${c.e.map(e=>e[1]+' '+esc(e[0])).join(' · ')}</div><div class="small">Награда: 💎${r.gm} 🪙${r.gd}${ci<(S.sp[wid]||0)?' (повтор — меньше)':''}</div><div class="row c" style="margin-top:12px"><button class="btn gold" ${S.team.length?'':'disabled'} onclick="startS('${wid}',${ci})">В бой!</button><button class="btn" onclick="closeM()">Назад</button></div>${S.team.length?'':'<div class="small" style="text-align:center;margin-top:6px">Соберите отряд во вкладке «Герои».</div>'}`)}
function startS(wid,ci){const w=wById(wid),c=w.ch[ci],st=chStage(w,c,ci);closeM();tab='battle';
 B={si:-1,story:{w:wid,ci},st,turn:1,tgt:0,pick:[],log:['Бой начался!'],
 team:S.team.map(id=>{const s=stats(id),h=H(id),o=S.owned[id],m=h.myth||{};const gb=gBf();return{h,o,hp:Math.round(s.hp*gb.hp),max:Math.round(s.hp*gb.hp),atk:Math.round(s.atk*gb.atk*(m.atkMul||1)),np:m.npStart||0,cd:0,buff:0,m}}),
 en:st.en.map(e=>({n:e[0],e:e[1],cls:e[2],hp:e[3],max:e[3],atk:e[4]}))};deal();render();window.scrollTo(0,0)}
function winStory(){SPS();const {w:wid,ci}=B.story,w=wById(wid),c=w.ch[ci],r=chReward(w,c,ci),first=ci>=(S.sp[wid]||0);
 const gm=first?r.gm:Math.round(r.gm/4),gd=gGold(first?r.gd:Math.round(r.gd/2));
 S.gems+=gm;S.gold+=gd;S.st.battles++;S.st.wins++;prog('battle');prog('win');addXp(gXp(20+ci*10));
 let bonus=0,fin=false;if(first){S.sp[wid]=ci+1;if(ci===w.ch.length-1){bonus=endBonus(w);S.gems+=bonus;fin=true}}
 SV=wid;B=null;try{dvAfterStory(wid,ci,first)}catch(x){}save();
 modal(`<h2>🏆 Победа!</h2><p style="margin:10px 0;line-height:1.5">${esc(c.w)}</p><p class="small">Награда: 💎${gm} 🪙${gd}${first?' (первое прохождение)':' (повтор)'}</p>${fin?`<p style="margin:10px 0" class="rbt">🎉 Мир пройден! Бонус за финал: 💎${bonus}</p><p style="line-height:1.5">${esc(w.end)}</p>`:''}<div class="row c" style="margin-top:12px"><button class="btn gold" onclick="closeM();tab='story';render()">Дальше</button></div>`)}

// ====== МЕНЮ АДМИНА ======
const ADMINS=['арата люцифуг'];
function isAdmin(){return !!S&&ADMINS.includes(String(S.name).trim().toLowerCase())}
let AU=null,AL=[];
function admEntry(){return isAdmin()?`<div class="panel" style="border-color:#c9a0ff;box-shadow:0 0 16px #a56bff66"><h3>🛡 Меню админа</h3><div class="small" style="margin:6px 0">Доступно только вам, Арата Люцифуг. Профили игроков, валюта, герои, прогресс и другое.</div><button class="btn gold" style="width:100%" onclick="admOpen()">Открыть меню админа</button></div>`:''}
function admOpen(){if(!isAdmin())return;if(!AU||!users()[AU])AU=ME;admShow()}
function admShow(){if(!isAdmin())return;const old=document.querySelector('#modal .inner'),st=old?old.scrollTop:0;modal(admHtml());const n=document.querySelector('#modal .inner');if(n)n.scrollTop=st}
function admMut(fn){if(!isAdmin())return;const u=users(),t=u[AU];if(!t)return;if(AU===ME){fn(S);save()}else{fn(t.data);putUsers(u)}hud();admShow();if(AU===ME)render()}
function admNum(){const v=parseInt(document.getElementById('ad_n').value,10);return isFinite(v)&&v>=0?v:0}
function admSel(i){AU=AL[i];admShow()}
function admCur(k,sgn){const n=admNum();if(!n)return toast('Введите число');admMut(d=>{d[k]=Math.max(0,(d[k]||0)+sgn*n)});toast((sgn>0?'Добавлено ':'Убрано ')+n)}
function admSetCur(k){const n=admNum();admMut(d=>{d[k]=n});toast('Установлено: '+n)}
function admGems99999(){admMut(d=>{d.gems=99999});toast('💎 = 99999')}
function admGiveHero(){const id=document.getElementById('ad_h').value;admMut(d=>{if(!d.owned[id]){d.owned[id]={lv:1,dup:0,asc:0,sk:1,npl:1};if(d.team.length<3)d.team.push(id)}});toast('Герой выдан')}
function admTakeHero(){const id=document.getElementById('ad_h').value;admMut(d=>{delete d.owned[id];d.team=d.team.filter(x=>x!==id)});toast('Герой забран')}
function admStoryAll(){admMut(d=>{d.sp=d.sp||{};d.seen=d.seen||{};WORLDS.forEach(w=>{d.sp[w.id]=w.ch.length;d.seen[w.id]=1})});toast('Весь сюжет пройден')}
function admAllHeroes(r){admMut(d=>{HEROES.forEach(h=>{if(!h.secret&&(r===0||h.r===r)&&!d.owned[h.id])d.owned[h.id]={lv:1,dup:0,asc:0,sk:1,npl:1}});if(!d.team.length)d.team=Object.keys(d.owned).slice(0,3)});toast('Готово')}
function admClearHeroes(){if(!confirm('Забрать всех героев у этого аккаунта?'))return;admMut(d=>{d.owned={};d.team=[]})}
function admMaxHeroes(){admMut(d=>{Object.values(d.owned).forEach(o=>{o.asc=ASC_MAX;o.lv=lvCap(o);o.dup=5;o.sk=Math.max(o.sk||1,10);o.npl=Math.max(o.npl||1,10)})});toast('Все герои прокачаны')}
function admLevel(){const n=admNum();if(!n)return toast('Введите число');admMut(d=>{d.xp=(d.xp||0)+n*250});toast('Уровней аккаунта: +'+n)}
function admCampaign(all){admMut(d=>{d.cleared=all?STAGES.length:0})}
function admWorld(mode){const w=document.getElementById('ad_w').value,W=wById(w);admMut(d=>{d.sp=d.sp||{};d.seen=d.seen||{};if(mode==='all'){d.sp[w]=W.ch.length;d.seen[w]=1}else if(mode==='to'){const n=Math.min(W.ch.length,admNum());d.sp[w]=n;d.seen[w]=1}else{d.sp[w]=0}});toast('Прогресс мира обновлён')}

 const CFG={url:'https://kmbstzqalpffeeeqtfem.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImttYnN0enFhbHBmZmVlZXF0ZmVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDEwOTEsImV4cCI6MjEwNjI3NzA5MX0.3OJqKPudeQEbzaDn-IUnBKjomp_o4eo9kPH4z5foJ3U'},LK='as_gcache_v2',NC={nc:1};

const DG_FOES=[
 [['Золотой слизень','🟡','Rider',1200,55],['Гоблин-кладоискатель','👺','Saber',1400,70],['Золотой слизень','🟡','Rider',1200,55]],
 [['Мимик','📦','Lancer',1500,65],['Пещерная крыса','🐀','Archer',1100,60],['Пещерная крыса','🐀','Archer',1100,60]],

let BV='camp';
function dgS(){if(!S)return {t:0,e:0,w:0,l:0,p:0};let d=S.dg;if(!d||typeof d!=='object')d=S.dg={t:0,e:0,w:0,l:0,p:0};

function dgBuy(){if(!S)return false;const d=dgS();
 if(B){toast('Сначала завершите бой');return false}
 if(d.t>0){toast('Сначала потратьте оставшиеся попытки ('+d.t+')');return false}
 if(!Number.isInteger(S.gems)||S.gems<DG_PRICE){toast('Не хватает 💎 — нужно '+DG_PRICE);return false}
 S.gems-=DG_PRICE;d.t=DG_TRIES;d.p++;save();toast('Куплено: '+DG_TRIES+' попыток данжа (−💎'+DG_PRICE+')');render();return true}
function dgStart(){if(!S||B)return false;const d=dgS();
 if(d.t<=0){toast('Нет попыток — купите комплект');return false}
 if(!S.team.length){toast('Соберите отряд во вкладке «Герои»');return false}
 d.t--;save();const gb=gBf(),foes=DG_FOES[Math.floor(Math.random()*DG_FOES.length)],st={n:'💰 Данж золота',en:foes};
 B={si:-1,dg:{n:d.p},st,turn:1,tgt:0,pick:[],log:['💰 Данж золота! Победите врагов и заберите 🪙'+DG_MIN.toLocaleString('ru-RU')+'–'+DG_MAX.toLocaleString('ru-RU')],
  team:S.team.map(id=>{const s=stats(id),h=H(id),o=S.owned[id],m=h.myth||{};return{h,o,hp:Math.round(s.hp*gb.hp),max:Math.round(s.hp*gb.hp),atk:Math.round(s.atk*gb.atk*(m.atkMul||1)),np:m.npStart||0,cd:0,buff:0,m}}),
  en:foes.map(e=>({n:e[0],e:e[1],cls:e[2],hp:e[3],max:e[3],atk:e[4]}))};
 tab='battle';deal();render();window.scrollTo(0,0);return true}

function dgEnd(win,quit){if(!B||!B.dg||B.dg.done)return;B.dg.done=1;const d=dgS();let g=0;
 if(win){g=dgRoll();S.gold+=g;d.e+=g;d.w++;S.st.battles++;S.st.wins++;prog('battle');prog('win')}
 else{d.l++;if(!quit){S.st.battles++;prog('battle')}}
 B=null;save();
 modal(win?`<h2 style="text-align:center">🏆 Победа в данже!</h2><p style="margin:10px 0;text-align:center;overflow-wrap:anywhere">Награда: 🪙<b>${g.toLocaleString('ru-RU')}</b><br>Попыток осталось: ${d.t}</p><div class="row c"><button class="btn gold" onclick="closeM();render()">${d.t>0?'Дальше':'OK'}</button></div>`
  :`<h2 style="text-align:center">${quit?'🏳 Отступление':'💀 Поражение'}</h2><p style="margin:10px 0;text-align:center;overflow-wrap:anywhere">Попытка потрачена, награды нет.<br>Попыток осталось: ${d.t}</p><div class="row c"><button class="btn" onclick="closeM();render()">Назад</button></div>`);
 render()}

function dgView(){const d=dgS(),can0=!d.t&&Number.isInteger(S.gems)&&S.gems>=DG_PRICE,fmt=x=>x.toLocaleString('ru-RU');
 return `<div class="panel" id="dgPanel" style="border-color:#ffd76a"><h3 style="overflow-wrap:anywhere">💰 Данжи золота</h3>
 <div class="kv"><span>🎟 Попыток осталось</span><b id="dgTries">${d.t}</b></div><div class="kv"><span>🪙 Всего заработано</span><b id="dgEarn">${fmt(d.e)}</b></div><div class="kv"><span>Побед / поражений</span><b>${d.w} / ${d.l}</b></div>

 ${!d.t&&!can0?`<div class="small" style="margin-top:6px;color:#f9a8a8">Не хватает 💎 (нужно ${fmt(DG_PRICE)}).</div>`:''}${!S.team.length?'<div class="small" style="margin-top:6px">Соберите отряд во вкладке «Герои».</div>':''}</div>
 <div class="panel small" id="dgHint" style="line-height:1.5;overflow-wrap:anywhere">ℹ️ Заплатите 💎${fmt(DG_PRICE)} — получите ${DG_TRIES} попыток. Каждая — несложный бой со слабыми врагами. <b>Победа: 🪙${fmt(DG_MIN)}–${fmt(DG_MAX)}</b> (случайно, поровну). Поражение или отступление — попытка тратится без награды. Попытки хранятся, пока не потрачены; новый комплект можно купить, когда попыток 0. Бои засчитываются в заданиях и ивентах как обычные.<br>Средний доход: ≈🪙${fmt((DG_MIN+DG_MAX)/2)} за победу.</div>`}

// ====== ВОЗНЕСЕНИЕ ИГРОКА: ИКОНКИ-РАМКИ (ASTRAL_ANIM_V1) ======
// v ANIM_V1: анимации НЕ зависят от prefers-reduced-motion; настройка S.pf.anim (1/undefined=Вкл, 0=Экономный) → класс html.noanim. Маскированные кольца: вращается <u>, маска лежит на статичном <i>.
// Ступень вознесения игрока зависит от уровня аккаунта (таблица PF_LV). Каждая ступень открывает иконку (рамку-эффект) вокруг аватара.
// Секретная иконка выдаётся только владельцу Касуги Араты. Всё оформление — на CSS (transform/opacity/steps), без filter.
const PF_MARK='ASTRAL_ANIM_V1';
const PF_LV=[1,100,300,600,1200,2000,3200,5000];         // порог уровня аккаунта для ступени 0..7 (уровень не ограничен, 250 опыта на уровень)
const PF_GEMS=[0,500,1500,3000,5000,8000,12000,20000];    // разовая награда 💎 за ступень (флаг S.pf.rw[N])
const PF_ICONS=[
 {id:'p0',t:0,n:'Простая',d:'Статичная обводка'},
 {id:'p1',t:1,n:'RGB-сияние',d:'Плавно меняющаяся RGB-подсветка'},
 {id:'p2',t:2,n:'Кружки',d:'Переливающиеся цветные кружки'},
 {id:'p3',t:3,n:'Золотой RGB',d:'Золотое кольцо с RGB-бликами'},
 {id:'p4',t:4,n:'Радужные искры',d:'Радужное кольцо с искрами'},
 {id:'p5',t:5,n:'Звёздное кольцо',d:'Кольцо со мерцающими звёздами'},
 {id:'p6',t:6,n:'Эфирное золото',d:'Золото и фиолетовый эфир'},
 {id:'p7',t:7,n:'Астральный нимб',d:'Сияющий нимб с лучами'},
 {id:'void',t:-1,sec:1,n:'Пустотный круг',d:'Секретная иконка'}];
const PF_BY={};PF_ICONS.forEach(i=>{PF_BY[i.id]=i});
function pfTierOf(lv){let t=0;for(let i=1;i<PF_LV.length;i++)if(lv>=PF_LV[i])t=i;return t}
function pfTier(){try{return S?pfTierOf(accLv()):0}catch(e){return 0}}
function pfD(){if(!S.pf||typeof S.pf!=='object')S.pf={};const p=S.pf;if(!p.rw||typeof p.rw!=='object')p.rw={};if(!(p.ann>=0))p.ann=0;if(!(p.gp>=0))p.gp=0;return p}
function pfArId(){return typeof AR_ID!=='undefined'?AR_ID:'arata'}
function pfVoid(){try{return !!S&&!!(S.owned&&S.owned[pfArId()])}catch(e){return false}}
function pfOpen(id){const i=PF_BY[id];if(!i||!S)return false;return i.sec?pfVoid():i.t<=pfTier()}
function pfIc(){try{const p=S&&S.pf;if(p&&p.ic&&pfOpen(p.ic))return p.ic}catch(e){}return 'p'+pfTier()}
// иконка для чужих записей (сервер/гильдия): неизвестная или недоступная по уровню → ступень по уровню
function pfIcFor(ic,lv){const t=pfTierOf(+lv||1),i=typeof ic==='string'?PF_BY[ic]:null;return i&&(i.sec||i.t<=t)?i.id:'p'+t}
function pfSafeAv(a){return typeof a==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(a)?a:AVS[0]}
function pfAvIdx(s){try{return parseInt(hash(String(s||'x')).slice(0,3),36)%AVS.length}catch(e){return 0}}
function pfAv(av,ic,sz,cls){const i=PF_BY[ic]||PF_BY.p0;sz=sz||38;return `<span class="pfa pf${i.sec?'v':i.t}${sz<36?' s':''}${cls?' '+cls:''}" style="--s:${sz}px"><img class="av" src="img/${pfSafeAv(av)}.jpg" alt=""><u><i></i></u><u><i></i></u><u><i></i></u></span>`}
function pfMe(sz,cls){return pfAv(S.av,pfIc(),sz,cls)}
function pfM(m,sz){const av=(m&&m.av)||AVS[pfAvIdx(m&&(m.k||m.name))];return pfAv(av,pfIcFor(m&&m.ic,m&&m.lv),sz||28)}
// ---------- настройка «Анимации» (Вкл / Экономный) + версия сборки ----------
function pfAnimOn(){try{return !(S&&S.pf&&S.pf.anim===0)}catch(e){return true}}

function pfSysReduce(){try{return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){return false}}
function pfAnimSet(on){if(!S)return false;pfD().anim=on?1:0;save();pfAnimApply();if(tab==='profile')render();return true}

 return `<div class="panel" id="pfanim"><h3>✨ Анимации иконок и эффектов</h3><div class="row" style="margin:8px 0 4px;flex-wrap:wrap"><button class="btn sm ${on?'gold':''}" onclick="pfAnimSet(1)">${on?'✓ ':''}Вкл</button><button class="btn sm ${on?'':'gold'}" onclick="pfAnimSet(0)">${on?'':'✓ '}Экономный</button></div>
 <div class="small">Вкл — иконки игрока, рамки 1★ и 7★ и эффекты двигаются всегда. Экономный — статичные версии (меньше нагрузки на батарею).${sys?'<br>📱 В системе включено «Уменьшить движение» — игра это не учитывает; если анимации мешают, выберите «Экономный».':''}</div>
 <div class="small" style="margin-top:8px;overflow-wrap:anywhere">Версия сборки: <b id="pfver" style="color:#ffd76a;user-select:text;-webkit-user-select:text">${PF_MARK}</b></div>
 <div class="row" style="margin-top:6px"><button class="btn sm" onclick="pfVerCheck()">🔄 Обновить игру</button></div></div>`}
// проверка актуальности версии: запрашиваем index без кэша, сравниваем маркер; при отличии — перезагрузка с новым адресом

 toast('Проверка версии…');

 catch(e){location.replace(location.pathname+'?r='+Date.now())}}

 }catch(e){console.error(e)}finally{PFB=0}}

 function tone(f,t,dur,type,vol,dest,o){o=o||{};const os=ctx.createOscillator(),g=ctx.createGain();os.type=type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);

  win(t){[0,4,7,12,16,19,24].forEach((n,i)=>{tone(mf(60+n),t+i*.09,.5,'square',.11);tone(mf(48+n),t+i*.09,.5,'triangle',.14)});[0,4,7,12].forEach(n=>tone(mf(72+n),t+.7,1.4,'triangle',.13));noise(t+.7,.5,.1,null,{f:6000})},
  lose(t){[0,-2,-4,-7,-12].forEach((n,i)=>{tone(mf(57+n),t+i*.28,.7,'sawtooth',.14,null,{lp:900,to:mf(57+n)*.97});tone(mf(45+n),t+i*.28,.7,'triangle',.16)})},
  summon(t){tone(200,t,1.0,'sine',.2,null,{to:1600});noise(t,1.0,.15,null,{f:500,to:9000,type:'bandpass',q:1.5});for(let i=0;i<8;i++)tone(mf(84+(i%4)*3),t+.2+i*.09,.3,'sine',.07)},
  s3(t){tone(mf(76),t,.3,'sine',.16);tone(mf(83),t+.08,.4,'sine',.13)},
  s4(t){[76,80,83,88].forEach((n,i)=>tone(mf(n),t+i*.07,.5,'triangle',.14))},
  s5(t){[72,76,79,84,88,91].forEach((n,i)=>{tone(mf(n),t+i*.08,.9,'triangle',.14);tone(mf(n-12),t+i*.08,.9,'sine',.1)});noise(t+.4,.9,.12,null,{f:6000})},

  level(t){[67,72,76,79,84].forEach((n,i)=>tone(mf(n),t+i*.08,.35,'square',.09))},

  rbreak(t){const d=rbDist();
   noise(t,.05,.2,null,{f:6500,type:'highpass'});noise(t+.035,.04,.16,null,{f:8000,type:'highpass'});noise(t+.08,.06,.13,null,{f:5200,to:9000,type:'bandpass',q:2});

 };
 const RIFF={battle:[0,-1,2,-1,-1,3,-1,2,0,-1,2,-1,3,-1,5,4],boss:[0,3,-1,0,4,-1,3,-1,0,3,5,-1,6,4,3,-1]};
 function sched(m,st,t,sd){const p=P[m],spb=60/p.bpm/4,bar=Math.floor(st/16)%4,s=st%16,[root,ch]=p.bars[bar],d=mg[m];

   if(s===0){ch.forEach(n=>tone(mf(n-12),t,spb*16,'triangle',.06,d,{a:.9,lp:1400}));tone(mf(root-12),t,spb*15,'sine',.16,d,{a:.05})}

  if(!boss&&s===10)kick(t,d,.6);

  const bn=(s%2===0)?root:(s%4===3?root+12:-1);

  if(s===0||s===6||s===10||(boss&&s===3)){lead.forEach(n=>tone(mf(n),t,spb*(s===0?4.2:1.4),'sawtooth',.045,d,{lp:2400,lpTo:700}))}

  const r=RIFF[m][s];if(r>=0){const sc=boss?[0,2,3,5,7,8,11,12]:[0,3,5,7,10,12,15,17];tone(mf(root+24+sc[r%sc.length]),t,spb*(boss?1.5:1.7),boss?'sawtooth':'square',boss?.075:.06,d,{lp:3200,lpTo:900})}
