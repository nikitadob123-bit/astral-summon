{t:'Преследование Хендриксена',s:'Утром вы покидаете таверну, но Великий Мастер Хендриксен уже расставил отряды на всех дорогах. Хоук ворчит, что не позавтракал, а Элизабет вздрагивает при каждом шорохе. «Не бойся, — говорит Мелиодас. — Пока я рядом, никто тебя не тронет». Из-за холма выезжают рыцари со светящимися глазами.',e:[['Рыцарь Хендриксена','🛡️','Saber',1.2],['Рыцарь-всадник','🏇','Rider',1.2],['Рыцарь-лучник','🏹','Archer']],w:'Отряд Хендриксена разбит, но самого Великого Мастера среди них не было. Мелиодас нахмурился и задумчиво посмотрел на север: «Он что-то задумал. Нам нужна помощь Грехов, и как можно скорее».'},
{t:'Тюрьма Бастэ',s:'След ведёт в подземелье Бастэ, где десять лет держат одного из Грехов. Коридоры гудят от силы Разлома, стены покрыты чёрными трещинами. «Она где-то здесь, — шепчет Элизабет. — Я слышу тяжёлое дыхание». Стража бросается на вас из темноты, а Хоук прячется в вашем рюкзаке. Хоук в рюкзаке тихо икает от страха.',e:[['Страж Бастэ','🛡️','Lancer'],['Страж Бастэ','🛡️','Saber'],['Тень узника','👤','Berserker']],w:'Последний страж упал, и из глубины донёсся гулкий девичий голос: «Кто там? Неужели Капитан пришёл за мной?» Пол дрогнул под чьей-то поступью, и с потолка посыпалась каменная пыль.'},
{t:'Диана, Змеиный Грех Зависти',s:'Из мрака поднимается гигантская девушка с каштановыми волосами. Диана десять лет ждала Мелиодаса и теперь визжит от радости, едва не раздавив его в объятиях. Но Разлом ослепил охрану, и Святые Рыцари обрушивают на вас все силы Бастэ. «Не троньте моих друзей!» — гремит Диана и поднимает гигантский молот.',e:[['Тюремный командир','🗡️','Saber',1.3,1.2],['Осадная тварь','🦾','Berserker',1.2],['Страж Бастэ','🛡️','Archer']],w:'Диана расправила плечи и одним ударом разбила решётку. «Вот теперь я свободна! Капитан, куда мы идём дальше?» — спросила она, сияя, как летнее солнце. Мелиодас чуть покраснел и отвёл глаза.'},
{t:'Гилтандер, Гром Святых Рыцарей',s:'На выходе из Бастэ дорогу преграждает Гилтандер, лучший рыцарь Лионеса. Его меч искрит молниями, а глаза горят тревожным красным: Разлом шепчет ему, что Грехи убили короля. «Вы — предатели! Я уничтожу вас во имя Королевства!» Диана хмурится: «Мальчик слишком много слушает чужих голосов». Небо над замком темнеет, будто соглашаясь с ним.',e:[['Гилтандер (искажённый)','⚡','Saber',2,1.4],['Рыцарь Грома','🛡️','Lancer',1.1]],w:'Гилтандер рухнул на колени, и красная пелена исчезла из его глаз. Мелиодас накрыл его плащом: «Думаешь, я не знаю, кто настоящие враги? Отдохни, парень. Я всё объясню, когда придёт время».'},
{t:'Ученик Грийомор',s:'Следом за учителем в бой рвётся юный Грийомор. Разлом раздул его тело и сплавил доспех с кожей. «Я должен доказать, что достоин звания Святого Рыцаря!» — кричит он, а его копьё летит быстрее стрелы. Диана прикрывает Элизабет ладонью: «Он совсем ещё мальчишка. Постарайтесь его не покалечить».',e:[['Грийомор (искажённый)','🗡️','Lancer',1.5,1.3],['Тень ученика','👤','Archer',1.1]],w:'Копьё Грийомора треснуло пополам. Юноша опустил голову: «Простите, я был слеп». Разлом отпустил его, и он дал слово больше не служить лжи, кто бы ни отдавал приказы.'},
{t:'Ночь Теней',s:'Ночью лагерь окружают Тени, принявшие облик пропавших селян. Элизабет плачет, узнав в одной из них знакомое лицо. Диана прикрывает принцессу ладонью, а Мелиодас впервые серьёзен: «Разлом заставляет мёртвых сражаться. Не жалейте их, они уже ушли». Костёр гаснет, и в темноте вспыхивают десятки холодных глаз. Хоук жмётся к вашим ногам и тихо хрюкает.',e:[['Тень селянина','👤','Berserker'],['Тень селянина','👤','Lancer'],['Тень кузнеца','🔨','Saber',1.2]],w:'Тени растаяли в лунном свете. Элизабет смахнула слёзы и тихо поблагодарила вас: «Вы дали им покой. Спасибо, что не отвернулись и не позволили им причинить мне зло».'},
{t:'Ловушка в ущелье',s:'В горном ущелье путь перекрывает армия Святых Рыцарей. Хендриксен стоит на скале, улыбаясь слишком широко. «Сдавайтесь, преступники. Принцесса должна вернуться под защиту короны». Рыцари поднимают мечи, а зрачки их светятся Разломом. «Красивая ловушка, — вздыхает Мелиодас. — Но я предпочитаю красивые уходы». Хоук в ужасе прячется в сумке и сопит.',e:[['Отряд Хендриксена','🛡️','Saber',1.4,1.2],['Рыцарь-лучник','🏹','Archer',1.3],['Рыцарь-заклинатель','🔮','Caster',1.3]],w:'Строй рыцарей развалился. Хендриксен отступил в тень, оставив на камне лишь чёрное перо. Диана прошептала: «От этого человека пахнет чем-то нечистым. Это не человек, Капитан, поверь мне».'},
{t:'Королевский тракт',s:'Отряд идёт по королевской дороге, а Хоук ворчит, что его никто не кормит. Внезапно из придорожных кустов выпрыгивают разбойники, но среди них слишком много тварей с чёрными глазами. «Разлом добрался и сюда», — тихо говорит Мелиодас и берётся за меч. Диана разминает плечи и довольно улыбается.',e:[['Дорожный бандит','🏹','Archer'],['Тварь Разлома','🐺','Rider',1.2],['Тварь Разлома','🐺','Berserker']],w:'Бандиты разбежались, а звери растворились в дыму. Хоук гордо заявил, что это он всех напугал, и потребовал за подвиг лишнюю порцию помоев. Никто не решился с ним спорить.'},
{t:'Хендриксен, Рыцарь-Демон',b:1,s:'Великий Мастер срывает маску, и под ней вскипает чёрный жар. Хендриксен — демон, пробравшийся в ряды рыцарей и напитавшийся силой Разлома. «Вы слишком много знаете! Я сожру вашу принцессу и весь Лионес!» Мелиодас поднимает Лостверин, и глаза его загораются красным. Диана хрустит пальцами. Хоук с визгом прячется под столом.',e:[['Хендриксен (Демон)','😈','Berserker',3.2,1.5],['Одержимый Рыцарь','🛡️','Saber',.7],['Одержимый Рыцарь','🛡️','Lancer',.7]],w:'Демон рассыпался чёрным пеплом, а Разлом на миг сомкнулся. Мелиодас убрал меч: «Один из слуг Заповедей уже среди нас. Значит, времени у нас меньше, чем я думал».'},
{t:'Лес Белого Сна',s:'Тропа заводит вас в Лес Белого Сна, где деревья шепчут чужими голосами. Диана вдыхает воздух и морщится: «Здесь пахнет старой магией». Хоук клянётся, что видел светлячка размером с кулак. Но из чащи вылетают духи с горящими глазами, а лес вокруг медленно меняет очертания. Хоук нервно фыркает и жмётся к сапогам.',e:[['Лесной дух','🌿','Caster'],['Волк Разлома','🐺','Rider'],['Ходячее дерево','🌳','Berserker',1.2]],w:'Духи рассеялись зелёным дымом. Впереди между стволов мелькнула серебристая тень, а с ветки упал ржавый нож. Кто-то оставил след совсем недавно, и Мелиодас поднял его с осторожной улыбкой.'},
{t:'Вор из леса',s:'На поляне вы застаёте вора, который вырезает что-то на стволе древнего дерева. Бан, Змеиный Грех Жадности, ухмыляется и слизывает кровь с пальца. «Хочешь поговорить? Тогда сначала побей меня». Он бросается вперёд, а вокруг него собирается рой теней Разлома, пожирающий свет. Хоук на всякий случай прячет свою миску.',e:[['Бан (искажённый)','🗡️','Lancer',1.5,1.3],['Тень вора','👤','Archer',1.1]],w:'Бан упал в траву, хохоча: «Ха! Вы сильнее, чем кажетесь!» Он выплюнул кровь и добавил: «Ладно, слушаю. Что вам нужно от бессмертного вора, у которого нет ничего, кроме дурных манер?»'},
{t:'Фонтан Молодости',s:'Бан рассказывает, что Источник Молодости — единственный шанс вернуть Эльейн, его возлюбленную из Фей. Но святилище источника охраняют огромные змеи-хранители, впитавшие яд Разлома. «Помогите, и я стану вашим клинком, — обещает Бан, сжимая кулак. — Мне нечего терять, кроме одной девушки». Вода в фонтане чернеет, стоит вам подойти ближе.',e:[['Змея-хранитель','🐍','Berserker',1.3,1.2],['Змея-хранитель','🐍','Rider',1.2],['Страж источника','🧿','Caster']],w:'Змеи упали в воду. Бан присел у фонтана, и на его лице впервые появилась тёплая улыбка: «Смотри, Эльейн. Мы близко. Совсем близко». Мелиодас тактично сделал вид, что ничего не заметил.'},
{t:'Тень Эльейн',s:'У фонтана Разлом принимает облик Эльейн, и Бан застывает. Она поёт, смотрит на него ласково, но пальцы её тянутся к горлу. «Не смей! — кричит Бан. — Ты не она!» Кинг из-за деревьев шепчет: «Он не выдержит. Помогите ему отпустить эту иллюзию, пока не стало слишком поздно».',e:[['Тень Эльейн','🌸','Caster',1.4,1.3],['Цветочный морок','🌺','Archer',1.2],['Цветочный морок','🌺','Lancer',1.2]],w:'Иллюзия рассыпалась лепестками. Бан сел на землю и закрыл лицо ладонью. «Спасибо, — глухо сказал он. — Я бы сам не смог». Кинг молча положил ему руку на плечо.'},
{t:'Хранитель Древа',s:'Пока Грехи утешают Бана, Разлом собирает силу в глубине леса. Существо, что когда-то охраняло Древо Жизни, теперь пожирает духов. Кинг бледнеет: «Это был Хранитель. Он был добрым и мудрым». Земля дрожит, а корни вздымаются, как гигантские копья, готовые пронзить всё живое. Хоук с писком прячется за вашу спину.',e:[['Хранитель Древа (искажённый)','🌳','Berserker',2,1.4],['Росток Разлома','🌱','Caster',1.1]],w:'Хранитель пал, и Древо Жизни тихо засияло. Кинг склонил голову: «Прости, старый друг. Я должен был защитить тебя. Отныне я иду с Капитаном, чтобы это больше не повторилось».'},
{t:'Король Фей Кинг',s:'В сердце леса вас встречает Хранитель Леса с прозрачными крыльями. Кинг, Змеиный Грех Лени, парит над вашими головами, окружённый лепестками. «Вы привели чужаков в мой дом?» — холодно спрашивает он. Вокруг поднимаются феи, которых Разлом заставил забыть добрые манеры и приветливость. Хоук на всякий случай делает вид, что он самый обычный поросёнок.',e:[['Испорченная фея','🧚','Archer',1.3,1.2],['Испорченная фея','🧚','Caster',1.3],['Древесный стражник','🌲','Lancer',1.2]],w:'Феи угомонились, а Кинг опустил Частифол и посмотрел на Диану: «Ты всё та же. Значит, время не властно над некоторыми чувствами». Диана зарделась и смущённо отвернулась.'},
{t:'Спор Грехов',s:'Кинг и Бан сходятся в старом споре: один потерял сестру, другой — возлюбленную. Разлом усиливает боль их воспоминаний, и лес горит зелёным пламенем. «Не смей называть её забытой!» — рычит Бан. Мелиодас вздыхает: «Кто-нибудь, остановите этих идиотов, пока они не сожгли мой лес и моё терпение».',e:[['Кинг (Тень Разлома)','🌸','Archer',1.5,1.3],['Бан (Тень Разлома)','👤','Lancer',1.5,1.3]],w:'Кинг и Бан упали рядом, тяжело дыша. Диана села между ними и вздохнула: «Мальчишки. Что вы делаете? Общий враг прячется не здесь». Оба хмуро замолчали, отводя глаза.'},
{t:'Гоуэр, Козлиный Грех Похоти',s:'Среди зрителей на площади Вайзеля вы замечаете странного юношу с розовыми волосами и пустыми глазами. Он читает чужие мысли, не моргая: «Ваша боль вкусна». Это Гоуэр, Козлиный Грех Похоти, живущий в теле куклы. Разлом играет им, как марионеткой на нитях. Хоук на всякий случай отодвигается подальше.',e:[['Гоуэр (Кукла Разлома)','🎭','Caster',1.6,1.3],['Кукла-марионетка','🪆','Archer',1.1],['Кукла-марионетка','🪆','Lancer',1.1]],w:'Нити порвались, и Гоуэр опустился на землю. Его глаза впервые заблестели: «Странно. Я хочу понять, что такое дружба. Позвольте пойти с вами». Мелиодас кивнул: «Добро пожаловать в семью, придурок».'},
{t:'Ведьма Мерлин',s:'Ночью на крыше вас ждёт женщина в чёрном. Мерлин, Кабанья Ведьма и Грех Чревоугодия, тепло улыбается и одновременно жутко холодна. «Я ждала вас, Призыватель. Мелиодас, пора вспомнить, кем ты был». Небо над Вайзелем раскалывается фиолетовой трещиной, и оттуда вываливаются тени. Хоук с визгом ныряет в мешок с мукой.',e:[['Тень Мерлин','🔮','Caster',1.5,1.3],['Осколок Разлома','💠','Berserker',1.3],['Осколок Разлома','💠','Archer',1.2]],w:'Мерлин махнула рукой, и трещина в небе стянулась. «Мы почти собрались, — сказала она. — Не хватает лишь одного. И он пока не готов к нам, но время скоро придёт».'},
{t:'Праздник Боёв',b:1,s:'Финал Праздника Боёв в Вайзеле. На арену выходит хозяин турнира, весь сросшийся с обломками Разлома. Толпа кричит от ужаса, а Мелиодас спокойно надевает перчатки: «Шоу окончено. Диана, Кинг, Бан, Гоуэр, Мерлин — время работать». Вы впервые видите Грехов, стоящих плечом к плечу против общего врага.',e:[['Хозяин Вайзеля (Разлом)','👹','Berserker',3.4,1.5],['Гладиатор Тени','⚔️','Saber',.7],['Гладиатор Тени','🏹','Archer',.7]],w:'Хозяин Вайзеля рассыпался осколками, и арена затихла. Шесть Грехов стояли вместе, впервые за десять лет. Мелиодас улыбнулся: «Ну вот. Осталось найти седьмого, самого упрямого из нас».'},
{t:'Слухи о Гордыне',s:'После турнира по Вайзелю расползаются слухи: где-то на севере живёт человек, чья сила растёт с восходом солнца. Мерлин загадочно улыбается: «Седьмой Грех — Гордыня. Он не любит гостей». Отряд собирается в путь, но на дороге уже дежурят создания Разлома, охотящиеся за каждым, кто пойдёт к Эсканору.',e:[['Тварь Разлома','🐺','Rider',1.2],['Тень охотника','👤','Archer',1.2],['Тварь Разлома','🐗','Berserker',1.1]],w:'Твари рассыпались в пепел. Диана потянулась и спросила: «Так кто этот Эсканор? Он красивый?» Мерлин лишь загадочно улыбнулась, а Мелиодас закатил глаза и пошёл вперёд.'},
{t:'Ворота Лионеса',s:'Лионес встречает вас высокими белыми стенами и тяжёлым молчанием. Город красив, но воздух пропитан страхом. Стража в доспехах слишком быстро хватается за оружие. «Впустите Грехов — и мы все умрём!» — кричит кто-то из толпы, пока Разлом сгущается над крышами домов, а Хоук нервно прячется под плащом.',e:[['Страж Лионеса','🛡️','Saber'],['Страж Лионеса','🛡️','Lancer'],['Тень паники','👤','Berserker',1.2]],w:'Ворота распахнулись, и Элизабет, сдерживая слёзы, вошла в город, где выросла. Мелиодас положил ладонь ей на плечо: «Всё будет хорошо. Мы рядом. Пока я жив, тебя никто не обидит».'},
{t:'Капитаны Лионеса',s:'На главной площади вас встречают капитаны Святых Рыцарей: Джерико, Хаузер и Гильтандер с Грийомором. Разлом искажает их лица и нашёптывает, что Грехи — виновники всех бед. «Мы не отдадим Королевство предателям!» — кричит Хаузер, поднимая копьё. Джерико молча натягивает тетиву. Хоук нервно фыркает и жмётся к вашему плащу.',e:[['Хаузер (Святой Рыцарь)','🗡️','Lancer',1.4,1.3],['Джерико (Святая Рыцарь)','🏹','Archer',1.4,1.3],['Рыцарь Лионеса','🛡️','Saber',1.1]],w:'Хаузер уронил копьё, Джерико опустила лук. «Мы слишком долго верили лжи, — прошептала она. — Простите нас». Площадь наполнилась тяжёлой тишиной, а Хоук осторожно выглянул из-под плаща.'},
{t:'Суд над Грехами',s:'Королевский суд превращается в цирк. Дрейфус восседает на месте судьи и объявляет Грехов приговорёнными к казни. В зале кружатся тени Разлома, а стража нападает по знаку. «Слушайте, это уловка!» — кричит Элизабет, но её никто не слышит в общем гвалте и лязге стали. Хоук с визгом ныряет под скамью.',e:[['Судебный страж','🛡️','Saber',1.3],['Судебный страж','🛡️','Lancer',1.3],['Тень судьи','⚖️','Caster',1.2]],w:'Зал суда затих. Дрейфус скрылся за колонной, а в его тени на миг блеснули красные глаза. Мелиодас понизил голос: «Слишком тихо. Слишком удобно. Держитесь рядом и не пейте ничего».'},
{t:'Гром и Огонь',s:'На стене замка Гилтандер и Хаузер встают в боевую стойку рядом с Дрейфусом. «Мы больше не будем слепыми!» — кричит Гилтандер. Он атакует не Грехов, а тени Дрейфуса, сросшиеся с доспехами. Но Разлом держит обоих в тисках, и их собственные мечи оборачиваются против них самих.',e:[['Гилтандер (искажённый)','⚡','Saber',1.9,1.4],['Хаузер (искажённый)','🔥','Lancer',1.8,1.3]],w:'Гилтандер опустился на одно колено, и Разлом покинул его. Хаузер подхватил друга: «Мы справились. Теперь давай остановим настоящего предателя и вернём Королевству честь». Мелиодас одобрительно кивнул.'},
{t:'Ночной побег',s:'Ночью Дрейфус приказывает окружить Грехов в королевском саду. Диана смеётся: «Как мило, что вы собрались нас проводить!» Кинг создаёт цветы-ловушки, Бан хватает цепи, а Гоуэр читает мысли рыцарей и находит их слабые места. Мерлин тем временем неторопливо рисует в воздухе телепортационный круг. Хоук довольно чавкает, найдя в саду упавшие яблоки.',e:[['Гвардеец Дрейфуса','🛡️','Saber',1.3],['Гвардеец Дрейфуса','🛡️','Archer',1.3],['Тень стража','👤','Rider',1.2]],w:'Грехи растворились в темноте сада, оставив стражу в недоумении. Мерлин довольно улыбнулась: «Сейчас Дрейфус получит по заслугам. Пойдёмте, посмотрим, как он падёт под тяжестью собственной лжи».'},
{t:'Тайна Хоука',s:'Хоук вдруг замирает в центре тронного зала. Из него вырывается древний свет, а тени Разлома шарахаются в стороны. «Я — Хоук, Мусорный Дракон! Я уберу всю грязь!» Элизабет прижимает ладонь ко рту: она и не подозревала, кем на самом деле был их друг и спутник.',e:[['Тварь Разлома','🐗','Berserker',1.4,1.3],['Тварь Разлома','🐗','Rider',1.2],['Тень мусора','🗑️','Caster',1.2]],w:'Хоук довольно захрюкал и слизнул остатки тьмы с пола. «Я всегда говорил, что помои — это сила», — заявил он, и никто из Грехов не решился с ним спорить в этот момент.'},
{t:'Подземелья Дрейфуса',s:'Под замком тянутся тайные подземелья, где Дрейфус прятал пленников и документы. Стены здесь пропитаны кровью, а потолок расчерчен трещинами Разлома. Элизабет узнаёт почерк отца на одном из свитков, и её руки дрожат от ярости и страха. «Он всё знал, — шепчет она. — Он всё это время знал».',e:[['Тюремщик Дрейфуса','⛓️','Berserker',1.4],['Тень пленника','👤','Archer',1.2],['Тень пленника','👤','Lancer',1.2]],w:'Пленники освобождены, а свиток с приказами Дрейфуса сохранён. «Это доказательство, — сказал Мелиодас. — С ним у нас есть шанс переубедить весь Лионес и вернуть королевству имя».'},
{t:'Правда о Дрейфусе',s:'Вы находите Дрейфуса в зале Совета. Он больше не притворяется рыцарем: лицо его расползается, а тело растёт от силы Разлома. «Вы думали, я просто интриган? Я всегда правил из тени!» Элизабет прижимается к вам: «Не дайте ему победить, прошу». Древние стены зала начинают рушиться, а с потолка сыплются осколки витражей.',e:[['Дрейфус (Демон Разлома)','😈','Saber',2,1.5],['Тень Дрейфуса','👤','Caster',1.1]],w:'Дрейфус упал на колени, хрипя. Из его груди вырвался тёмный дым, и он прошептал: «Заповеди уже идут. Вы опоздали». Мелиодас нахмурился и вытер меч: «Как обычно, все опаздывают».'},
{t:'Сердце Заговора',b:1,s:'Тело Дрейфуса разрывается, из него вырастает колоссальное чудовище с сотней лиц. Оно ревёт голосами всех, кого он предал. Диана, Кинг, Бан, Гоуэр и Мерлин встают рядом с Мелиодасом. «Заканчиваем это здесь и сейчас, — говорит он. — Все вместе». Даже Хоук поднимает пятачок и хрюкает.',e:[['Дрейфус (Сердце Заговора)','👹','Berserker',3.6,1.6],['Лик Предателя','😈','Caster',.8],['Лик Предателя','😈','Archer',.8]],w:'Чудовище распалось в свет, и Лионес выдохнул. Но с неба уже опускалась чёрная тень Десяти Заповедей, а в воздухе запахло кровью и гарью. Мелиодас медленно достал меч.'}

EXT_PART('sins',[
{t:'Поиск Гордыни',s:'Мерлин переносит отряд на север, где в тумане прячется заброшенная деревня. Здесь живёт седьмой Грех — Эсканор, Львиный Грех Гордыни. Ночью он слаб и застенчив, а днём становится сильнее любого рыцаря. Разлом чует его силу и посылает тварей, чтобы уничтожить его раньше вас.',e:[['Тварь Разлома','🐺','Rider',1.2],['Тварь Разлома','🐗','Berserker',1.2],['Тень охотника','👤','Archer']],w:'Твари растворились в тумане. Мерлин довольно кивнула: «Он близко. Только не пугайтесь, когда увидите его ночью, — Эсканор совсем не похож на легенду, о которой рассказывают».'},
{t:'Эсканор в ночи',s:'В покосившемся доме вас встречает тощий юноша с лицом, полным печали. Он робко извиняется за всё на свете, даже за вашу усталость. «Я — Эсканор, Грех Гордыни… то есть бывший, наверное». Но Разлом уже нашёл его слабость и наводит на дом кошмарных призраков прошлого.',e:[['Призрак прошлого','👻','Caster',1.3],['Призрак прошлого','👻','Lancer',1.2],['Тень отчаяния','👤','Berserker',1.2]],w:'Призраки растаяли. Эсканор смущённо прижал руки к груди: «Простите, я опять всем мешаю». Мелиодас хлопнул его по плечу: «Ничего. Завтра в полдень поговорим по-другому, дружище».'},
{t:'Полдень в Эдинбурге',s:'В полдень солнце встаёт над Эдинбургом, и вместо застенчивого юноши на поле стоит великан с волосами цвета огня. «Я — Эсканор, и я никого не боюсь!» Мелиодас усмехается: «Хочешь остаться с нами? Тогда докажи это в бою». Разлом раздувает пламя Санчайна до небес.',e:[['Эсканор (Разлом)','☀️','Berserker',1.8,1.4],['Огненная тварь','🔥','Caster',1.1]],w:'Эсканор рухнул на колени, тяжело дыша. Мелиодас протянул ему руку: «Ты сильнее, чем думаешь. Но сила без друзей — просто пожар. Пойдём с нами, Львиный Грех».'},
{t:'Рен и Гелда',s:'На руинах Эдинбурга из-под камней поднимаются два демона, запертые тысячи лет назад. Рен и Гелда принимают Мелиодаса за его брата Зельдриса и требуют вернуть им свободу. «Ты наконец пришёл? Мы отомстим!» Разлом усиливает их ярость, а земля вокруг темнеет.',e:[['Рен (Демон)','😈','Lancer',1.4,1.3],['Гелда (Демон)','😈','Archer',1.4,1.3],['Тень Разлома','👤','Berserker',1.1]],w:'Демоны отступили в подземелье, шипя проклятия. Мелиодас потёр лоб: «Они не забыли обиду за три тысячи лет. Скажем так: Зельдрис оставил после себя много друзей».'},
{t:'Эсканор Пламенный',s:'Диана и Кинг находят Эсканора в момент, когда Разлом превращает его силу в неуправляемый жар. Небо над деревней раскалено докрасна. «Я не могу его остановить!» — кричит Эсканор, а Санчайн выжигает лес вокруг. Мерлин холодно замечает: «Он должен сам научиться держать пламя на поводке».',e:[['Эсканор (Пылающий)','☀️','Saber',2,1.5]],w:'Жар стих, и Эсканор осел на землю, вытирая пот. «Простите, я чуть не сжёг всё, что вы любите». Диана положила ладонь ему на плечо: «Мы не такие хрупкие, как ты думаешь».'},
{t:'Седьмой Грех',s:'Собрав волю, Эсканор клянётся присоединиться к Грехам. Он неловко кланяется Мерлин, а его щёки заливаются краской: «Госпожа, я… я полюбил вас с первого взгляда». Мерлин лишь усмехается и складывает ладони. Разлом отвечает вспышкой, и на поляну обрушиваются тени, желая уничтожить союз.',e:[['Тень Разлома','👤','Saber',1.3],['Тень Разлома','👤','Lancer',1.3],['Осколок Разлома','💠','Caster',1.2]],w:'Тени рассыпались, и отряд впервые в полном составе поднял кружки. Хоук хрюкнул: «За Семь Смертных Грехов!» Мелиодас рассмеялся: «Наконец-то мы снова вместе. Ну что, вперёд, к Лионесу».'},
{t:'Галан и Меласкула',s:'Возвращаясь в Лионес, Грехи находят город в осаде: на площади стоят Галан, Заповедь Истины, и Меласкула, Заповедь Веры. «Мелиодас вернулся? — смеётся Галан. — Убьём предателя!» Меласкула облизывает губы, а Разлом сгущается вокруг, наполняя демонов яростной силой.',e:[['Галан (Заповедь Истины)','🗿','Lancer',1.6,1.4],['Меласкула (Заповедь Веры)','🐍','Archer',1.5,1.3]],w:'Демоны отступили, оставив на камнях чёрную кровь. Мелиодас поднял голову: «Они лишь разведка. Настоящая сила — за ними. Держитесь, скоро станет намного хуже».'},
{t:'Ложь и Камень',s:'Галан хвалится, что любой, кто солгал в его присутствии, обращается в камень. Он ставит Грехов перед выбором: «Скажите правду, и я пощажу вас». Кинг вежливо усмехается: «Мы всегда были честными людьми». Хоук тихо кряхтит и шепчет вам, что слегка приврал про свой возраст.',e:[['Галан (Заповедь Истины)','🗿','Lancer',1.7,1.4],['Каменный страж','🗿','Berserker',1.2]],w:'Галан бросил на вас злобный взгляд, но сохранил каменное лицо. Мелиодас лениво заметил: «Я не лгу, я просто забыл сказать правду». Хоук благоразумно промолчал.'},
{t:'Монспит и Дериери',s:'Пока Галан отвлекает Грехов, в город проникают Монспит и Дериери — Заповеди Сдержанности и Чистоты. Монспит поглаживает усы, а Дериери, хихикая, играет чёрной тенью. «Ах, сколько красивых тел для наших игр!» Разлом окутывает их фиолетовым сиянием, делая ещё опаснее.',e:[['Монспит (Заповедь Сдержанности)','🔥','Caster',1.6,1.4],['Дериери (Заповедь Чистоты)','🌑','Archer',1.5,1.3],['Тень Дериери','👤','Rider',1.1]],w:'Дериери плюнула в сторону и растворилась вместе с Монспитом в тени. «Мы вернёмся!» — эхом отозвался её голос. Бан ухмыльнулся: «Обязательно вернутся. Такие всегда возвращаются».'},
{t:'Приговор Галану',b:1,s:'Разлом зажигает в теле Галана всю накопленную злость, и он растёт, превращаясь в огромную каменную громаду. «Никто не смеет меня побеждать!» Эсканор поднимает Резу, Бан ловит цепи, Кинг летит над полем. Мелиодас лишь одобрительно кивает: «Кончайте с ним. Пора».',e:[['Галан (Каменный Колосс)','🗿','Lancer',3.6,1.6],['Каменный воин','🗿','Berserker',.7],['Каменный воин','🗿','Saber',.7]],w:'Колосс рассыпался в груду щебня, а Разлом на миг затих. Мелиодас повернулся к друзьям: «Одна Заповедь пала. Осталось девять — и самые страшные ещё не показались».'},
{t:'Красная Луна встаёт',s:'Ночь окрашивается алым: над Лионесом поднимается Красная Луна. Демоны получают силу, а стены города покрываются трещинами. Мелиодас закрывает лицо ладонью: «Она вернулась». Хоук испуганно зарывается в вашу сумку, а Элизабет хватает вас за руку: «Что происходит? Почему все так испугались?»',e:[['Красный демон','😈','Berserker',1.3,1.3],['Красный демон','😈','Rider',1.3,1.2],['Тень Красной Луны','🌑','Caster',1.2]],w:'Демоны отступили, но Луна продолжала гореть. Мелиодас глухо произнёс: «Я не хотел, чтобы вы это видели. Я не тот, кем кажусь. Простите меня, друзья».'},
{t:'Мелиодас — демон',s:'Под алым светом глаза Мелиодаса вспыхивают чёрным, а на лбу проступает знак. Он падает на колени, сжимая Лостверин. «Я — сын Короля Демонов, — хрипит он. — Я был лидером Десяти Заповедей». Грехи молчат. Элизабет шагает вперёд и берёт его за руку: «Ты всё равно мой Мелиодас».',e:[['Мелиодас (Ярость демона)','👹','Saber',1.8,1.5],['Осколок Разлома','💠','Berserker',1.2]],w:'Демонический жар отступил, и Мелиодас упал в объятия друзей. Диана всхлипнула: «Глупый Капитан. Мы знали, что ты особенный. Но любим тебя не за силу, а за сердце».'},
{t:'Оскал Красной Луны',s:'Красная Луна накрывает Британнию, и Эсканор вынужден сражаться в ночи. «Я слаб без солнца!» — сокрушается он. Демоны ликуют, а Грехи держатся из последних сил. Мерлин негромко замечает: «Ты ошибаешься, Эсканор. Даже ночью гордость — это выбор, а не сила».',e:[['Красный демон','😈','Lancer',1.4,1.3],['Красный демон','😈','Archer',1.3],['Ночной демон','🌑','Berserker',1.3]],w:'Демоны отступили под натиском Грехов. Эсканор, тяжело дыша, гордо выпрямился: «Я не солнце, но я всё ещё Эсканор!» Хоук довольно захрюкал и одобрительно кивнул.'},
{t:'Эстароса, Заповедь Любви',s:'На башне Лионеса стоит высокий демон с серебряными волосами. «Здравствуй, брат», — говорит он с улыбкой. Эстароса, Заповедь Любви, любуется Красной Луной, а глаза его горят кровавой жаждой. «Ты забыл, как мы играли в детстве? А я — нет!» Разлом делает его втрое сильнее.',e:[['Эстароса (Заповедь Любви)','🌑','Saber',2,1.5],['Красный демон','😈','Lancer',1.1]],w:'Эстароса отступил, зажимая рану, но улыбка не исчезла: «Ты всё ещё силён, брат. Но Красная Луна не вечна. Скоро мы поговорим по-настоящему».'},
{t:'Зельдрис, Заповедь Благочестия',s:'В небе вспыхивает чёрная молния — и перед вами встаёт юноша с тёмными волосами и лицом, похожим на лицо Мелиодаса. «Брат, — говорит Зельдрис, — отец ждёт тебя». Он владеет Заповедью Благочестия, а Разлом добавляет ему ярости. «Вернись домой, или умри».',e:[['Зельдрис (Заповедь Благочестия)','🔥','Saber',2,1.5],['Демон-солдат','😈','Archer',1.1],['Демон-солдат','😈','Lancer',1.1]],w:'Зельдрис отступил в тень, оставив на камнях чёрные следы. «Я вернусь, брат, — процедил он. — В следующий раз я не буду так вежлив». Мелиодас молча смотрел ему вслед.'},
{t:'Демонический Мелиодас',s:'Мелиодас теряет контроль и превращается в демона: чёрные крылья, багровые глаза, безумная улыбка. «Убить… всех…» — хрипит он. Элизабет бросается к нему, но демоническая сила Разлома отбрасывает её назад. Диана, Кинг и Бан встают на пути своего Капитана и готовы остановить его любой ценой.',e:[['Мелиодас (Демон)','👹','Saber',2,1.6],['Тень демона','👤','Berserker',1.3]],w:'Мелиодас пришёл в себя на руках Элизабет. Он выдохнул: «Спасибо. Ты вернула меня оттуда». Элизабет, улыбаясь сквозь слёзы, крепче обняла его: «Я всегда буду рядом».'},
{t:'Дилемма Мерлин',s:'Мерлин отводит Мелиодаса в сторону: «Красная Луна ослабит нашу защиту. Пора призвать Призывателя на помощь». Она указывает на вас, и её взгляд серьёзен. Разлом замечает это и сгущается в единое существо, жаждущее пожрать ваш свет. «Держитесь!» — кричит Мерлин.',e:[['Осколок Разлома (Слитый)','💠','Caster',2,1.5],['Тень Разлома','👤','Archer',1.1]],w:'Существо рассыпалось в фиолетовую пыль. Мерлин удовлетворённо кивнула: «Теперь вы понимаете, почему без вас нам не победить. Вы — ключ, которого ждёт вся Британния».'},
{t:'Бегство из Лионеса',s:'Город падает под натиском демонов. Мерлин открывает портал: «Уходите! Я задержу их!» Хоук тащит Элизабет в круг, а Диана прикрывает отряд своим молотом. Демоны сыплются с неба, а Разлом сжимает улицы в каменные ловушки. Времени нет — нужно бежать сейчас же.',e:[['Красный демон','😈','Saber',1.3,1.3],['Красный демон','😈','Rider',1.3],['Демон-охотник','👹','Berserker',1.4,1.3]],w:'Портал сомкнулся за вашими спинами. Лионес остался позади, полыхая в алом свете. Элизабет всхлипнула, но Мелиодас лишь сжал её руку: «Мы вернёмся. Обещаю, мы вернём город».'},
{t:'Проклятие Бана',s:'В лесу отряд останавливается на ночлег, но Бан вдруг стонет и хватается за грудь. Красная Луна пробуждает в нём старую боль. «Эльейн… я слышу её голос…» — шепчет он. Разлом создаёт призрак возлюбленной Бана, и тот теряет контроль над разумом, бросаясь на друзей.',e:[['Призрак Эльейн','🌸','Caster',1.5,1.3],['Бан (Разлом)','👤','Lancer',1.7,1.4]],w:'Призрак растаял, а Бан рухнул на колени, сжимая кулаки. «Прости, — прошептал он. — Спасибо, что не дали мне сделать глупость». Кинг молча кивнул.'},
{t:'Битва за Камелот',b:1,s:'Отряд выходит на равнину перед Камелотом, где демоны штурмуют стены. Эстароса лично ведёт атаку под сиянием Красной Луны. «Брат, сдавайся! Я подарю тебе быструю смерть!» Мелиодас берёт Лостверин в обе руки: «Не сегодня. Друзья, вперёд!» Грехи бросаются в бой плечом к плечу.',e:[['Эстароса (Красная Луна)','🌑','Saber',4,1.7],['Красный демон','😈','Lancer',.8],['Красный демон','😈','Archer',.8]],w:'Эстароса отступил, стиснув зубы. Красная Луна побледнела и медленно растаяла в утреннем небе. Мелиодас упал на колено, тяжело дыша: «Мы выстояли. Но это лишь начало».'},
{t:'Пыль Камелота',s:'После боя Камелот лежит в руинах, а раненые рыцари отчаянно ищут выживших. Мерлин садится на камень и тихо говорит: «Здесь начинается настоящая история». Хоук находит под завалами уцелевшую печь и требует поставить на неё котёл. Но из тени поднимаются уцелевшие твари Разлома.',e:[['Тварь Разлома','🐺','Rider',1.3],['Тень рыцаря','🛡️','Saber',1.3],['Тень рыцаря','🛡️','Lancer',1.2]],w:'Твари растворились, а рыцари вздохнули с облегчением. Элизабет опустилась на колени и принялась перевязывать раненых, шепча слова молитвы. Мелиодас глядел на неё с нежностью.'},
{t:'Дар Дианы',s:'Диана уходит к озеру, чтобы побыть одной, и там слышит голос: «Ты можешь выбрать. Стать сильнее и потерять себя — или остаться собой». Разлом предлагает ей силу Заповедей. «Мне нужна только любовь Мелиодаса», — гордо отвечает Диана и поднимает молот против невидимого искусителя.',e:[['Искуситель Разлома','💠','Caster',1.6,1.4],['Тень Дианы','👤','Berserker',1.5,1.3]],w:'Тени рассеялись, а Диана вытерла слёзы тыльной стороной руки. «Я выбираю быть собой», — прошептала она. Мелиодас, стоявший за деревьями, тихо улыбнулся: «Я тоже тебя выбираю».'},
{t:'Меласкула и Дериери',s:'Меласкула и Дериери находят лагерь Грехов: «Красная Луна делает нас могущественнее! Убьём вас всех!» Дериери хохочет, окружая отряд теневыми щупальцами, а Меласкула плюёт огнём. Кинг вздыхает: «Женщины-демоны — самые страшные противники на свете, но и самые изящные».',e:[['Меласкула (Заповедь Веры)','🐍','Archer',1.8,1.4],['Дериери (Заповедь Чистоты)','🌑','Caster',1.8,1.4],['Демон-солдат','😈','Berserker',1.1]],w:'Демоницы отступили, оставляя за собой лужи чёрной крови. Меласкула успела прошипеть: «Мы ещё встретимся!» Кинг усмехнулся: «Обязательно. Только в следующий раз без спешки».'},
{t:'Совет Эсканора',s:'Эсканор, приходя в себя после ночи, предлагает план: «Я могу удерживать демонов днём, пока вы восстанавливаетесь». Мерлин усмехается и кладёт ладонь ему на плечо: «Ты становишься мудрее». Но Разлом не спит и ударяет по лагерю армией призрачных всадников.',e:[['Призрачный всадник','🏇','Rider',1.4,1.3],['Призрачный всадник','🏇','Lancer',1.3],['Призрачный лучник','🏹','Archer',1.2]],w:'Призрачные всадники исчезли, а Эсканор гордо распрямил плечи. «Пока солнце светит, я — щит для всех вас», — заявил он. Мелиодас усмехнулся: «Тогда я могу поспать».'},
{t:'Тайны Элизабет',s:'Ночью Элизабет просыпается с болью в груди: её метка засветилась ярко-золотым. Она чувствует, что её жизнь — цепь бесконечных перерождений, а Мелиодас связан с ней проклятием. «Скажи мне правду, — шепчет она. — Я всё вспомню». Разлом обрушивает на неё видения прошлых жизней.',e:[['Видение прошлой жизни','👁️','Caster',2,1.3],['Тень проклятия','👤','Archer',1.4],['Осколок Разлома','💠','Berserker',1.3]],w:'Видения исчезли. Элизабет перевела дыхание и произнесла: «Я — богиня. Я умирала снова и снова. Но я помню твою улыбку». Мелиодас крепко прижал её к себе.'},
{t:'Дыхание Дракона',s:'Хоук вдруг превращается в огромного Дракона Мусора: чёрная шкура, красные глаза, пасть, полная зубов. «Я — хранитель Британнии!» — рычит он. Грехи изумлены. Разлом пытается подчинить его, вливая яд в глотку, но Хоук лишь ревёт и глотает тьму, как еду.',e:[['Дракон Разлома','🐉','Berserker',1.8,1.5],['Тень дракона','🐲','Caster',1.2]],w:'Дракон уменьшился обратно в поросёнка и тихо рыгнул. «Я устал, — заявил он. — Поставьте мне в честь этого памятник». Мелиодас вытер слёзы от смеха и погладил его по голове.'},
{t:'Хендриксен вернулся',s:'Хендриксен, которого считали убитым, возвращается на белом коне, но глаза его теперь красные. «Я вернулся, чтобы закончить начатое!» Он тащит за собой армию, состоящую из мертвецов. Мелиодас качает головой: «Демоны не умеют оставаться мёртвыми. Только не в эпоху Красной Луны».',e:[['Хендриксен (Воскрешённый)','😈','Berserker',1.8,1.5],['Мёртвый рыцарь','💀','Saber',1.2],['Мёртвый рыцарь','💀','Lancer',1.2]],w:'Хендриксен упал, чёрная кровь залила землю. Он прошептал: «Заповеди сильнее вас…» Красная пыль осела, и Мелиодас закрыл ему глаза: «Отдыхай. Теперь уже навсегда».'},
{t:'Клятва Грехов',s:'На рассвете Грехи собираются у догорающего костра и клянутся не сдаваться. «Мы были предателями, а теперь мы — надежда», — говорит Мелиодас. Диана вытирает слёзы, Кинг прячет улыбку, а Бан бормочет что-то про эль. Но из леса вдруг выходят стражи Разлома, желая сломить их дух.',e:[['Страж Разлома','🌑','Saber',1.4,1.3],['Страж Разлома','🌑','Lancer',1.4],['Осколок Разлома','💠','Caster',1.3]],w:'Стражи пали, а костёр вспыхнул ярче. Грехи подняли кружки и чокнулись: «За нас, за Британнию, за Призывателя!» Хоук хрюкнул, требуя ещё эля, и никто не стал возражать.'},
{t:'Пепел Красной Луны',s:'Красная Луна угасла, но на её месте расцвела чёрная трещина Разлома. Мерлин чертит формулы в воздухе: «Она растёт. Если не остановить её, вся Британния станет полем битвы». Из трещины вываливается гигантский демон, сросшийся с осколками, и тянется к вам когтистой лапой.',e:[['Демон Разлома','👹','Berserker',2,1.5],['Осколок Разлома','💠','Caster',1.1],['Осколок Разлома','💠','Archer',1.1]],w:'Демон рассыпался в прах, а трещина затянулась. Мерлин довольно кивнула: «Первый рубеж пройден. Теперь пора отправляться туда, где сердце Британнии бьётся сильнее всего».'},
{t:'Эстароса против Эсканора',b:1,s:'На рассвете Эстароса возвращается один, безумный от ярости. «Ты унизил меня перед Красной Луной, Эсканор! Теперь ты станешь пеплом!» Санчайн вспыхивает в руках Эсканора: «Ты пришёл слишком рано, демон». Утро переходит в день, и солнце встаёт всё выше. Начинается битва, которую запомнит вся Британния.',e:[['Эстароса (Красная Луна)','🌑','Saber',4.2,1.7],['Красный демон','😈','Berserker',.7],['Красный демон','😈','Lancer',.7]],w:'Эсканор в зените силы отбросил Эстаросу за горизонт. Демон исчез во вспышке, крича проклятия. Эсканор довольно опустил Резу: «Я — Эсканор, и я никогда не проигрываю днём».'}
]);

{t:'Небесный Свет над Лионесом',s:'С неба на развалины Лионеса спускаются три сияющие фигуры: Людосьель, Сариэль и Тармиэль, Четыре Архангела Богини. Они говорят устами чужих тел, а глаза светятся холодным золотом. «Мы пришли положить конец Красной Луне», — объявляет Людосьель. Но Разлом искажает даже небесных посланников, и часть их стражи уже обращена против вас.',e:[['Небесный страж (искажённый)','👼','Lancer',1.3,1.3],['Небесный страж (искажённый)','👼','Archer',1.3],['Тень Разлома','👤','Caster',1.2]],w:'Небесная стража рассеялась в золотой пыли. Людосьель внимательно изучил вас, склонив голову: «Так вот кто открывает Врата. Любопытно. Возможно, вы и станете тем, кого мы ждали три тысячи лет».'},
{t:'Союз Стигмы',s:'Людосьель предлагает Грехам возродить Стигму — древний союз людей, фей, великанов и богинь против демонов. Диана и Кинг мрачно переглядываются: они помнят, чем закончилась прошлая Священная война. Мелиодас молча стоит в стороне. Внезапно из трещины над дворцом хлынули демоны Разлома, желая сорвать переговоры.',e:[['Демон Разлома','😈','Berserker',1.3,1.3],['Демон Разлома','😈','Rider',1.3],['Демон-заклинатель','🔮','Caster',1.2]],w:'Демоны рассыпались чёрным дымом. Людосьель холодно заметил: «Вот видите, у нас общий враг». Диана сложила руки на груди и тихо ответила: «Общий враг ещё не делает нас друзьями».'},
{t:'Тайна Меласкулы',s:'Меласкула вылезает из тени прямо посреди сборов и с ухмылкой заявляет, что знает, где прячется Эстароса. Она предлагает сделку, но её глаза лукавы. Вы чувствуете, как Разлом кружит вокруг неё чёрной вуалью. «Верить демонице — всё равно что верить огню, — шепчет Кинг. — Но огонь тоже бывает полезным».',e:[['Меласкула (Заповедь Веры)','🐍','Archer',1.7,1.4],['Змеиный слуга','🐍','Lancer',1.2],['Змеиный слуга','🐍','Rider',1.2]],w:'Меласкула ускользнула в тень, оставив на камне обрывок карты. Бан развернул его и присвистнул: «Ну что, воры, пора наведаться в гости к одному серебряноволосому красавчику».'},
{t:'Тени и Змеи',s:'Дериери нападает из-за спины, играя теневыми щупальцами, а Меласкула запускает огненные шары из всех отверстий. Кинг парит над схваткой, призывая Частифол, и морщится: «Как неизящно». Диана прикрывает Элизабет молотом. Разлом усиливает демониц, заставляя тени вокруг них сгущаться и извиваться, словно живые.',e:[['Дериери (Заповедь Чистоты)','🌑','Caster',1.8,1.4],['Меласкула (Заповедь Веры)','🐍','Archer',1.7,1.4]],w:'Меласкула рухнула на колени, а Дериери отступила, держась за рёбра. «Вы пожалеете!» — выкрикнула она и исчезла. Кинг лишь поправил плащ и вздохнул: «Всегда эти угрозы. Скукота».'},
{t:'Дом Мерлин',s:'Мерлин открывает портал в собственный дом, скрытый от мира. Внутри всё выглядит не так, как ожидаешь: вместо лаборатории — уютная гостиная. Но Разлом проник и сюда, воплотив в комнатах кошмары хозяйки. Она бледнеет: «Кто-то знает мои секреты». Из зеркал выходят её двойники с холодными глазами.',e:[['Двойник Мерлин','🔮','Caster',2,1.5],['Осколок зеркала','💠','Archer',1.2]],w:'Двойник Мерлин растаял, как дым. Мерлин поправила волосы и спокойно произнесла: «Не задавайте вопросов. Некоторые тайны лучше не знать, пока не придёт их час». Никто и не решился спрашивать.'},
{t:'Король Фей Дахлия',s:'В Лесу Короля Фей вас встречает древняя тень: Дахлия, первый Король Фей, воскрешённый Разломом. Его лицо спокойно, а глаза холодны, как лёд. «Люди и демоны — одна болезнь», — говорит он. Диана дрожит: она ощущает в нём силу, что старше самой Британнии. Феи вокруг падают на колени.',e:[['Дахлия (Дух Короля)','🌸','Caster',2,1.5],['Древесный страж','🌳','Lancer',1.2],['Древесный страж','🌳','Berserker',1.2]],w:'Дахлия растворился в сиянии, и лес затих. Кинг поднял голову: «Он не враг… но и не друг. Он ждёт, пока мы сами решим, чью сторону выбрать». Диана тихо кивнула.'},
{t:'Слёзы Гоуэра',s:'Гоуэр, потерявший часть воспоминаний из-за Разлома, бродит по руинам и спрашивает у каждого, кто он такой. Он вздрагивает, увидев Мелиодаса, и шепчет: «Я стёр себе память. Но зачем?» Из тьмы поднимаются куклы Разлома, чьи лица — копии его собственного, пустые и безжизненные.',e:[['Кукла-двойник','🎭','Caster',1.4,1.3],['Кукла-двойник','🪆','Lancer',1.3],['Кукла-двойник','🪆','Archer',1.3]],w:'Куклы упали, разбитые вдребезги. Гоуэр присел рядом с осколком и тихо произнёс: «Кажется, я вспомнил что-то о человеке, чьё имя было Мерлин. Но что именно — пока не знаю».'},
{t:'Пещера Эстаросы',s:'По карте Меласкулы вы находите пещеру, где скрывается Эстароса. Внутри — мертвецы, выстроенные рядами, и тяжёлый запах крови. Эстароса смеётся: «Вы всё-таки пришли! Тем лучше». Его глаза горят безумной радостью. Но за его спиной стоит кто-то другой, скрытый в тени, и он молчит.',e:[['Эстароса (Красная Луна)','🌑','Saber',2,1.6],['Мёртвый рыцарь','💀','Lancer',1.2],['Мёртвый рыцарь','💀','Archer',1.2]],w:'Эстароса отступил, рассмеявшись: «Забавно. Ты стал сильнее, брат». В тени мелькнуло знакомое лицо — и Гоуэр вздрогнул, будто увидел призрак из очень далёкого прошлого.'},
{t:'Гоуэр и Мэль',s:'Гоуэр вспоминает: Эстароса — не сын Короля Демонов, а Мэль, Архангел Ветра, чью память он сам стёр по приказу Мерлин. «Я лгал вам, — признаётся он. — Мой друг Мэль и есть тот, кого вы зовёте Эстаросой». Разлом рвёт воздух криком, а вокруг рушатся пласты воспоминаний о прошлом.',e:[['Мэль (Ярость Заповедей)','🌪️','Saber',2,1.6],['Ветер Разлома','💨','Caster',1.2],['Ветер Разлома','💨','Archer',1.2]],w:'Мэль упал на колени, а Гоуэр опустился рядом и тихо произнёс: «Прости меня, друг. Я хотел защитить тебя, а вместо этого причинил тебе боль. Позволь мне всё исправить».'},
{t:'Мэль, Архангел Ветра',b:1,s:'Мэль, поглотивший Заповеди, теряет разум. Красный свет заливает поле, а ветер превращается в лезвия, срезающие землю. «Ты стёр мою жизнь, Гоуэр!» — рычит он. Диана и Кинг встают плечом к плечу. Кинг кричит: «Мы вернём тебе самого себя!» Диана поднимает молот, а Элизабет молится за всех.',e:[['Мэль (Архангел Ветра)','🌪️','Saber',3.8,1.7],['Ветряной вихрь','💨','Archer',.7],['Ветряной вихрь','💨','Caster',.7]],w:'Ветер стих, и Мэль упал, сбросив с себя чужую силу. Гоуэр осторожно поднял его голову: «Я тут, друг». Мэль слабо улыбнулся: «Ты всегда был идиотом, знаешь?» Небо над руинами прояснилось.'},
{t:'Возвращение Хендриксена',s:'Хендриксен, принявший облик Архангела Мэля, приходит к отряду с миролюбивой улыбкой. Но ваша интуиция кричит об обмане: Разлом оплёл его золотой цепью, а глаза смотрят слишком спокойно. «Я помогу вам победить демонов», — мягко говорит он и разворачивает ладони, полные золотой энергии.',e:[['Хендриксен (Небесный)','👼','Saber',1.6,1.4],['Золотой страж','👼','Lancer',1.2],['Золотой страж','👼','Archer',1.2]],w:'Свет Хендриксена померк, а на лице проступила знакомая злоба. «Вы пожалеете!» — прошипел он и растворился в облаке чёрного дыма. Диана потёрла плечо: «Лучше бы он остался мёртвым».'},
{t:'Галан из камня',s:'Из каменной груды поднимается Галан, разбуженный Красной Луной. Он ревёт, топает и требует мести. Но теперь в его каменной броне блестят трещины Разлома, делающие его нестабильным и вдвое опаснее. Эсканор, чьё солнце уже стоит в зените, выходит вперёд: «Не спеши, приятель. Давай закончим то, что мы начали».',e:[['Галан (Воскрешённый)','🗿','Lancer',1.9,1.5],['Каменный осколок','🪨','Berserker',1.2]],w:'Галан застыл окончательно, и камень раскололся пополам. Эсканор смахнул пыль с плеча и с достоинством заметил: «Я предупреждал, что не проигрываю днём». Хоук восхищённо захрюкал.'},
{t:'Третья Заповедь',s:'В горах отряд наталкивается на Монспита, который затаился с ловушками. Он вышел на охоту в одиночку, не дожидаясь Дериери. «Молчание — золото, — шепчет он, поглаживая усы. — А кровь — дороже». Разлом делает его невидимым в тумане, и вы слышите лишь тихий свист его клинка.',e:[['Монспит (Заповедь Сдержанности)','🔥','Caster',1.8,1.5],['Огненный клон','🔥','Archer',1.2]],w:'Монспит рухнул, зажимая рану, и выдохнул: «Дериери… заберёт вас…» Бан лениво сплюнул: «Очень надеюсь. У меня ещё осталось немного терпения для этой дамочки».'},
{t:'Проклятие Королевы',s:'Ночью в лагерь ворвалась Дериери, в ярости за смерть Монспита. Она ищет мести и не жалеет ни себя, ни других. «Вы убили его!» — визжит она, окружая отряд стенами теней. Разлом подпитывает её горе, превращая чувства в оружие. Диана поднимает молот: «Сожалею, но мы не собираемся умирать».',e:[['Дериери (Заповедь Чистоты)','🌑','Caster',2,1.6],['Теневой прислужник','👤','Berserker',1.2],['Теневой прислужник','👤','Rider',1.2]],w:'Дериери пала на колени, беззвучно рыдая. Диана осторожно присела рядом: «Мне жаль. Но ты сама выбрала путь». Демоница молчала, пока её тело медленно растворялось в лунном свете.'},
{t:'Смерть Архангела',s:'Людосьель приводит отряд в цитадель Стигмы, но там уже хозяйничают Разломные твари в облике павших воинов. Гоуэр, сжимая руку Мэля, шепчет: «Мы не одни». Тармиэль и Сариэль сражаются рядом с вами, но золотая броня Тармиэля трещит, а Разлом пожирает его крылья по перьям.',e:[['Павший Страж Стигмы','👼','Lancer',2,1.3],['Павший Страж Стигмы','👼','Archer',1.4],['Тварь Разлома','👹','Berserker',1.4]],w:'Твари пали, но Тармиэль опустился на колени, истекая золотым светом. «Я счастлив, что прожил достаточно, чтобы увидеть, как вы боретесь», — тихо сказал он. Людосьель закрыл ему глаза.'},
{t:'Воля Сариэль',s:'Сариэль, гордая и надменная, вспоминает прошлое: ту эпоху, когда она была наставницей Элизабет. «Я не позволю умереть тем, кто мне дорог, — говорит она. — Даже если придётся стать ужасной». Разлом превращает её слова в злую иронию: вокруг вспыхивают тысячи её собственных копий, глядящих на вас пустыми глазами.',e:[['Сариэль (Тень Разлома)','👼','Caster',1.7,1.4],['Копия Сариэль','👼','Archer',1.2],['Копия Сариэль','👼','Lancer',1.2]],w:'Копии рассеялись золотой пылью. Сариэль выпрямилась, тяжело дыша, и посмотрела на Элизабет: «Я не забыла тебя, девочка. Прости, что не спасла раньше». Элизабет молча обняла её.'},
{t:'Воля Людосьеля',s:'Людосьель, вожак Стигмы, ведёт свой отряд в последнюю атаку на демонов Красной Луны. «Я не боюсь смерти, — гордо говорит он. — Я боюсь бесполезности». Разлом сжимает небеса в кулак, обрушивая на всех град чёрных молний. Людосьель раскрывает Святилище и заслоняет собой Грехов, принимая на себя удар.',e:[['Демон Красной Луны','😈','Lancer',1.5,1.4],['Демон Красной Луны','😈','Archer',1.5],['Демон-командир','👹','Saber',1.8,1.5]],w:'Демоны отступили, а Людосьель упал на колени, дрожа. «Я всё ещё здесь, — прошептал он. — Вы правы: не смерть страшна, а бессмысленность. Спасибо, Призыватель».'},
{t:'Крик Стигмы',s:'Стигма возрождена: люди, феи, великаны и богини идут единой колонной на демонов. Но Разлом внедрил среди союзников предателей, и на марше вспыхивает бунт. Мелиодас кричит: «Не дайте им сломать нас!» Диана сбивает предателей молотом, а Кинг создаёт барьеры, защищая раненых.',e:[['Предатель Стигмы','🗡️','Saber',1.3],['Предатель Стигмы','🏹','Archer',1.3],['Тварь Разлома','👹','Berserker',1.4]],w:'Бунт подавлен, а Стигма выстроилась в боевой порядок. Людосьель поднял руку: «Сегодня мы стоим вместе. Завтра мы либо победим, либо умрём». Мелиодас тихо ответил: «Победим».'},
{t:'Ночь перед битвой',s:'Ночь перед решающей битвой отряд не спит. Диана поёт колыбельные, Кинг сочиняет стихи, Бан играет в кости с Эсканором. Мелиодас сидит один у костра, глядя на Элизабет. «Что ты чувствуешь?» — спрашивает она. Он лишь качает головой: «Страх. Но за тебя, а не за себя».',e:[['Ночной призрак','👻','Caster',1.3],['Ночной призрак','👻','Lancer',1.3],['Тень страха','👤','Berserker',1.4]],w:'Призраки растаяли, и лагерь снова затих. Элизабет положила голову Мелиодасу на плечо и уснула. Он не пошевелился, боясь её потревожить, и до рассвета смотрел на огонь.'},
{t:'Зельдрис, Исполнитель',b:1,s:'Под сводами руин Камелота Красная Луна вновь встаёт над полем. Во главе демонов стоит Зельдрис, Исполнитель Десяти Заповедей, и Разлом рвёт воздух вокруг его клинка. «Сегодня вы падёте!» — говорит он холодно. Мелиодас поднимает Лостверин: «Брат, я не дам тебе разрушить всё». Стигма и Грехи бросаются в бой.',e:[['Зельдрис (Заповедь Благочестия)','🔥','Saber',4.5,1.8],['Демон Красной Луны','😈','Lancer',.8],['Демон Красной Луны','😈','Berserker',.8]],w:'Зельдрис отступил, сжав зубы, а Красная Луна погасла над Камелотом. Британния выдохнула. Людосьель тихо произнёс: «Мы выстояли, но война только начинается. Король Демонов уже идёт».'},
{t:'Пробуждение Короля Демонов',s:'Над Камелотом разверзается небо, и оттуда льётся густая тьма. Зельдрис, стоя над пропастью, произносит древние слова, и земля раскалывается. Из трещины поднимается сама тень Короля Демонов. Мелиодас бледнеет: «Он пришёл за мной». Разлом визжит, питая владыку, и мир содрогается от одного лишь его взгляда.',e:[['Тень Короля Демонов','👹','Caster',1.8,1.5],['Демон-страж','😈','Saber',1.3],['Демон-страж','😈','Lancer',1.3]],w:'Тень отступила, но Мелиодас уже знал, что это лишь предвестие. «Он хочет, чтобы я занял его место, — глухо сказал он. — Но я скорее умру, чем стану им». Элизабет крепко сжала его ладонь.'},
{t:'Меч Мелиодаса',s:'Мелиодас, поглощённый жаждой мести, разрывается между добром и злом. Лостверин в его руках гудит красным светом, а глаза наливаются тьмой. Эсканор заступает ему дорогу: «Капитан, я не могу победить вас на равных. Но я могу удержать вас до рассвета». Разлом смеётся, подпитывая демоническую ярость Мелиодаса.',e:[['Мелиодас (Ярость демона)','👹','Saber',2,1.7],['Тень Мелиодаса','👤','Berserker',1.3]],w:'Мелиодас пришёл в себя на рассвете, едва держась на ногах. «Простите, — прошептал он. — Я снова чуть не потерял себя». Эсканор устало улыбнулся: «Для этого и нужны друзья».'},
{t:'Дар Эльейн',s:'Бан находит Эльейн — не призрак, а живую девушку, которая все эти годы ждала его в лесу. Он не верит своим глазам. «Ты… жива?» Она улыбается: «Я всегда буду ждать тебя». Но Разлом подсылает к ним тварей, желая разрушить это чудо. Бан вскакивает, вытирая слёзы: «Только попробуйте!»',e:[['Тварь Разлома','👹','Berserker',1.5,1.4],['Тварь Разлома','🐺','Rider',1.3],['Осколок Разлома','💠','Caster',1.3]],w:'Твари сгорели в огне Бана. Он опустил голову на плечо Эльейн и прошептал: «Я не отпущу тебя больше никогда». Кинг деликатно отвернулся, пряча улыбку и слегка влажные глаза.'},
{t:'Слёзы Дианы',s:'Диана наконец признаётся Мелиодасу в любви — но он отворачивается, не в силах ответить. Её сердце разбито. «Я всегда знала», — шепчет она. Разлом использует боль: гигантские тени в её обличье нападают на лагерь. Кинг встаёт на пути: «Диана, это не ты. Ты сильнее, чем эти слёзы!»',e:[['Тень Дианы','👤','Berserker',1.8,1.5],['Тень Дианы','👤','Saber',1.3]],w:'Тени растаяли, а Диана осела на землю, обхватив колени. Кинг присел рядом и молча обнял её. «Я здесь, — тихо сказал он. — Всегда буду здесь». Диана, всхлипнув, положила голову ему на плечо.'},
{t:'Разговор с Мерлин',s:'Мерлин находит Мелиодаса ночью и говорит тихо: «У тебя есть шанс всё исправить. Ты можешь стать Королём Демонов — и остановить всё это». Мелиодас смотрит на неё долго. «Ты лжёшь мне, Мерлин. Ты всегда лжёшь». Её улыбка не дрогнула, а в воздухе сгустились чёрные символы Разлома.',e:[['Мерлин (Тень Разлома)','🔮','Caster',1.9,1.5],['Магический конструкт','💠','Berserker',1.3]],w:'Мерлин сдержанно поклонилась: «Ты прав, Мелиодас. Я лгу. Но ложь бывает во спасение». Она растаяла в тумане, оставив Мелиодаса наедине с самыми тяжёлыми мыслями за всю его долгую жизнь.'},
{t:'Слово Бартры',s:'Король Бартра приходит на поле лично. Он старик, но глаза его всё так же ясны. «Я видел ваше будущее, Грехи, — говорит он. — Вы спасёте Британнию, даже если для этого придётся умереть». Разлом отзывается визгом: над стариком вспыхивают демонические знаки, и из-за холма выходят чудовища, желающие его смерти.',e:[['Чудовище Разлома','👹','Berserker',1.6,1.4],['Чудовище Разлома','👹','Lancer',1.5],['Демон-убийца','🗡️','Saber',1.3]],w:'Чудовища пали, а Бартра стоял невредимым, опираясь на посох. Он улыбнулся: «Хорошо. Значит, будущее, которое я видел, ещё возможно». Мелиодас склонил голову перед королём.'},
{t:'Прощание с Тармиэлем',s:'Тармиэль умирает от ран, прижимаясь к плечу Сариэль. «Не плачь, — говорит он. — Я видел рассвет». Из его тела вырывается золотой свет, и вокруг лагеря вспыхивает барьер. Но Разлом не уважает горе: демоны ломятся сквозь золотую завесу, чтобы уничтожить всех.',e:[['Демон-штурмовик','😈','Berserker',1.5,1.4],['Демон-штурмовик','😈','Rider',1.4],['Демон-лучник','🏹','Archer',1.3]],w:'Демоны отброшены, а золотой барьер тихо погас. Сариэль осталась на коленях, не двигаясь. Гоуэр осторожно положил ей на плечо руку: «Мне жаль. Он был лучшим из нас».'},
{t:'Копьё Гилтандера',s:'Гилтандер приходит к отряду на закате, сгорбленный и молчаливый. Разлом раздробил его волю, и в его руках копьё Демона. «Я не хочу, но не могу остановиться!» — выкрикивает он и бросается на Хаузера. Диана встаёт между ними, принимая удар на щит из собственных ладоней.',e:[['Гилтандер (Одержимый)','⚡','Saber',1.7,1.4],['Тень Гилтандера','👤','Lancer',1.2]],w:'Копьё выпало из рук Гилтандера, и он рухнул на колени. «Простите, — прохрипел он. — Я снова не справился». Хаузер осторожно поднял друга: «Ты справился. Ты остановил себя сам, а это главное».'},
{t:'Клятва Эсканора',s:'Эсканор, воспламенённый любовью к Мерлин и решимостью защитить друзей, обещает выйти против Короля Демонов. Мерлин качает головой: «Ты умрёшь, глупец». Он лишь улыбается: «Значит, я умру красиво». Разлом принимает вызов и посылает к нему лучших воинов Короля Демонов, чтобы проверить его гордость.',e:[['Гвардеец Короля Демонов','😈','Saber',1.5,1.4],['Гвардеец Короля Демонов','😈','Lancer',1.5],['Палач Разлома','🗡️','Berserker',1.6,1.4]],w:'Гвардейцы рассыпались пеплом. Эсканор опустил Резу и негромко сказал Мерлин: «Я боюсь только одного: не успеть сказать вам самое главное». Мерлин отвернулась, и никто не увидел её лица.'},
{t:'Король Демонов',b:1,s:'Король Демонов завладел телом, и от его шагов пылают небеса. Мелиодас уже поглотил Заповеди и стоит на грани превращения в нового владыку. Эсканор раскрывает Санчайн и жжёт собственную жизнь: «Это моё последнее слово, госпожа Мерлин!» Всё вокруг вспыхивает белым, и Британния замирает.',e:[['Король Демонов (Разлом)','👹','Caster',4.8,1.8],['Демон-страж','😈','Saber',.8],['Демон-страж','😈','Lancer',.8]],w:'Свет угас, и Король Демонов пошатнулся. На земле лежал пепел там, где стоял Эсканор. Мерлин упала на колени и прошептала: «Ты успел». Мелиодас склонил голову, а Диана заплакала, не скрывая слёз.'}
]);

EXT_PART('sins',[
{t:'Пепел Эсканора',s:'На поле, где пылал Санчайн, осталась лишь горстка серого пепла. Мерлин молча сжимает в ладони плащ Эсканора, а Диана не может остановить слёзы. Мелиодас, вернувший себе человеческий облик, тихо говорит: «Он сгорел ради нас». Но Разлом не оставляет времени на скорбь и посылает демонов на пепелище.',e:[['Демон-мародёр','😈','Rider',1.3,1.3],['Демон-мародёр','😈','Berserker',1.3],['Тень Разлома','👤','Caster',1.2]],w:'Демоны рассыпались, а над пепелищем поднялся тёплый ветер. Мерлин прижала плащ к груди и прошептала: «Глупый упрямый лев». Никто не решился нарушить её молчание, даже Хоук.'},
{t:'Кокон Зельдриса',s:'Пока Грехи оплакивают друга, Кьюсак собирает рассеянные Заповеди и уносит бесчувственного Зельдриса в пещеру. Мерлин чувствует обман: «Кто-то использует силу Разлома для ритуала». Вы находите пещеру, но у входа уже стоят демоны-стражи, чьи глаза светятся зловещим пурпуром.',e:[['Демон-страж пещеры','😈','Lancer',1.4,1.3],['Демон-страж пещеры','😈','Saber',1.4],['Осколок Разлома','💠','Archer',1.2]],w:'Стражи пали, но внутри пещеры пульсировал огромный чёрный кокон. Мелиодас побледнел: «Опоздали. Отец уже там, внутри Зельдриса». Стены пещеры дрогнули, словно огромное сердце сделало первый удар.'},
{t:'Чандлер и Кьюсак',s:'Из кокона выходят двое: Кьюсак и Чандлер, древнейшие демоны, служившие Королю Демонов с начала времён. «Наш повелитель вернулся, — усмехается Чандлер. — Вы опоздали». Разлом вливается в их тела, превращая демонов в чудовищ, способных раздавить целый город одним взмахом лапы.',e:[['Кьюсак (Древнейший)','😈','Caster',1.8,1.5],['Чандлер (Древнейший)','👹','Berserker',1.8,1.5]],w:'Кьюсак и Чандлер отступили, сливаясь в тень. «Наш повелитель сам займётся вами», — процедил Чандлер. Мелиодас медленно достал меч, и его голос был на удивление спокоен: «Пусть приходит».'},
{t:'Возрождение Короля Демонов',s:'Кокон лопается, и оттуда выходит высокий демон с волосами цвета ночи. Голос Зельдриса звучит чужим: «Сын мой, ты вернулся». Король Демонов поселился в теле младшего сына и смеётся. Мелиодас сжимает кулаки. «Это тело моего брата!» Небо над горами раскалывается чёрной молнией, и Разлом воет.',e:[['Король Демонов (в теле Зельдриса)','👹','Saber',2,1.6],['Демон-приспешник','😈','Lancer',1.2],['Демон-приспешник','😈','Archer',1.2]],w:'Король Демонов исчез в вихре теней. Мелиодас опустил меч: «Он ещё слишком слаб, но скоро вернётся в полную силу». Элизабет крепче сжала его руку: «Тогда мы будем ждать его вместе».'},
{t:'Кьюсак, Верный Слуга',s:'Кьюсак остаётся, чтобы задержать отряд: он вызывает орду низших демонов и сам выходит на бой, ведомый фанатичной верностью. «Я служу лишь одному господину!» — кричит он, и над его головой вспыхивает багровый ореол. Разлом подкармливает его ярость, превращая в пламя всё, чего он касается.',e:[['Кьюсак (Верный Слуга)','😈','Caster',2,1.6],['Демон-фанатик','😈','Berserker',1.2]],w:'Кьюсак упал на колени, и в глазах его мелькнуло что-то похожее на облегчение. «Я выполнил свой долг», — прошептал он. Его тело рассыпалось в чёрный пепел, и ветер унёс его над равниной.'},
{t:'Слёзы Мерлин',s:'Мерлин уходит к реке, где никто её не видит, и долго стоит у воды. Гоуэр находит её и молча встаёт рядом. «Ты любила его?» — спрашивает он тихо. Она не отвечает. Разлом отзывается на её боль и лепит из тумана призрак Эсканора с горящими золотыми глазами.',e:[['Призрак Эсканора','☀️','Saber',1.5,1.4],['Туманный двойник','👤','Caster',1.3]],w:'Призрак растаял, оставив после себя тепло. Мерлин утёрла щёку и заговорила ровно: «Хватит. У нас ещё много дел». Гоуэр кивнул, понимая, что об этом разговоре не стоит упоминать никогда.'},
{t:'Память Гоуэра',s:'Гоуэр заходит в лес и находит там странное место: заброшенный дом, где когда-то жил его создатель. Он вспоминает, как сам стал куклой. Внутри — сотни кукол, оживших под действием Разлома. Они смотрят на него с укором. «Ты бросил нас», — шепчут они хором.',e:[['Кукла-обвинитель','🪆','Caster',1.4,1.3],['Кукла-обвинитель','🎭','Archer',1.3],['Кукла-обвинитель','🪆','Lancer',1.3]],w:'Куклы упали, разбитые вдребезги. Гоуэр присел и бережно собрал обломки. «Простите меня, — прошептал он. — Я больше не убегу от своих чувств». Он осторожно положил одну куклу в карман.'},
{t:'Проклятие Элизабет',s:'Элизабет вспоминает всё: три тысячи лет, сто семь смертей, тот самый день, когда Мелиодас поклялся найти её снова. Метка на её лбу горит, и проклятие Верховного Бога вступает в силу. У неё осталось всего три дня. «Не плачь, — шепчет она. — Я не боюсь». Разлом жадно тянется к её свету.',e:[['Тень Проклятия','👤','Caster',1.8,1.5],['Осколок Разлома','💠','Berserker',1.3],['Осколок Разлома','💠','Archer',1.3]],w:'Тени схлынули, оставив Элизабет обессиленной. Мелиодас подхватил её на руки и не отпускал, пока не рассвело. «Три дня, — глухо сказал он. — Значит, мы сломаем это проклятие за три дня».'},
{t:'Хоук и Пурпурная Ночь',s:'Хоук, объевшийся вкусных остатков, вдруг раздувается и превращается в исполинского Дракона Мусора, поглощающего всё вокруг. Разлом нашёптывает ему голод, которого не насытить. «Я — Хоук! — ревёт он. — Я всё съем!» Мелиодас вздыхает: «Кто-нибудь, остановите нашего повара, пока он не съел Британнию».',e:[['Дракон Мусора (Разлом)','🐉','Berserker',2,1.6],['Мусорная тварь','🗑️','Caster',1.2]],w:'Хоук уменьшился обратно и громко рыгнул. «Простите, — виновато пробормотал он. — Я больше так не буду». Диана погладила его по спине: «Мы знаем, что будешь, но мы тебя любим».'},
{t:'Мелиодас против Отца',b:1,s:'На вершине скалы стоит Король Демонов в теле Зельдриса. «Присоединяйся ко мне, сын, — говорит он. — Стань моим наследником». Мелиодас качает головой: «Я выбираю жизнь». Небо разверзается, и Разлом усиливает обоих. Мелиодас поднимает Лостверин, Элизабет шепчет молитву, а Зельдрис изнутри прорывается сквозь голос отца.',e:[['Король Демонов (Отец)','👹','Saber',5,1.8],['Тень Отца','👤','Caster',.7],['Тень Отца','👤','Berserker',.7]],w:'Король Демонов покачнулся, и в глазах Зельдриса мелькнула искра брата. «Я держу его, — хрипло выдохнул он. — Бей, Мелиодас, пока могу». Небеса над Британнией дрогнули, и вдали блеснул золотой свет.'},
{t:'Золотая Трещина',s:'Над горами появляется золотая трещина: Верховный Бог заключил союз с Королём Фей Дахлией и хочет закончить Священную войну одним ударом. Диана и Кинг узнают Дахлию и цепенеют. «Мы обе стороны в этой войне, — говорит Кинг. — И обе лгут». Разлом растекается по трещине, как масло по воде.',e:[['Небесный солдат','👼','Lancer',1.4,1.3],['Небесный солдат','👼','Archer',1.4],['Тень Дахлии','🌸','Caster',1.4,1.3]],w:'Небесные воины отступили, а трещина замерцала и зарубцевалась. Кинг тихо сказал: «Дахлия хочет уничтожить демонов и людей одним ударом. Нельзя допустить, чтобы этот союз состоялся».'},
{t:'Дахлия, Король Фей',s:'Дахлия, древний Король Фей, выходит на бой с холодной улыбкой. «Живые не понимают ценность мира», — говорит он. Кинг поднимает Частифол и отвечает: «Мир нельзя построить на трупах». Диана встаёт рядом с любимым. Разлом искажает волю Дахлии, заставляя цветы вокруг него ядовито пылать красным светом.',e:[['Дахлия (Король Фей)','🌸','Caster',2,1.6],['Цветочный страж','🌺','Archer',1.3],['Цветочный страж','🌺','Lancer',1.3]],w:'Дахлия отступил, оставляя за собой лепестки, что рассыпались в пепел. Кинг опустил Частифол и посмотрел на Диану: «Я не могу сказать, победили ли мы. Но мы не проиграли». Она сжала его ладонь.'},
{t:'Слёзы Сариэль',s:'Сариэль, потерявшая Тармиэля, приходит к Элизабет с последней просьбой: «Прости меня, девочка. Я солгала тебе. Это я передала Верховному Богу твою тайну». Элизабет молчит. Разлом обрушивается на них потоком золотых стрел, а Сариэль прикрывает Элизабет собой и падает, раненая.',e:[['Золотой палач','🏹','Archer',1.5,1.4],['Золотой палач','👼','Lancer',1.5],['Тень Разлома','👤','Caster',1.3]],w:'Палачи рассыпались. Элизабет осторожно опустилась рядом с Сариэль и взяла её за руку: «Я прощаю тебя. Пожалуйста, живи». Сариэль, слабо улыбнувшись, закрыла глаза, но её дыхание оставалось ровным.'},
{t:'Обречённые Небеса',s:'Отряд находит поле, где Верховный Бог стянул все свои силы. Небесные воины стоят рядами, и их доспехи сверкают золотом. Людосьель выходит вперёд и говорит: «Я знаю, чего вы боитесь. Но мы пришли не воевать, а остановить». Разлом кипит в небе и сжимает золотые строи в единый кулак.',e:[['Небесный командир','👼','Saber',1.6,1.4],['Небесный воин','👼','Lancer',1.3],['Небесный воин','👼','Archer',1.3]],w:'Небесная стража опустила мечи. Людосьель кивнул: «Значит, ещё не всё потеряно». Впереди, над полем, разгоралось золотое сияние, и Мелиодас понял, что сам Верховный Бог уже приближается.'},
{t:'Верховный Бог: Первая Тень',s:'Верховный Бог является в облике огромной женщины, окружённой золотым светом. «Демоны и люди — грязь», — произносит она, и от её голоса трескаются камни. Людосьель склоняет колено, а Элизабет шепчет: «Мама». Разлом сливается с божественным светом, превращая силу Верховной в слепящую бурю.',e:[['Верховный Бог (Тень)','🌟','Caster',2,1.7],['Небесный страж','👼','Saber',1.2]],w:'Тень Верховного Бога рассыпалась золотой пылью. Голос, не принадлежащий никому, произнёс: «Я вернусь». Элизабет опустилась на колени, дрожа. Мелиодас накрыл её плащом: «Мы справимся, я обещаю».'},
{t:'Союз Братьев',s:'Зельдрис, наконец сбросивший власть отца, находит Мелиодаса на рассвете. Оба молчат. «Брат, — говорит Зельдрис, — я готов сражаться рядом с тобой». Мелиодас кивает и протягивает руку. Но Разлом посылает им навстречу демонов-предателей, что не могут простить сыновьям Короля Демонов слабость.',e:[['Демон-предатель','😈','Saber',1.5,1.4],['Демон-предатель','😈','Berserker',1.5],['Демон-маг','🔮','Caster',1.3]],w:'Предатели пали, а братья стояли спина к спине. Зельдрис впервые за три тысячи лет улыбнулся: «Хорошо, что ты вернулся». Мелиодас хлопнул его по плечу: «Хорошо, что ты у нас есть».'},
{t:'Последнее слово Мерлин',s:'Мерлин собирает всех у себя и говорит правду: она живёт целью, которая старше Британнии. «Я хотела воскресить Артура, — признаётся она. — Не для мира. Для себя». Грехи молчат. Диана хмурится, Бан отворачивается. Разлом вспыхивает вокруг Мерлин, стирая иллюзии, которыми она прятала свой дом.',e:[['Тень Мерлин','🔮','Caster',1.7,1.5],['Осколок мира','💠','Archer',1.3],['Осколок мира','💠','Berserker',1.3]],w:'Иллюзии рассеялись, и Мерлин предстала без масок. Мелиодас негромко произнёс: «Я всё знал. Но мы всё равно будем стоять рядом». Мерлин опустила глаза, впервые за долгое время не найдя слов.'},
{t:'Клятва Лостверина',s:'Сариэль приводит отряд в древнее Святилище Богини. На алтаре лежит клинок, выкованный ещё до первой Священной войны. Мелиодас протягивает руку, но меч отвечает голосом: «Докажи, что достоин». Разлом окутывает алтарь, превращая свет в тьму, и перед ним встаёт его собственная тень — тот, кем он мог бы стать, если бы сдался.',e:[['Тёмный Мелиодас','👹','Saber',2,1.7],['Тень клинка','🗡️','Lancer',1.3]],w:'Тёмный двойник растаял, а меч в руках Мелиодаса вспыхнул чистым светом. «Ну, старый друг, — усмехнулся он, — пора работать». Элизабет впервые за долгие дни улыбнулась без тени страха.'},
{t:'Последний Пир',s:'Ночью перед решающей битвой отряд собирается у костра. Хоук готовит из остатков последнюю трапезу, Бан достаёт бутылку вина, Диана поёт. Все понимают: завтра кто-то может не вернуться. «Давайте помнить только хорошее», — предлагает Кинг. Разлом крадётся из темноты, чтобы отравить эту тишину.',e:[['Тень тоски','👤','Caster',1.4,1.3],['Ночной призрак','👻','Berserker',1.4],['Ночной призрак','👻','Lancer',1.3]],w:'Призраки исчезли, и костёр снова затрещал. Бан поднял кружку: «За тех, кто с нами, и за тех, кто ушёл». Все молча чокнулись, а Хоук тихо прошептал: «И за добавку».'},
{t:'Верховный Бог',b:1,s:'Верховный Бог является во всей силе, и небеса дрожат от её голоса. «Вы, смертные, посмели встать против меня?» Мелиодас и Зельдрис встают плечом к плечу, держа мечи обеими руками. Элизабет поднимает голову: «Мама, я больше не боюсь». Разлом бьётся вокруг, но вы вместе — и это сильнее любого проклятия.',e:[['Верховный Бог','🌟','Caster',5,1.8],['Небесный страж','👼','Saber',.8],['Небесный страж','👼','Lancer',.8]],w:'Верховный Бог рассыпалась тысячей золотых искр, и проклятие Элизабет рассыпалось вместе с ней. Мелиодас упал на колени, обнимая её: «Всё кончено». Элизабет тихо улыбнулась сквозь слёзы: «Нет. Всё только начинается».'},
{t:'Мир после Бури',s:'Британния пробуждается после долгой ночи. Люди выходят из укрытий, дети играют на развалинах, а рыцари восстанавливают стены. Мелиодас и Элизабет идут по деревне, и жители кланяются им. Но Разлом ещё шевелится в глубине земли, и несколько оставшихся теней сжимаются в тугой ком.',e:[['Тень Разлома','👤','Berserker',1.3],['Тень Разлома','👤','Saber',1.3],['Осколок Разлома','💠','Caster',1.2]],w:'Тени рассеялись, и над деревней снова запели птицы. Элизабет с улыбкой протянула руку ребёнку, а Мелиодас впервые за тысячу лет позволил себе просто наслаждаться утром и запахом свежего хлеба.'},
{t:'Пробуждение Артура',s:'Мерлин приводит вас в подземелье под Камелотом. В хрустальном гробу спит юноша с ясными глазами. «Артур Пендрагон, — произносит она. — Мой король». Она поднимает руки, и по залу разливается ослепительный свет. Разлом отзывается из глубин, пытаясь помешать ритуалу, и из теней выходят стражи давно забытого мира.',e:[['Страж подземелья','🗿','Lancer',1.5,1.4],['Страж подземелья','🗿','Saber',1.5],['Тень Хаоса','🌑','Caster',1.4,1.3]],w:'Стражи рассыпались, а Артур глубоко вздохнул и открыл глаза. «Где я?» — тихо спросил он. Мерлин опустилась на колено: «Дома, мой король. Ты наконец дома, и всё ещё только начинается».'},
{t:'Король Хаоса',s:'Артур встаёт, и мир вокруг меняется: воздух дрожит, камни тают, а Разлом стягивается к нему, как металл к магниту. «Я чувствую… всё», — шепчет он. Мерлин смотрит на него с трепетом, а Мелиодас настораживается: «Мерлин, что ты наделала?» Артур вдруг поднимает взгляд и улыбается, будто знает ответ.',e:[['Тень Хаоса','🌑','Caster',1.6,1.5],['Осколок Хаоса','💠','Berserker',1.4],['Осколок Хаоса','💠','Archer',1.3]],w:'Хаос улёгся, и Артур пошатнулся. Мерлин подхватила его, дрожа: «Ты справился». Мелиодас смотрел на них долго, а потом тихо произнёс: «Значит, вот к чему ты вела нас всё это время».'},
{t:'Камелот Вечный',s:'Артур решает построить вечное королевство, и Камелот оживает под его руками: башни встают из пепла, а сады цветут прямо на глазах. Но Разлом не смирился с такой силой и посылает свою последнюю волну. Рыцари Камелота выстраиваются в строй, а Мерлин впервые улыбается без всякой хитрости.',e:[['Тварь Разлома','👹','Berserker',2,1.4],['Тварь Разлома','👹','Rider',1.4],['Тварь Разлома','👹','Lancer',1.4]],w:'Волна Разлома разбилась о стены Камелота. Артур, стоя на башне, поднял руку, и город озарился рассветом. Мелиодас негромко заметил: «Британния такая же прекрасная, как я помнил».'},
{t:'Кат Палуг, Сын Хаоса',s:'Из глубин Разлома приходит Кат Палуг, древний кот-чудовище, порождение хаоса. Он растёт с каждым мигом, глаза его горят золотом, а шерсть сливается с тенями. «Я — Кат Палуг», — мурлычет он голосом, от которого дрожит земля. Артур встаёт перед ним без страха и вытаскивает Экскалибур.',e:[['Кат Палуг (Разлом)','🐈‍⬛','Berserker',2.2,1.7],['Тень Хаоса','🌑','Caster',1.2]],w:'Кат Палуг отступил, шипя, но не исчез. Артур опустил меч: «Он вернётся. Мы должны быть готовы». Мелиодас кивнул и посмотрел на друзей: «Тогда давайте собираться. Последний бой будет за нами».'},
{t:'Прощание Грехов',s:'Когда угроза отступила, Семь Смертных Грехов расходятся: Диана и Кинг — в лес Короля Фей, Бан и Эльейн — путешествовать по Британнии, Гоуэр — искать себя, Хоук — на могилу Вайлда. Мелиодас и Элизабет идут к Лионесу. Но на прощание Разлом посылает тени, желая разрушить их дружбу навсегда.',e:[['Тень разлуки','👤','Caster',1.5,1.4],['Тень разлуки','👤','Saber',1.4],['Тень разлуки','👤','Archer',1.4]],w:'Тени растаяли, а Грехи обнялись в последний раз. Диана вытерла слёзы: «Мы всегда будем вместе, где бы ни оказались». Мелиодас улыбнулся, глядя, как друзья расходятся по разным дорогам, и не сказал ни слова.'},
{t:'Могила Вайлда',s:'Хоук с помощью Мерлин отправляется в Чистилище, чтобы поставить могилу своему старшему брату Вайлду. Земля там выжжена, а над скалами тлеет остаток Разлома. Хоук идёт вперёд один, стиснув зубы, и ворчит: «Я не плачу, это пыль». Из трещин поднимаются чудовища, охраняющие путь к месту последней битвы.',e:[['Чудовище Чистилища','👹','Berserker',1.4,1.4],['Чудовище Чистилища','👹','Rider',1.3],['Тень Разлома','👤','Caster',1.3]],w:'Чудовища пали, и Хоук замер у скалы: на ней сидел живой Вайлд и лениво жевал что-то. «Ты долго, братишка», — усмехнулся он. Хоук разревелся и бросился ему на шею, а Мерлин тактично отвернулась.'},
{t:'Восемнадцать месяцев спустя',s:'Проходит полтора года: в Британнии мир, рыцари вернулись на службу, а Гильтандер и Хаузер обучают новичков. Но Разлом, спрятанный в самых глубоких трещинах мира, тихо ждёт. Вас находит гонец с вестью: на границе появились странные всадники, чьи кони оставляют выжженные следы, а глаза тлеют красным.',e:[['Всадник Разлома','🏇','Rider',1.5,1.4],['Всадник Разлома','🏇','Lancer',1.4],['Тень коня','🐎','Berserker',1.3]],w:'Всадники растаяли в дыму, оставив на дороге обугленные подковы. Гонец дрожащим голосом прошептал: «Это лишь предвестники. Говорят, идут Четыре Всадника Апокалипсиса». Небо на востоке потемнело.'},
{t:'Четыре Всадника',s:'На горизонте встают четыре тени: Война, Голод, Мор и Смерть. Четыре Всадника Апокалипсиса пробудились силой Разлома и идут на Камелот. Мелиодас, Элизабет и старые друзья спешат на помощь, а Артур выходит на башню и шепчет: «Пришло время, друзья. Британния не падёт». Небеса разрываются алой молнией.',e:[['Всадник Войны','⚔️','Saber',1.8,1.5],['Всадник Мора','☠️','Caster',1.8,1.5]],w:'Первые два Всадника дрогнули и отступили. Мелиодас вытер лоб и шепнул Элизабет: «Похоже, история не закончилась». Она улыбнулась, крепко сжав его ладонь: «Тогда будем писать её дальше».'},
