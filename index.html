.pt img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.pt .nm{position:absolute;bottom:0;left:0;right:0;font-size:10px;padding:14px 3px 3px;background:linear-gradient(transparent,#000d);color:#fff;line-height:1.1}
.r5 .pt::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(115deg,transparent 40%,#fff5 50%,transparent 60%);background-size:250% 100%;animation:sh 2.5s infinite}

/* 7★ divine glitch */
.r7{border:3px solid #0ff!important;background:repeating-linear-gradient(0deg,#0007 0 2px,transparent 2px 4px),linear-gradient(#150033,#00202b)!important;animation:g7b .9s steps(1) infinite,g7sh 3.1s steps(1) infinite}

/* ===== 1★ чёрная звезда v4: «Ничто» — чёрная пустотная рамка, чистый портрет, 3 маленьких символа (ASTRAL_ARATA_V4). Анимации: steps(), opacity/transform/clip-path; без filter ===== */
.r1,.f.r1{position:relative;border:4px solid #05000a!important;background:repeating-linear-gradient(90deg,#0000 0 7px,#a0f1 7px 8px),linear-gradient(#050009,#0d000a)!important;box-shadow:0 0 3px 1px #14002a,inset 0 0 0 1px #0a0010,inset 0 0 12px #000;clip-path:polygon(-4px 10px,10px -4px,calc(100% - 7px) -4px,calc(100% + 4px) 6px,calc(100% + 4px) calc(100% - 12px),calc(100% - 9px) calc(100% + 4px),4px calc(100% + 4px),-4px calc(100% - 5px));animation:gxfr 3.3s steps(1) infinite}

/* рамка: ::before — сегменты глубокого чёрного и #0a0010 + «куски пустоты» (чёрные треугольники), уходящие внутрь; ::after — редкие короткие вспышки тёмного пурпура и 1 белый пиксель */
.r1::before,.r1::after{content:'';position:absolute;top:-4px;right:-4px;bottom:-4px;left:-4px;z-index:3;pointer-events:none;background:repeating-linear-gradient(90deg,#000 0 13px,#0a0010 13px 22px,#030006 22px 29px,#12001f 29px 33px,#000 33px 47px,#0a0010 47px 58px) 0 0/100% 4px no-repeat,repeating-linear-gradient(90deg,#0a0010 0 17px,#000 17px 26px,#12001f 26px 30px,#000 30px 49px,#050008 49px 57px) 0 100%/100% 4px no-repeat,repeating-linear-gradient(180deg,#000 0 14px,#0a0010 14px 21px,#000 21px 38px,#12001f 38px 42px,#050008 42px 55px) 0 0/4px 100% no-repeat,repeating-linear-gradient(180deg,#0a0010 0 11px,#000 11px 29px,#030006 29px 36px,#12001f 36px 40px,#000 40px 52px) 100% 0/4px 100% no-repeat,linear-gradient(to bottom right,#000 50%,#0000 0) 26% 0/14px 10px no-repeat,linear-gradient(to bottom left,#000 50%,#0000 0) 71% 0/10px 7px no-repeat,linear-gradient(to top right,#000 50%,#0000 0) 44% 100%/16px 10px no-repeat,linear-gradient(to bottom right,#0a0010 50%,#0000 0) 0 38%/9px 18px no-repeat,linear-gradient(to bottom left,#000 50%,#0000 0) 100% 64%/10px 16px no-repeat}

/* 3 маленьких символа (12–16px) в углах/у краёв, полупрозрачные; <b class=gxg> = слот из 3 вариантов (<u>), один виден всегда; смена шагами */
.pt.gx .gxg{z-index:3;font-family:'Noto Sans Symbols','Noto Sans Symbols 2','Segoe UI Symbol','DejaVu Sans Mono',ui-monospace,Menlo,Consolas,monospace,system-ui,sans-serif;font-size:var(--fs,14px);line-height:1;font-weight:700;white-space:nowrap;width:0;height:1em;opacity:.55;animation:gxgm 3.7s steps(1) infinite}

 <div class="small${h.secret?' vd':''}" style="margin-top:8px">${vd(`<b>Навык «${h.skill.n}» ур.${skl}:</b> ${skDesc(h,o)}`)}</div><div class="small${h.secret?' vd':''}" style="margin-top:4px">${vd(`<b>NP «${h.np.n}» ур.${npl}:</b> ${h.np.aoe?'урон по всем врагам':'урон по цели'}, тип ${CARD[h.np.t].n}, мощность ×${(h.np.m*npMul(o)).toFixed(1)}`)}</div>${mp}</div></div>

function skUp(id){const o=S.owned[id],l=sk(o);if(l>=10||S.gold<skCost(l))return;S.gold-=skCost(l);o.sk=l+1;prog('skl');save();hero(id);render()}
function npUpg(id){const o=S.owned[id],l=o.npl||1;if(l>=5||S.gold<npCost(l))return;S.gold-=npCost(l);o.npl=l+1;prog('skl');save();hero(id);render()}
function togT(id){const i=S.team.indexOf(id);if(i>=0){if(S.team.length<=1)return toast('В отряде должен остаться хотя бы один герой');S.team.splice(i,1)}else{if(S.team.length>=3)return toast('Отряд полон (3 героя). Сначала уберите кого-то.');S.team.push(id)}save();closeM();render()}

{t:'Алый круг над Фуюки',s:'Вы касаетесь печати призыва, и Врата Астрала распахиваются над ночным Фуюки. Из света выходит девушка в белом плаще со знаменем: «Я Жанна д’Арк. Я услышала ваш зов, Призыватель». Но следом из трещины в небе хлынули Тени — искажённые отражения Слуг, и они голодны. Город замер, будто ждал этого часа.',e:[['Тень слуги','👤','Saber'],['Тень слуги','👤','Archer'],['Тень-гуль','🧟','Berserker']],w:'Тени рассеялись, и над Фуюки снова стало тихо. Жанна опустила знамя: «Это лишь начало. Трещина над городом растёт, а Война за Грааль уже началась».'},
{t:'Синий Лансер на школьном дворе',s:'Ночью в школе Хомурахара звенит сталь: синий воин с алым копьём гонит вас через двор. Ку Хулин служит своему мастеру честно, но в его глазах тлеет красная искра Разлома. «Извини, парень, — шепчет он. — Копьё не спрашивает моего мнения». Жанна поднимает знамя, закрывая вас от первого удара.',e:[['Ку Хулин (Лансер)','🔱','Lancer',1.5,1.2],['Тень слуги','👤','Lancer']],w:'Красная искра в глазах Ку Хулина погасла. Он ухмыльнулся, отступая в темноту: «Живучие. Бегите к Тосака — там вам объяснят правила этой игры».'},
{t:'Кровавый Форт Райдера',s:'Синдзи Мато развернул над школой Кровавый Форт: люди слабеют и падают прямо в коридорах, жизнь утекает в алый купол. Медуза скользит по стенам, а цепи с кинжалами свистят над головой. Рин цедит сквозь зубы: «Терпеть не могу, когда воруют чужие жизни. Разберёмся, и быстро». Воздух пахнет железом и страхом.',e:[['Медуза (Райдер)','🐍','Rider',1.4,1.2],['Тень-гуль','🧟','Berserker'],['Тень-гуль','🧟','Berserker']],w:'Форт рухнул, как карточный домик, и школьники медленно приходят в себя. Жанна прикрыла собой упавшую девочку: «Жизни возвращаются. Но Мастер Райдера всё ещё где-то рядом».'},
{t:'Ворота храма Рюдо',s:'На лестнице к храму Рюдо стоит одинокий самурай с длинной катаной. Сасаки Кодзиро не настоящий Слуга: Кастер привязала его к воротам как стража. «Ласточка не ищет прямых дорог», — улыбается он, и клинок чертит в воздухе двойной полумесяц. Тени Разлома тянутся к нему, но он лишь отмахивается.',e:[['Сасаки Кодзиро','⚔️','Archer',1.6,1.3],['Тень слуги','👤','Saber']],w:'Кодзиро убрал катану и склонил голову: «Достойный бой. Я лишь дверь, а двери не держат гостей. Идите — но Кастер вас не пощадит».'},
{t:'Безумец из леса Айнцберн',s:'Заснеженный лес Айнцберн дрожит от шагов гиганта. Иллиясфиль смеётся, стоя на плече великана: «Убей их, Берсеркер!» Геракл поднимает каменный топор-меч — герой, прошедший двенадцать подвигов, чьи жизни приходится отнимать одну за другой. Рин бледнеет: «Это не бой, это стихия. Держитесь!» Снег под его ногами превращается в крошево льда и камня, а ветер несёт звериный рёв.',e:[['Геракл (Берсеркер)','🗿','Berserker',2,1.4]],w:'Геракл опустился на колено, и в его взгляде вспыхнула ясность: «Славный бой». Иллия отвернулась, кусая губу, а чёрная нить Разлома в воздухе тихо оборвалась.'},
{t:'Змея под храмом',s:'Кастер укрылась в подземельях храма и плетёт нити магии из чужой жизни. Медея хохочет из-за фиолетового тумана: «Мне нужна лишь свобода для моего мастера. Ради неё я сожгу этот город». Стены оживают, драконьи зубы прорастают костяными воинами, а Тени Разлома шепчут ей новые заклинания. Свечи гаснут одна за другой.',e:[['Медея (Кастер)','🔮','Caster',1.5,1.3],['Драконотуск','💀','Saber'],['Драконотуск','💀','Saber']],w:'Заклинания Медеи развеялись, и она упала на колени. «Разлом отравляет нас всех, — прошептала она. — Ищите врага, что ближе, чем вы думаете».'},
{t:'Кузуки-сэнсэй',s:'Школьный учитель Кузуки Соитиро оказался мастером Кастер и ждёт вас на пустой лестнице храма. Он не маг, но каждое движение выточено годами тренировок. «Я защищаю то, что мне дорого, — говорит он. — Не ждите пощады». Тени Разлома вползают в его тень, делая руки быстрее и жёстче.',e:[['Кузуки Соитиро','🥋','Lancer',1.4,1.3],['Тень Разлома','🌑','Archer']],w:'Кузуки опустил руки, признавая поражение. «Пожалуйста, берегите Кастер», — тихо сказал он. Рин сжала кулак: «Настоящий Мастер сидит не здесь, и мы его найдём».'},
{t:'Проповедь Кирэя',s:'В церкви Фуюки священник Котомине Кирэй распахивает руки в приветствии: «Добро пожаловать, ягнята. Вы пришли за ответом, а получите испытание». В его глазах нет злобы, лишь глубокая пустота, и Разлом с наслаждением питается ею. Чёрные Ключи вспарывают полумрак, целясь вам в сердце. Голос священника звучит почти ласково.',e:[['Котомине Кирэй','✝️','Lancer',1.5,1.4],['Чёрный Ключ','🗝️','Archer'],['Тень слуги','👤','Caster']],w:'Кирэй улыбнулся, отступая в тень: «Хорошо. Вы кричите громче, чем я ожидал. Но настоящая проповедь ещё впереди — под горой Энзо».'},
{t:'Красный Плащ',s:'На вершине холма стоит Арчер в красном плаще. Он был союзником Рин, но Разлом вложил ему в руки клинки и одну цель — убить Широ Эмию. «Ты идеалист, — усмехается он. — Пожалуй, пора закончить эту иллюзию». Мир вокруг вспыхивает пламенем, и в небе повисают тысячи мечей.',e:[['Эмия (Арчер)','🏹','Archer',2,1.4],['Отражение клинка','🗡️','Saber',.8,.9]],w:'Пламя погасло, оставив на камнях сотни обломанных мечей. Эмия смотрел на вас с усталой улыбкой: «Поверить в себя — наверное, самое трудное на свете».'},
{t:'Золотой Царь: Врата Вавилона',b:1,s:'Гильгамеш выходит из тени с усмешкой человека, которому принадлежит мир: «Я не служу Разлому, я использую его. Докажите, что достойны звания Призывателя, дворняги». За его спиной раскрываются золотые врата, а в них — тысяча клинков, каждый из которых когда-то был легендой. Воздух звенит от древней ярости.',e:[['Гильгамеш','👑','Archer',3.5,1.4],['Врата Вавилона','🌟','Archer',.7,.9]],w:'Клинки замерли. Гильгамеш хмыкнул: «Ты забавен, Призыватель. Один раз помогу, но только против настоящего врага». Рин выдохнула: «Мы выжили. Но Грааль ещё не сказал последнего слова».'},

{t:'Чёрная Тень над Мисаки',s:'После ночной схватки из-под горы Энзо ползёт чёрная тень. Она поглощает Слуг, оставляя лишь пустые плащи на асфальте. Жанна сжимает знамя: «Это не Разлом, но он ему сродни». Сакура Мато стоит у обочины, бледная, и тьма тянется к ней, как к хозяйке, ласково и жадно.',e:[['Чёрная Тень','🖤','Berserker',1.3,1.2],['Тень слуги','👤','Archer'],['Тень слуги','👤','Lancer']],w:'Тень отступила, но лишь на шаг. Сакура спрятала лицо в ладонях: «Простите. Я не хотела, чтобы так вышло». Вы понимаете, что пути назад уже нет.'},
{t:'Дом Мато: гнездо червей',s:'В подвале усадьбы Мато шевелится живой ковёр насекомых: Матоу Дзоукэн веками пожирал чужие души, продлевая свою жизнь. Тени Разлома сплелись с червями в единый организм и ползут по стенам. «Ты пришёл слишком поздно, юнец», — хрипит старик из глубины тьмы, и пол под ногами оживает.',e:[['Матоу Дзоукэн','🧙','Caster',1.5,1.3],['Рой червей','🪱','Berserker',1.2],['Рой червей','🪱','Berserker',1.2]],w:'Черви обратились в пепел, но сам старик исчез в стене, оставив хриплый смех. Жанна закрыла глаза: «Он ещё дышит, и его тьма стала новым Граалем».'},
{t:'Цепи Райдера',s:'Медуза стоит между вами и Сакурой. Её долг — защитить мастера, даже если тот стал источником беды. «Отойдите. Я не хочу проливать вашу кровь», — говорит Райдер, и цепи с кинжалами вспыхивают в воздухе. Взгляд Медузы холоден, но в нём дрожит боль, а чёрная тень за спиной Сакуры требует расправы.',e:[['Медуза (Райдер)','🐍','Rider',1.5,1.3],['Тень Разлома','🌑','Berserker']],w:'Цепи опали к ногам. Медуза поклонилась Сакуре и прошептала: «Простите, что не смогла оградить вас от всего. Идите — вы сильнее, чем думаете».'},
{t:'Церковь и исповедь',s:'Кирэй превратил церковь в алтарь чёрной грязи. Он говорит о том, что рождённый в скверне человек не способен стать чистым, и протягивает вам руку: «Присоединись, и станешь свидетелем рождения нового мира». Стены дышат тёмной силой, витражи плачут чёрными каплями, а Тени Грааля выползают из-под скамей.',e:[['Котомине Кирэй','✝️','Lancer',1.6,1.4],['Чёрная грязь','🌑','Berserker',1.2],['Тень Грааля','🖤','Caster',1.2]],w:'Кирэй упал на скамью и рассмеялся: «Прекрасно. Значит, вы способны меня удивить». Грязь стекла с алтаря, и церковь наконец затихла, как после долгой бури.'},
{t:'Чёрный Сэйбер',s:'Артурия, ставшая тенью самой себя, стоит на мосту в чёрных доспехах. «Экскалибур Морган» вспарывает ночь потоками тьмы, и река под мостом вскипает. Жанна выходит вперёд, подняв знамя: «Позвольте мне встретить её. Мы обе знаем, что значит нести бремя героя». В её голосе нет страха, только печаль.',e:[['Сэйбер Альтер','🖤','Saber',2.1,1.5]],w:'Чёрная сталь рассыпалась искрами. Артурия опустила меч, и в её взгляде мелькнуло человеческое: «Прости. Я не могла остановиться… Остановите Грааль, пока не поздно».'},
{t:'Безумный Геракл против Тени',s:'Берсеркер Иллиясфили встречает чёрную Тень, что уже поглотила нескольких Слуг. Геракл ревёт, его жизни тают одна за другой, а Иллия кричит сквозь слёзы: «Не проиграй! Ты обещал!» Разлом делает тьму быстрее и острее, а земля вокруг покрывается трещинами, из которых сочится густая чёрная слизь. Иллия сжимает кулачки.',e:[['Тень Грааля','🖤','Berserker',1.6,1.3],['Геракл (Берсеркер)','🗿','Berserker',1.5,1.3]],w:'Тень содрогнулась и рассыпалась. Геракл рухнул, улыбаясь: «Благодарю тебя, Иллия». Девочка упала на колени, а за её спиной погасла звезда.'},
{t:'Малый Грааль Иллии',s:'В замке Айнцберн Иллия признаётся: она — сосуд Малого Грааля, и её тело почти исчерпано. Горничные-хомункулы преграждают вам путь, повинуясь приказу Разлома, а коридоры замка стынут от холода. «Не смотрите на меня так, — говорит она. — Спасите Сакуру, пока не поздно, и пусть моя жизнь чего-то стоит».',e:[['Горничная-хомункул','🧹','Lancer'],['Горничная-хомункул','🧹','Saber'],['Тень Разлома','🌑','Caster',1.3,1.1]],w:'Иллия впервые улыбнулась по-настоящему. «Спасибо. Теперь я знаю, за что жила». Из глубины замка донёсся знакомый шёпот червей — Дзоукэн ещё не сдался.'},
{t:'Сад Дзоукэна',s:'Дзоукэн, слившись с червями и тенями, пытается заново возродиться в теле Сакуры. Земля под ногами ходит ходуном, из стен вырываются жуткие щупальца, а воздух пахнет гнилью. «Бессмертие — не плата, а право!» — кричит он. Ваш круг призыва вспыхивает в ответ, наполняя ладони жаром, и Жанна встаёт рядом.',e:[['Матоу Дзоукэн (Червь)','🪱','Caster',1.9,1.4],['Щупальце Тени','🌑','Berserker']],w:'Дзоукэн рассыпался в прах, и черви обратились золой. Сакура наконец вздохнула свободно: «Я могу дышать. Впервые за много лет я могу дышать».'},
{t:'Под горой Энзо',s:'В пещере под горой Энзо течёт чёрная грязь — чаша Грааля переполнена проклятиями. Кирэй сидит на камне и ждёт вас: «Пора взглянуть, чем станет мир без надежды». Разлом откликается на его слова, а стены трясутся от голодных Теней, ползущих со всех сторон. Пещера гудит, будто огромное сердце.',e:[['Котомине Кирэй','✝️','Lancer',1.7,1.5],['Тень Грааля','🖤','Caster',1.3],['Чёрная грязь','🌑','Berserker',1.3]],w:'Кирэй улыбнулся и растворился в грязи, оставив лишь смех. Пульсирующее чёрное сердце впереди забилось громче, и путь к нему наконец открылся.'},
{t:'Ангра-Майнью: Всё Зло Мира',b:1,s:'Грааль раскалывается, и поднимается воплощение всех проклятий — Ангра-Майнью. Тьма растёт до самого неба, Разлом сливается с ней, и над Фуюки нависает чёрное солнце. Сакура тихо шепчет: «Зовите всех, кого можете». Ваши руки горят от силы Врат Астрала, а рядом стоят все, кого вы успели спасти.',e:[['Ангра-Майнью','🖤','Berserker',4,1.5],['Тень Грааля','🌑','Caster',.7,.9],['Тень Грааля','🌑','Archer',.7,.9]],w:'Чёрное солнце угасло, и Разлом над Фуюки закрылся. Сакура обняла Иллию: «Мы живы». Но круг призыва ещё светится — за Фуюки открываются другие времена.'},

{t:'Голоса Грааля: 1994',s:'Круг призыва тянет вас в прошлое города: Разлом раскрыл память Грааля о Четвёртой войне. В ночном порту Фуюки Тени героев уже сражаются за призрачные цели, и всё вокруг выглядит чуть старше и чуть темнее. Жанна шепчет: «Мы смотрим на прошлое, но оно способно ранить». Из тумана выходят первые враги.',e:[['Тень слуги','👤','Lancer'],['Тень слуги','👤','Saber'],['Тень слуги','👤','Archer']],w:'Видение стало резче: вы слышите голоса Мастеров и звон клинков. Кто-то на складе шепчет: «Клянусь ради своего идеала». Четвёртая Война началась.'},
{t:'Копьё Диармайда',s:'Ирландский рыцарь Диармайд сражается с Сэйбер в порту и не знает, что Тень Разлома уже вплелась в рукоять его алого копья. «Я обещал служить верой и правдой, — говорит он. — Но чью волю я исполняю?» Красное и жёлтое копья свистят одновременно, и волны бьются о причал, словно аплодируя.',e:[['Диармайд (Лансер)','🔱','Lancer',1.5,1.3],['Тень Разлома','🌑','Saber']],w:'Диармайд отвёл копья и грустно улыбнулся: «Рыцарь, что служит недостойному, всё равно остаётся рыцарем». Он растворился, оставив на песке отпечаток сапога.'},
{t:'Кастер из Бретани',s:'Жиль де Рэ, маршал Франции, когда-то сражавшийся рядом с Жанной, ныне зовёт кошмары из книги Прелата. Он видит в вас святую и падает на колени: «Дева! Ты вернулась!» Из воды выползают щупальца — Разлом изуродовал его молитвы, превратив в кошмар наяву. Жанна бледнеет, но не отводит взгляда.',e:[['Жиль де Рэ (Кастер)','📖','Caster',1.6,1.3],['Морской демон','🐙','Berserker',1.2],['Морской демон','🐙','Berserker',1.2]],w:'Морские чудовища рассеялись. Жанна долго смотрела на воду: «Жиль… Прости, что не смогла тебя уберечь». Голоса из книги замерли навсегда.'},
{t:'Колесница Завоевателя',s:'Небо разрывается грозой: Искандер, царь Македонии, мчится на колеснице с быками, а рядом храбро держится юный Уэйвер. «Ха-ха! Присоединяйтесь к моему войску!» — кричит он. Но Разлом заразил и его верных воинов — Тени бегут за ним рядами, а ветер приносит песок далёких пустынь. Уэйвер вцепился в поручень.',e:[['Искандер (Райдер)','🐂','Rider',1.7,1.3],['Тень воина','🛡️','Lancer'],['Тень воина','🛡️','Saber']],w:'Колесница сошла с неба. Искандер расхохотался: «Хороший бой! За такое стоило выпить». Уэйвер смущённо кивнул вам, вытирая пот со лба.'},
{t:'Рыцарь Озера в Безумии',s:'На пустой улице появляется чёрный воин в шлеме, и любое оружие мира становится его орудием. Ланселот, потерявший разум от вины, преследует Сэйбер. «Арторияааа!» — стонет он. Шипы Разлома прорастают сквозь его латы, а каждое движение сопровождается рёвом и скрежетом металла, от которого дрожат стёкла. Жанна невольно отступает на шаг.',e:[['Ланселот (Берсеркер)','⚫','Berserker',2,1.5],['Тень слуги','👤','Lancer']],w:'Чёрный шлем треснул, и на миг открылось лицо печального рыцаря. «Прости меня, мой король», — прошептал он и растворился в дыму.'},
{t:'Сотня лиц Ассасина',s:'В переулках Фуюки сотни ассасинов Хассана Сабаха следят за каждым вашим шагом. Разлом расщепил их на десятки Теней, и те бесшумно скользят по крышам. «Мы сотня, но мы одно», — шепчут голоса. Кинжалы летят из каждой подворотни, а лунный свет режет глаза, скрывая движения врагов.',e:[['Хассан-ассасин','🗡️','Archer',1.3,1.2],['Хассан-ассасин','🗡️','Archer',1.3,1.2],['Тень Хассана','👤','Lancer',1.2]],w:'Ассасины растворились в темноте. Один задержался и склонил голову: «Госпожа Дева, ваш свет достоин уважения». Он исчез, и ночь снова стала тихой.'},
{t:'Кариа и чёрные черви',s:'Кариа Мато согласился на пытку ради Сакуры. Его тело изъедено червями, и Разлом сделал его боль оружием: чёрный Берсеркер ломает камень, а сам Кариа кричит: «Я не остановлюсь! Я вытащу её из этой грязи!» Сердце сжимается: перед вами не злодей, а человек, готовый на всё.',e:[['Кариа Мато','🪱','Caster',1.5,1.3],['Чёрный Берсеркер','⚫','Berserker',1.4,1.3]],w:'Кариа упал, и черви обратились в пепел. Он выдохнул: «Скажи Сакуре… что я хотел лишь одного». Его глаза закрылись, а вы отвернулись.'},
{t:'Замок лорда Эльмелоя',s:'Кейнет Эльмелой Арчибальд, потерявший Лансера, ищет способ вернуть былую гордость. Разлом дарит ему ложную надежду: Тени склоняются перед ним в поклоне, словно верные вассалы. «Я — лорд Эльмелой, — цедит он. — Уступите или падите». Замок наполняется ловушками, ядовитыми чарами и шёпотом чужих голосов. Тени бесшумно скользят по коридорам.',e:[['Кейнет Эльмелой','🎩','Caster',1.5,1.3],['Хомункул-страж','🤖','Lancer'],['Тень Разлома','🌑','Archer']],w:'Ловушки замолкли, и Кейнет опустился в кресло, побеждённый. «Я желал лишь признания, — сказал он. — Похоже, я искал не там, где нужно».'},
{t:'Кирицугу и последний выстрел',s:'Кирицугу Эмия, «Убийца магов», идёт по пустому заводу с холодным лицом. Он спасёт мир любой ценой, и Разлом слышит его отчаянную цель. «Если придётся пожертвовать немногими ради многих, я готов», — говорит он. Вокруг вспыхивают кроваво-красные искры, и Тень Сэйбер встаёт рядом с ним. Он не колеблется ни секунды.',e:[['Эмия Кирицугу','🔫','Archer',2,1.4],['Тень Сэйбер','🌑','Saber',1]],w:'Кирицугу опустил оружие. «Так это и есть мой путь. Простите». Голос его дрогнул, и он растворился в тумане, оставив на земле гильзу.'},
{t:'Пожар в Фуюки',b:1,s:'Чаша Грааля лопнула, и на Фуюки хлынул чёрный огонь. Тени и чудовища идут волной по улицам, оставляя лишь пепел и тишину. В пламени вы слышите голос Сэйбер: «Я хотела спасти страну, а принесла лишь гибель». Разлом сплетается с памятью и рождает исчадие войны — огонь, что помнит каждую смерть.',e:[['Порождение Пожара','🔥','Berserker',4.5,1.5]],w:'Огонь гаснет, и вы смотрите в тихое небо. Видение обрывается, оставляя тяжесть на душе. Жанна сжала вашу руку: «Идём дальше. Впереди — другая Война».'},
]);

{t:'Замок Юггдмиллении',s:'Новая дорога Врат приводит вас в Румынию, в замок клана Юггдмиллениа. Здесь Чёрная фракция отделилась от Ассоциации магов, и Великая Война Грааля готова вспыхнуть. Жанна вдруг чувствует новую силу: «Я здесь как Рулер, Призыватель». Но замок уже кишит Тенями Разлома, вылезающими из подземных ходов, и стража не понимает, кто друг, а кто враг.',e:[['Тень-гомункул','🧪','Caster'],['Страж Юггдмиллении','🛡️','Lancer'],['Тень слуги','👤','Archer']],w:'Стража опустила оружие, пока Тени растворялись в камне. Дарник, глава клана, окинул вас тяжёлым взглядом: «Рулер? Что ж, война не станет тише, но станет справедливее».'},
{t:'Гончая Аталанта',s:'В ночных лесах Тримасау вас преследует Чёрный Арчер: Аталанта, охотница из Калидонской охоты, ненавидит всё, что не считает ребёнком. Стрелы летят из-за каждого дерева, а Разлом делает их быстрее ветра. «Не подходи к детям, — рычит она. — Не смей им лгать!» Жанна закрывает вас плащом, заслоняя от смертельного ливня.',e:[['Аталанта (Арчер Чёрных)','🏹','Archer',1.5,1.3],['Тень-охотник','👤','Archer']],w:'Стрелы прекратились. Аталанта осела на ветку, тяжело дыша: «Ты не лжёшь детям. Я это чувствую». Лес вокруг словно вздохнул с облегчением и затих.'},
{t:'Всадник на Гиппогрифе',s:'С неба падает розовая молния: рыцарь Карла Великого Астольфо, Чёрный Райдер, приветствует вас с обезоруживающей улыбкой. «Здорово! Новые друзья!» — кричит он, размахивая копьём Триббл. Но Разлом исказил его беззаботность, и Гиппогриф уже несётся в атаку, а волшебный рог оглушает окрестности. Жанна невольно улыбается сквозь тревогу.',e:[['Астольфо (Райдер Чёрных)','🦄','Rider',1.5,1.3],['Тень-гиппогриф','🦅','Rider']],w:'Гиппогриф приземлился, а Астольфо весело рассмеялся: «Вот это бой! Ты сильна, Рулер!» Он вскинул руку в приветствии и исчез в вихре розовых перьев.'},
{t:'Дитя Франкенштейна',s:'В подвалах замка вас встречает Франкенштейн — Чёрный Берсеркер, сшитый из чужих тел и чужой боли. Мастер Форвердж Юггдмиллениа использует её как оружие, а Разлом заставляет молнию бить сквозь стены. «Уууу…» — стонет она, а электрическая дуга заливает коридор синим светом. Вы видите в её глазах невыразимое одиночество.',e:[['Франкенштейн (Берсеркер Чёрных)','⚡','Berserker',1.7,1.4],['Тень-гомункул','🧪','Caster']],w:'Разряды стихли. Франкенштейн неловко присела и коснулась вашей ладони: «Спасибо. Я хочу… быть кем-то. Не оружием». Молнии погасли, и коридор снова стал тёмным.'},
{t:'Красный Мордред',s:'На окраине замка вас встречает Красный Сэйбер — Мордред, сын Артурии. Она в шлеме и красных доспехах, взгляд полон вызова. «Ты мне не нравишься, Рулер, — усмехается она. — Слишком чистая!» Молния Клараунта бьёт по камням, и Разлом отзывается пляской чёрных вспышек по её мечу, делая каждое движение стремительным.',e:[['Мордред (Сэйбер Красных)','⚔️','Saber',2,1.4]],w:'Мордред тяжело дышала, опершись на меч. «Ладно, признаю, ты крепкая. Хочу продолжить, когда всё это закончится». Красные молнии погасли, и она ушла в ночь, хмыкнув.'},
{t:'Спартак: Восстание рабов',s:'Красный Берсеркер Спартак выходит из тьмы с гигантским мечом, а за ним — сотни рабов, живых или Теней. «Свобода! — рычит он. — Все мы имеем право на свободу!» Разлом превращает его армию в неудержимую волну, а щит гладиатора отражает удары как гора. Жанна кладёт руку на знамя: «Он не враг. Он лишь ослеплён».',e:[['Спартак (Берсеркер Красных)','🛡️','Berserker',1.6,1.4],['Тень раба','⛓️','Lancer'],['Тень раба','⛓️','Saber']],w:'Спартак опустил меч и посмотрел на своих людей, точно очнувшись: «Свободные не убивают друг друга». Он улыбнулся и растворился, а цепи на земле рассыпались в пыль.'},
{t:'Пятка Ахиллеса',s:'Небо озаряет золото: Ахиллес, Красный Райдер, мчится на колеснице, и ни один клинок не в силах его ранить. «Увидел тебя, Рулер! — смеётся он. — Ну-ка, покажи, из чего сделана твоя вера!» Разлом усиливает его бессмертие, а колесница разметает Тени по всей долине. Только одна пятка остаётся уязвимой, но до неё далеко.',e:[['Ахиллес (Райдер Красных)','🏛️','Rider',1.8,1.4],['Тень воина','🛡️','Lancer']],w:'Стрела Разлома вонзилась в пятку, и Ахиллес рухнул на колесницу с уважительным вздохом: «Хорошая работа. Не ожидал такого от юных». Его силуэт растворился в золотой пыли.'},
{t:'Карна: Даритель Брони',s:'Красный Лансер Карна выходит на пустошь, освещённую алым закатом. Его золотые доспехи — плод солнечного отца, и лишь Индра лишил его неуязвимости. «Я не убиваю без чести, — говорит он. — Но и не отступаю без причины». Копьё Васави Шакти пылает, и Разлом вплетает в него тени ушедших эпох.',e:[['Карна (Лансер Красных)','☀️','Lancer',2,1.5],['Тень Индры','🌩️','Archer',.8,.9]],w:'Карна опустил копьё и склонил голову: «Ты сражалась честно, Рулер. Мне было приятно». Золотой свет вокруг него погас, а в небе прокатился далёкий гром.'},
{t:'Хирон и Шекспир',s:'Красный Архер Хирон, кентавр-наставник героев, ведёт вас по каменным ущельям. Рядом Шекспир, драматург-Кастер, с иронией нарочито стучит по столу: «О, как драматична сцена!» Разлом делает пьесу реальностью: призрачные декорации оживают, а стрелы Хирона летят сквозь них, безошибочно находя цель среди фальшивых кулис. Каждая реплика звучит как строка из пьесы, и зрители-призраки жадно ловят каждое слово.',e:[['Хирон (Арчер Красных)','🐴','Archer',1.5,1.3],['Шекспир (Кастер Красных)','📜','Caster',1.4,1.2],['Тень-актёр','🎭','Rider']],w:'Пьеса оборвалась, и занавес рухнул. Хирон коротко кивнул: «Ты достойна». Шекспир, смеясь, махнул шляпой: «Финал ещё впереди, но он мне уже нравится».'},
{t:'Висячие Сады: Семирамида и Амакуса',b:1,s:'В небе над Румынией поднимается Висячий Сад Семирамиды, а на его вершине ждёт Амакуса Сиро Токисада — Рулер Красных, воин веры, не сумевший спасти мир. «Я хочу спасти всех», — говорит он тихо, и Разлом сливается с Граалем. Жанна встаёт напротив: «Тогда я остановлю тебя, брат по вере. Но не как враг».',e:[['Амакуса Сиро Токисада','✝️','Caster',3.8,1.5],['Семирамида (Ассасин)','🐍','Archer',.8,.9]],w:'Сад рассыпался на осколки, и Разлом потянулся к небу. Амакуса опустил руки и коротко улыбнулся: «Может быть, стоило поверить хоть кому-то ещё». Война окончена, но в небе рождается ещё одна луна.'},

{t:'Лунная Сота: Пробуждение',s:'Вы падаете сквозь тьму и оказываетесь в цифровых коридорах Лунной Соты — суперкомпьютера, созданного во имя Грааля. Тысяча Мастеров сражается здесь друг с другом, а проигравшие исчезают. Жанна оглядывается: «Я чувствую Разлом. Он слился с Сотой». Из терминалов выходят тени, лишённые лиц, и бросаются на вас.',e:[['Программа-охранник','💾','Lancer'],['Программа-охранник','💾','Saber'],['Тень Соты','👤','Archer']],w:'Стражи рассыпались цифровой пылью. Вы заметили высокого юношу в форме — Хакуно Кишинами, и в его глазах мелькнуло удивление: «Другой Мастер? Или… гость?»'},
{t:'Пират в Кальмаре',s:'Первый бой Лунной Соты — против Синдзи Мато. Он смеётся, скрестив руки: «Ты серьёзно думаешь, что победишь?» Рядом Райдер, Френсис Дрейк, лихая пиратка с ветром в волосах. «Ха-ха, добыча сама пришла!» Золотая Лань, её корабль, разворачивает пушки, и Разлом заставляет всю арену дрожать от каждого залпа.',e:[['Френсис Дрейк (Райдер)','🏴‍☠️','Rider',1.5,1.3],['Синдзи Мато','🎮','Caster',1]],w:'Пушки смолкли, и Дрейк поклонилась: «Славный шторм, юнцы». Синдзи, дрожа, растворился в цифровой пыли, а над ареной прозвучал холодный голос Рулера Соты: «Поединок засчитан».'},
{t:'Лесной Стрелок Дан',s:'На втором этаже Арены вас ждёт Дан Блэкмор — ветеран, что явился ради спасения жены. Рядом его Арчер, Робин Гуд, скрывающий лицо капюшоном и ядовитую ухмылку. «Я не рыцарь, — говорит он. — Я бью из засады». Тисовый Лук выпускает стрелы с ядом, а Разлом размывает стены лабиринта, скрывая цель.',e:[['Робин Гуд (Арчер)','🏹','Archer',1.5,1.3],['Дан Блэкмор','🎖️','Lancer',1.1,1.1]],w:'Яд рассеялся, и Дан упал на колено: «Я служил чести… но не тем способом». Он выдохнул имя жены и растворился в свете, а Робин молча поклонился.'},
{t:'Алиса из Страны Кошмаров',s:'Арена превращается в детскую сказку: карточные солдаты, гигантские чайные чашки, зеркальные лабиринты. Алиса, девочка-призрак, держит за руку Кастера, Найтингейл, чей голос звучит как колыбельная. «Поиграйте с нами!» — щебечет девочка, но за игрой скрывается смертельная ловушка, а Разлом превращает игрушки в оружие. Смех девочки эхом отражается в зеркалах, и от него по спине бегут мурашки.',e:[['Найтингейл (Кастер)','🩺','Caster',1.5,1.3],['Карточный солдат','🃏','Lancer'],['Карточный солдат','🃏','Saber']],w:'Сказочные декорации осыпались. Алиса прижалась к Найтингейл и прошептала: «Спасибо, что играли со мной». Свет вокруг них стал мягким, и оба исчезли, оставив колыбельную.'},
{t:'Лю Бу Фэнсянь',s:'Четвёртый противник — Рани VIII, алхимик Атласа, безмолвная девочка с золотыми глазами. Её Берсеркер — Лю Бу Фэнсянь, тот, кто уничтожил три царства и предал двух господ. «Ууууо!» — ревёт он, и Алебарда Небесного Карателя рассекает арену. Разлом добавляет ему ярости, а вы понимаете: обычной силой его не остановить.',e:[['Лю Бу Фэнсянь (Берсеркер)','🐉','Berserker',2,1.5]],w:'Лю Бу пошатнулся, а Рани склонила голову: «Спасибо. Я поняла, что значит сердце». Алебарда воткнулась в пол, и силуэт полководца рассыпался золотыми искрами.'},
{t:'Убийца Юлиус',s:'В ночной части Арены вас ждёт Юлиус Белкиск Харвей, холодный мастер убийств, бывший «Тридцать пять». Его Ассасин, Ли Шувэнь, мастер восьми крайностей, движется так, что глаз едва успевает. «Молчание — лучший ответ», — говорит он. Разлом прячет удары в тенях, и каждый выпад — смертельная загадка.',e:[['Ли Шувэнь (Ассасин)','🥋','Archer',1.7,1.4],['Юлиус Харвей','🕶️','Lancer',1.2,1.2]],w:'Ли Шувэнь опустил руку, и тишина накрыла арену: «Достойно». Юлиус опустил глаза, шепнув: «Я так хотел быть кем-то ещё». Он исчез в тёмном свете.'},
{t:'Лорд Харвей и Гавейн',s:'Лео Харвей, юный лидер Харвеев, встречает вас в тронном зале. Его Сэйбер — Гавейн, Рыцарь Солнца, чья сила растёт с восходом. «Я — король, — говорит Лео. — Мой долг — побеждать». Экскалибур Галатин озаряет зал золотым огнём, а Разлом заставляет полдень длиться слишком долго.',e:[['Гавейн (Сэйбер)','🌞','Saber',1.8,1.5],['Лео Харвей','👑','Caster',1.2,1.2]],w:'Солнечный меч потух, и Лео опустился на трон: «Я был слишком уверен в своём величии». Гавейн склонил голову: «Пусть это будет уроком для юного короля».'},
{t:'Кольцо Страсти',s:'После основного турнира Лунная Сота меняется: BB, загадочная ИИ, захватывает контроль. Первой на пути стоит Пассионлип — гигантская девочка с когтями, символ страсти. «Не подходите, — умоляет она. — Иначе я разорву вас на куски!» Разлом путает её желания, и гигантские когти взметаются со всех сторон.',e:[['Пассионлип (Берсеркер)','💕','Berserker',1.8,1.4],['Тень BB','🎀','Caster',1]],w:'Когти замерли, и Пассионлип, всхлипнув, свернулась клубком: «Простите, я не хотела». BB со смехом наблюдала издалека, а в воздухе поплыл сладкий запах металла.'},
{t:'Мелтлилит и Кингпротея',s:'Следующая пара — Мелтлилит, лёгкая как мысль, и Кингпротея, чудовище, поглотившее собственную любовь. «Я хочу быть любимой!» — ревёт великанша, и её тело раскрывается как кошмарный цветок. Разлом усиливает её рост, а воздух наполняется ядовитой пыльцой. Жанна только шепчет молитву и поднимает знамя. Лепестки кружатся в воздухе, оседая на плечах горькой золотой пылью.',e:[['Мелтлилит','🦇','Lancer',1.6,1.3],['Кингпротея','🌺','Berserker',1.7,1.4]],w:'Цветок сложился, и Кингпротея прижала к груди руки: «Я… просто хотела быть рядом». BB зевнула и кивнула: «Хорошо, хорошо. Финал скоро».'},
{t:'Двайс Пис и Сэйвер',b:1,s:'Последний Мастер Лунной Соты — Двайс Х. Писман, бывший учёный, отдавший разум ради спасения людей. Его Сэйвер, Вайрочана, сияет золотым светом, как сама надежда. «Мир нельзя менять без жертв», — говорит он. Разлом сливается с Гримуаром Соты, и на вас обрушивается лавина мыслей и света.',e:[['Вайрочана (Сэйвер)','🪷','Caster',3.8,1.5],['Тень Соты','🌑','Archer',.7,.9]],w:'Свет Сэйвера погас, а Двайс тихо улыбнулся: «Я хотел спасти людей. Может, теперь и вы сможете». Сота содрогнулась, выпуская вас в реальный мир.'},

{t:'Горящий Фуюки',s:'Вы просыпаетесь в Чалдеа: белые залы, сияющие панели и тихий голос Роман Архаман. «Призыватель? Нам как раз не хватало такого!» — улыбается он. Рядом Мэш Кирилайт крепко держит щит. Рейсифт бросает вас в Фуюки 2004 года — город объят пламенем, а из дыма выходят Тени Ассасина и Райдера.',e:[['Тень Ассасина','🗡️','Archer',1.3,1.2],['Тень Медузы (Райдер)','🐍','Rider',1.3,1.2],['Тень-скелет','💀','Saber']],w:'Тени растаяли в дыму, и Мэш выдохнула, опуская щит: «Мы справились, сэмпай». Вдали, между догорающих домов, мелькнула знакомая тёмная фигура с посохом.'},
{t:'Красный Арчер и Тысяча Мечей',s:'На мосту вас поджидает Тень Арчера — Эмия, залитый чёрной грязью Грааля. Клинки лежат вокруг веером, а в глазах тлеет ярость. «Идеал — это иллюзия», — шепчет он, и Разлом заставляет реальность дрожать. Мэш выставляет щит, отражая первый залп, а Ку Хулин в облике Кастера прикрывает вас руной Ансуз.',e:[['Тень Эмии (Арчер)','🏹','Archer',1.6,1.4],['Отражение клинка','🗡️','Saber',.8,.9]],w:'Мечи погасли, и Тень рассыпалась. Мэш вздохнула: «Он выглядел так грустно, сэмпай». Ку Хулин ухмыльнулся: «Эй, вы двое, неплохо поработали. Идём к горе».'},
{t:'Геракл на мосту',s:'Тень Берсеркера стоит на мосту, заслоняя вам путь. Геракл, чьё сердце давно потеряно в чёрной грязи, ревёт как буря. Ку Хулин поднимает посох: «Держите его, я прикрою!» Разлом усиливает каждую из двенадцати жизней, превращая героя в стену ярости и тьмы, о которую бессильно бьются любые клинки.',e:[['Тень Геракла (Берсеркер)','🗿','Berserker',1.9,1.5],['Тень Разлома','🌑','Caster',.8,.9]],w:'Стальной ураган стих, и Тень Геракла рухнула. Ку Хулин сжал посох: «Ну, парень, ты крепче, чем я думал». Впереди возвышалась гора, увенчанная тёмным небом.'},
{t:'Ку Хулин против Разлома',s:'Ку Хулин, ваш проводник, внезапно замирает: Разлом ловит его волю на самом краю, и посох сияет тьмой. «Извините, ребята, — говорит он с усмешкой. — Бывает и такое». Рунические круги вспыхивают на земле, а Тени Грааля кружат над ним, шепча приказы. Мэш бросается вперёд, закрывая вас щитом.',e:[['Ку Хулин (Кастер)','🔥','Caster',1.6,1.4],['Руническая Тень','🔤','Archer']],w:'Красная искра в глазах Ку Хулина погасла: «Ох, простите. Голова кружится». Он потёр лоб, ухмыляясь: «Ну, давайте уже разберёмся с этим Граалем. Пора закончить».'},
{t:'Сэйбер Альтер: Страж Грааля',s:'В пещере под горой Энзо сидит Сэйбер Альтер, ослеплённая чёрной энергией. Она стережёт Грааль, и никто не смеет подойти. «Пройдёшь — умрёшь», — холодно говорит она, и Экскалибур Морган начинает накаляться. Ку Хулин прищуривается: «Вот она, главная стерва». Ваш круг призыва вспыхивает, а Жанна встаёт плечом к плечу с Мэш.',e:[['Сэйбер Альтер','🖤','Saber',2.1,1.5],['Тень Грааля','🌑','Caster',.8,.9]],w:'Экскалибур Морган погас. Сэйбер Альтер опустилась на колено: «Вы… те, кто сможет остановить это». Пещера дрогнула, а в небе вспыхнул золотой свет — рейсифт уже зовёт в новую эпоху.'},
{t:'Орлеан: Небо Драконов',s:'1431 год, Франция. Небо над Орлеаном рассекают виверны, а город лежит в руинах. Жанна замирает: «Я знаю эти улицы. Но я никогда не видела их такими». Мэш поднимает щит, а Роман шепчет в связи: «Это Сингулярность Первая. Ищите Грааль!» Драконьи всадники снижаются, и воздух наполняется рёвом и запахом гари.',e:[['Виверна','🐉','Rider',1.2,1.2],['Виверна','🐉','Rider',1.2,1.2],['Французский скелет','💀','Saber']],w:'Виверны рухнули в пепел. Мэш вытерла пот со лба: «Мы спасли обоз, сэмпай». Жанна смотрела на небо, где ещё кружили драконьи тени, и молчала.'},
{t:'Чёрная Жанна',s:'На развалинах моста стоит девушка в чёрных латах — точная копия Жанны, но с жёлтыми глазами и злой улыбкой. «Ты вернулась, — смеётся она. — Ну а я — твоя месть!» Жанна Альтер поднимает чёрное знамя, а за ней выстраиваются драконы и Тени Разлома. Жанна Святая сжимает кулаки: «Я пойму тебя, но не позволю тебе убивать».',e:[['Жанна Альтер (Авенджер)','🖤','Berserker',2,1.5],['Виверна','🐉','Rider',.9,1]],w:'Чёрное знамя дрогнуло, и Жанна Альтер, ухмыльнувшись, растворилась в огне: «Ещё увидимся, святая». Вы слышите, как над пепелищем ревёт что-то намного больше виверн.'},
{t:'Сигурд и Пепельный Дракон',s:'Из леса выходит Сэйбер Зигфрид в тёмных доспехах, с мечом Бальмунг. Его выбрали Слугой Жанны Альтер за силу и печаль. Он не говорит ни слова, лишь поднимает клинок, и Разлом вплетает в его руку драконью кровь. Мэш выставляет щит: «Он мощнее любого противника до этого!»',e:[['Зигфрид (Сэйбер)','🗡️','Saber',1.8,1.4],['Тень дракона','🐲','Berserker',1]],w:'Бальмунг вонзился в землю, и Зигфрид опустился на колено: «Я хотел лишь защитить. Простите». Драконья кровь остыла, а вдали засияла золотом ещё одна Тень.'},
{t:'Жиль де Рэ: Ложные Молитвы',s:'Жиль де Рэ, Кастер Жанны Альтер, восседает в замке Флеро и принимает вас как гостей: «Дева! Ты вернулась ко мне!» Он верит в собственную безумную молитву, и книга Прелата открывает врата кошмара. Морские демоны, осквернённые драконы и Тени Разлома выползают из книги, а Жанна тихо шепчет: «Прости меня, Жиль».',e:[['Жиль де Рэ (Кастер)','📖','Caster',1.7,1.4],['Морской демон','🐙','Berserker',1.1],['Морской демон','🐙','Berserker',1.1]],w:'Книга Прелата закрылась, и Жиль улыбнулся сквозь слёзы: «Теперь я могу уйти с миром, моя Дева». Его силуэт растаял, а Жанна опустила голову и долго молчала.'},
{t:'Жанна Альтер и Фафнир',b:1,s:'Жанна Альтер стоит на руинах Орлеана, держа Грааль. Она призывает Фафнира — драконьего Берсеркера, воплощение алчности. «Пусть Франция сгорит!» — выкрикивает она. Небо чернеет, драконы падают ливнем. Жанна Святая поднимает знамя: «Я не позволю ненависти победить. Я — Рулер, и я не отступлю!» Дым затягивает небо, и колокола Орлеана бьют набатом в такт каждому удару сердца.',e:[['Жанна Альтер','🖤','Berserker',3.5,1.5],['Фафнир','🐲','Berserker',.8,.9]],w:'Пламя погасло, и Жанна Альтер смеялась, растворяясь: «Хорошо. Ты сильнее, чем я думала». Грааль рассыпался, а в небе загорелся новый маяк. Следующая сингулярность — Рим.'},
]);

EXT_PART('fate',[
{t:'Септем: Рим без Императора',s:'Рейсифт бросает вас в 60 год до нашей эры, но Рим разделён надвое: Империя Нерона держит столицу, а Республика Цезаря — окрестности. «Странно, — шепчет Роман. — Здесь слишком много героев для одного времени». Легионеры-Тени и големы преграждают путь, а Жанна замечает над холмами золотой отблеск Грааля.',e:[['Римский легионер','🛡️','Saber'],['Римский легионер','🛡️','Lancer'],['Каменный голем','🗿','Berserker',1.2]],w:'Легионеры рухнули, а голем рассыпался в щебень. Мэш перевела дух: «Кажется, мы попали в самую гущу». Вдалеке зазвучали трубы — кто-то шёл вам навстречу.'},
{t:'Нерон Клавдий: Золотой Театр',s:'Молодая императрица Нерон Клавдий встречает вас в ярко-красном платье с мечом-огнём Аэстус Домус Аурея. «Умуу! Ты явился на мой пир!» — ликует она. Разлом разливает по залу золотое сияние: тени слуг выходят из колонн, аплодируя своей госпоже, а её меч заливает арену жаром. Зрительный зал гремит овациями, хотя вокруг нет ни одного живого человека.',e:[['Нерон Клавдий (Сэйбер)','🌹','Saber',1.6,1.3],['Тень-гладиатор','⚔️','Lancer']],w:'Меч Нерон погас, и она весело рассмеялась: «Ты мне нравишься! Хочу, чтобы ты остался в моём театре навсегда». Затем добавила уже тише: «Но Цезарь опаснее меня».'},
{t:'Спартак и Боудикка',s:'В лесу к северу от Рима вас встречают Берсеркер Спартак и Райдер Боудикка, королева иценов. Они сражаются за Республику и не знают, что Разлом внушил им ненависть к Империи. «Мы будем драться до последнего!» — рычит Боудикка, натягивая поводья боевой колесницы. Спартак поднимает гигантский меч.',e:[['Спартак (Берсеркер)','🛡️','Berserker',1.5,1.3],['Боудикка (Райдер)','🐎','Rider',1.5,1.3]],w:'Колесница замерла, и Боудикка опустила поводья: «Мы ослеплены. Но пусть твой путь будет справедливым». Спартак тихо кивнул, а Разлом над лесом вспыхнул и зашипел.'},
{t:'Змея Клеопатры',s:'На берегу Тибра вас встречает Клеопатра VII — Ассасин с ядовитой улыбкой и золотой змеёй на плече. Она переговорщик Цезаря, но и её Разлом не оставил в покое. «Египет не забывает ни обид, ни любви», — мурлычет она, и воздух наполняется смертельным ароматом лотоса. Река лениво поблёскивает, а вдалеке слышен плеск весла невидимой лодки.',e:[['Клеопатра (Ассасин)','🐍','Archer',1.6,1.3],['Тень-змея','🐍','Berserker',1]],w:'Змея свернулась и умерла на песке. Клеопатра вздохнула: «Если хочешь победить Цезаря, найди его меч». Она растворилась в аромате лотоса и печального смеха.'},
{t:'Цезарь: Красный Плащ Империи',s:'Гай Юлий Цезарь встречает вас в дворце Республики, красный плащ и золотая цепь на плечах. «Пришёл, Призыватель? Отлично, мне не хватало собеседников». Он поднимает руку, и Легионы Тени выстраиваются, как в былые времена. Магия Разлома рождает вокруг него огненные колонны. Мрамор под ногами трескается, и алый плащ развевается на несуществующем ветру.',e:[['Гай Юлий Цезарь','🏛️','Saber',2,1.5],['Тень-легионер','🛡️','Lancer',.8,1],['Тень-легионер','🛡️','Lancer',.8,1]],w:'Цезарь склонил голову: «Я ждал этой встречи, Призыватель». Красный плащ упал на пол. За его спиной клубилась тьма: Грааль в сердце Рима ждал вас впереди.'},
{t:'Ромул-Квирин',s:'Из сердца Рима поднимается Ромул, Квирин, основатель города, Лансер-бог. Он держит копьё, а за ним марширует легион призраков. «Римское — это будущее!» — гремит его голос. Разлом усиливает его мощь: плащ на плечах сияет золотом, а каждый шаг сотрясает землю. Мостовая гудит от шагов невидимого легиона, а над холмами вспыхивают костры.',e:[['Ромул-Квирин (Лансер)','⚔️','Lancer',2,1.5],['Призрак легиона','👻','Saber',.8,.9]],w:'Копьё пало, и Ромул поклонился: «Пусть Рим будет вечен, Призыватель». Призрачные воины растворились, а по колоннам пробежал золотистый отблеск. Над Римом прокатился тихий гул, будто сам город вздохнул.'},
{t:'Единый Рим',s:'В зале перед Граалем вас ждёт Нерон и Цезарь, бок о бок. «Мы едины, — объявляет император. — Против тебя!» Их Реликвии сцепились в золотую сеть. Разлом вливает в них новую энергию, а стены зала покрываются трещинами света. Мэш поднимает щит: «Держитесь, сэмпай!» Колонны зала дрожат, и золотые нити тянутся к потолку, словно струны гигантской арфы.',e:[['Нерон Клавдий (Сэйбер)','🌹','Saber',1.5,1.3],['Цезарь (Сэйбер)','🏛️','Saber',1.5,1.3],['Тень Грааля','🌑','Caster',.8,.9]],w:'Сеть порвалась, и Нерон опустила меч: «Прекрасная битва!» Цезарь тихо усмехнулся: «Я доволен». Грааль дрогнул, готовясь рассыпаться. Золотые нити в воздухе растаяли, и зал наполнился тишиной.'},
{t:'Грааль Рима',s:'Над Колизеем нависает Грааль, а в его золотых лучах вы видите фигуру Империи — гигантского Голема Римской Мощи. Он поднимает кулак, и мостовая крошится. «Будущее — это Рим!» — гудит он. Разлом впутывает его в свою ткань, и мрамор оживает, превращаясь в ревущую армию. Над ареной кружит золотая пыль, а воздух пахнет камнем, кровью и древней славой.',e:[['Римский Голем','🗿','Berserker',2,1.5],['Тень Рима','🌑','Saber',.8,.9]],w:'Голем рухнул, и мрамор превратился в гальку. Грааль тихо зазвенел, отзываясь на ваш зов. Мэш протянула руку: «Это последний шаг, сэмпай».'},
{t:'Римская Заря',s:'Грааль стабилизируется, и над Римом восходит солнце. Нерон и Цезарь стоят рядом, улыбаясь. «Спасибо, что помогли нам понять друг друга», — говорит императрица. Но небо над горизонтом раскалывается: Разлом ищет новую дорогу, и оттуда, шипя, выползают Тени. Ветер доносит запах лавра и дыма, и по улицам катится звон далёких труб.',e:[['Тень Цезаря','🏛️','Saber',1.2,1.2],['Тень Нерона','🌹','Saber',1.2,1.2],['Тень слуги','👤','Archer']],w:'Тени рассыпались, а Нерон помахала вам рукой: «Не забывайте нас, Призыватель!» Рим исчез, и вы падаете сквозь свет — в открытое море.'},
{t:'Хрустальный Дракон Рима',b:1,s:'Перед возвращением из Рима Разлом выплёвывает последнего стража — Дракона Тени, чья чешуя блестит как лёд. Он охраняет остатки Грааля и не пропускает никого. «Уходи, — рычит он. — Иначе сгоришь». Ваш круг призыва вспыхивает в ответ, а Жанна поднимает знамя. Чешуя дракона звенит как хрусталь, а от каждого взмаха крыльев гаснут факелы.',e:[['Дракон Разлома','🐉','Rider',4,1.5],['Тень Грааля','🌑','Caster',.7,.9]],w:'Дракон издал последний рёв и растворился в хрустальной пыли. Рим затих. Мэш улыбнулась: «Сингулярность закрыта. Теперь — в море, сэмпай».'},

{t:'Окэанос: Море без Берегов',s:'Рейсифт бросает вас на палубу Золотой Лани, и вокруг — бескрайний океан без земли. Капитан Френсис Дрейк хохочет: «Добро пожаловать на борт, юнцы!» Но пираты Тени и проклятые галеоны уже окружают вас, а Разлом закручивает волны в воронки. Солёный ветер бьёт в лицо, а мачты скрипят так, будто корабль вот-вот развалится.',e:[['Тень-пират','🏴‍☠️','Rider'],['Тень-пират','🏴‍☠️','Archer'],['Проклятый галеон','⛵','Berserker',1.3]],w:'Пираты канули в бездну, а Дрейк расхохоталась: «Ну вот, теперь вы настоящие моряки!» Мэш кивнула, пряча улыбку, а на горизонте показался красный парус.'},
{t:'Гектор Троянский',s:'Красные паруса поднимаются над горизонтом: Гектор, троянский герой, ведёт Аргонавтов и не знает, что Разлом искажает его волю. «Троя ещё жива!» — кричит он, обнажая копьё Дурандаль. Волны вздымаются, корабль дрожит, а вы слышите смех Разлома, что пляшет над морем. На горизонте гремит гроза, и вода у бортов кипит алой пеной.',e:[['Гектор (Лансер)','🔱','Lancer',1.7,1.4],['Тень-аргонавт','⚓','Saber']],w:'Копьё Гектора рухнуло в воду. Он тяжело вздохнул: «Прости. Троя больше не вернётся». Волна сомкнулась над ним, а вдали заблестел зелёный остров.'},
{t:'Артемида и Орион',s:'На острове вас встречает странная парочка: медвежонок Орион и Артемида в облике девушки-лучницы. «Ой, мы тебя ждали, юный Призыватель!» — мурлычет она, но стрелы её лука падают дождём. Разлом путает её любовь и ревность, и небо над островом превращается в поле смертельных звёзд. Луна поднимается над островом, и её холодный свет режет глаза острее любых стрел.',e:[['Артемида (Арчер)','🌙','Archer',1.6,1.4],['Тень-звезда','⭐','Archer',.9]],w:'Стрелы упали в воду, и Артемида нахмурилась: «Ну вот, ты выиграл. Только не думай, что я тебя полюбила!» Орион хихикнул, помахав лапкой.'},
{t:'Медея Лили и Аргонавты',s:'Юная Медея Лили выходит вперёд, прижимая руки к груди: «Мастер Джейсон ждёт вас!» Она зовёт Кастер-магию, а из пещеры выползают Тени Аргонавтов. Разлом перепутал их воспоминания, и воины машут мечами, не помня, зачем. Лили плачет, но не отступает. Пещера гудит эхом старых песен, а на стенах мерцают руны, зовущие в бездну.',e:[['Медея Лили (Кастер)','🔮','Caster',1.5,1.3],['Тень-аргонавт','⚓','Saber'],['Тень-аргонавт','⚓','Lancer']],w:'Тени Аргонавтов рассыпались, а Медея Лили вытерла слёзы: «Простите, что вовлекла вас». Она улыбнулась и сжала руку Дрейк: «Идите. Джейсон ждёт».'},
{t:'Геракл Бесстрашный',s:'Геракл, ослеплённый Разломом, поднимается из морской бездны. За его спиной вздымаются двенадцать чудовищ — воплощения подвигов. Френсис Дрейк выкрикивает: «Не дай ему добраться до палубы!» Пушки Золотой Лани гремят, а Жанна бросается в схватку с знаменем в руках. Пена бьёт через борт, а пушки Золотой Лани заходятся яростным лаем.',e:[['Геракл (Берсеркер)','🗿','Berserker',2,1.5],['Морское чудовище','🐙','Berserker',.8,.9]],w:'Геракл рухнул на дно, окутанный пеной. Дрейк кивнула: «Вот это шторм!» Тем временем на горизонте всплыл гигантский корабль Аргонавтов. Пена медленно оседала, а пушки Дрейк дымились в тишине.'},
{t:'Эвриала и Астерий',s:'Из тумана выходят Эвриала и Астерий: богиня-охотница и юный Минотавр. Они пираты Дрейк, но Разлом смутил их чувства. «Не трогай его!» — кричит Эвриала, и её стрелы поют. Астерий сжимает кулаки и ревёт, а вы понимаете: это не враги, а лишь дети, которых обманули. Солнце уходит за горизонт, и ветер приносит запах соли и далёких, забытых лабиринтов.',e:[['Эвриала (Арчер)','🎯','Archer',1.5,1.3],['Астерий (Берсеркер)','🐂','Berserker',1.5,1.3]],w:'Эвриала опустила лук: «Мы не хотели вас ранить». Астерий улыбнулся сквозь слёзы, а вы услышали, как вдалеке заскрипел гигантский корабль Аргонавтов.'},
{t:'Аргосский Корабль',s:'Аргонавты выходят на бой на борту Арго — огромного корабля героев. На носу стоит Джейсон, Сэйбер-предводитель, со сверкающим Золотым Руном. «Время искать сокровище!» — смеётся он, но Разлом вложил в его руку тьму. Команда героев дерётся неистово, и палуба скрипит. Паруса хлопают, как крылья огромной птицы, а вёсла ударяют по воде в едином ритме.',e:[['Джейсон (Сэйбер)','⚓','Saber',1.7,1.4],['Тень-аргонавт','🏴‍☠️','Archer'],['Тень-аргонавт','🏴‍☠️','Lancer']],w:'Джейсон упал на колено, выпуская Руно: «Я хотел быть героем. Спасибо за напоминание». Арго накренился, а из глубин потянуло чем-то очень большим.'},
{t:'Эдвард Тич: Чёрная Борода',s:'На горизонте поднимается фрегат «Месть Королевы Анны» с чёрным флагом. Эдвард Тич, знаменитый пират, готов к бою. «Йо-хо-хо! Кто посмел войти в мои воды?» — хохочет он. Разлом даёт ему свежую ярость, и пушки гремят непрерывно. Дым от пушек стелется над водой, а над мачтами кричат чайки, не знающие страха.',e:[['Эдвард Тич (Райдер)','🏴‍☠️','Rider',1.8,1.4],['Пиратская Тень','☠️','Archer',.9,1]],w:'Флаг Тича упал, и он расхохотался: «Ну и наделали вы шуму!» Дрейк подмигнула: «Вот и всё, Эдвард». Из моря поднялся рёв — вставал последний страж.'},
{t:'Мираж Атлантиды',s:'Море внезапно светлеет, и из глубин поднимаются колонны затонувшей Атлантиды. Дрейк бледнеет: «Здесь я когда-то победила бога». Разлом воскрешает стражей города, и перламутровые тени выходят из воды, чеканя шаг. Их трезубцы звенят, как колокола, а волны складываются в лица забытых жрецов, шепчущих древние проклятия. Свет пробивается сквозь толщу воды, рисуя на стенах города дрожащие золотые узоры.',e:[['Страж Атлантиды','🔱','Lancer',1.4,1.3],['Тень-жрец','🌊','Caster',1.2,1.2],['Тень слуги','👤','Rider']],w:'Колонны Атлантиды снова ушли под воду. Дрейк выдохнула: «Он ждёт нас глубже, юнцы». Море загудело, будто огромный зверь проснулся и готовится показать зубы.'},
{t:'Грааль Посейдона',b:1,s:'Из глубин поднимается Грааль Посейдона, окутанный водоворотом. Небо чернеет, волны вздымаются до облаков. Разлом сливается с богом моря и превращает воды в армию чудищ. Дрейк вскидывает пистолет: «Ну что, капитан-призыватель, прикончим шторм?» Вы поднимаете руку, и круг призыва вспыхивает. Молнии рвут небо пополам, а грохот волн заглушает любые слова и мысли.',e:[['Тень Посейдона','🔱','Lancer',4,1.5],['Морская Гидра','🐍','Berserker',.7,.9]],w:'Шторм стих, и Грааль раскололся. Дрейк отсалютовала вам: «Отличная работа, Призыватель!» Море успокоилось, а впереди сгущался серый туман Лондона. Тучи расходились, и в разрывах впервые показались звёзды.'},

{t:'Лондон: Туман Смерти',s:'Викторианский Лондон окутан ядовитым туманом, люди лежат на улицах, а автоматоны, «убийцы магов», бродят по мостовым. Роман предупреждает: «Не дышите этим воздухом без масок». Ваши шаги гулко отдаются в темноте, а Тени Разлома скользят по стенам, как чернила. Фонари едва пробиваются сквозь туман, а в переулках слышны чьи-то торопливые шаги.',e:[['Автоматон','🤖','Lancer'],['Убийца-гомункул','🧪','Archer'],['Тень-гуль','🧟','Berserker']],w:'Автоматоны рассыпались. Из тумана выступил рыжеволосый юноша в красной броне: «Вы, что ли, из Чалдеа? Я — Мордред. Идём к доктору Джекиллу!»'},
{t:'Джек-Потрошитель',s:'В переулках Уайтчепела вас настигает Джек-Потрошитель — детские голоса, мстительные души неродившихся. «Мама… мама…» — шепчут они, и ножи вспыхивают из ниоткуда. Разлом превращает туман в оружие, и каждый вдох становится пыткой, а Жанна крепко прижимает знамя к груди. Сырой воздух пахнет железом и дымом, а в окнах мелькают бледные детские лица.',e:[['Джек-Потрошитель (Ассасин)','🔪','Archer',1.6,1.4],['Туманный призрак','👻','Caster',1]],w:'Голоса стихли, и Джек рассыпался в тумане: «Спасибо, что выслушали». Мордред тихо шепнула: «Ненавижу эту войну». Впереди показался силуэт мрачного замка.'},
{t:'Хелтер-Скелтер',s:'Джекилл ведёт вас через бедные кварталы, но впереди — Хелтер-Скелтер, паровые механизмы, управляемые тенью. Мордред хмурится: «Эти железяки — не Слуги, но злее». Металлические монстры гремят по улицам, а Разлом заставляет пар вспыхивать огненными столбами. Из труб бьёт кипящий пар, а шестерни ревут, перемалывая мостовую в пыль.',e:[['Паровой Голем','⚙️','Berserker',1.5,1.3],['Паровой Голем','⚙️','Berserker',1.5,1.3],['Убийца-гомункул','🧪','Lancer']],w:'Машины замерли, из пара вышел слегка запыхавшийся Джекилл: «Спасибо за помощь. Осталось найти тех, кто стоит за этим туманом». Пар медленно рассеялся, и улицы Лондона стали тише.'},
{t:'Парацельс и Мамуин',s:'Парацельс, алхимик-Кастер, встречает вас в подвале старой лаборатории. «Я хочу возродить Британию!» — восклицает он. Рядом — Мамуин, главный автоматон. Разлом переплавил их волю, и алхимические колбы взрываются одна за другой, заливая подвал зелёным огнём. Стеклянные трубки звенят, и по полу растекаются зелёные лужи, шипящие как змеи.',e:[['Парацельс (Кастер)','⚗️','Caster',1.6,1.4],['Мамуин','🤖','Lancer',1.2,1.2]],w:'Колбы разбились, и Парацельс осел на пол: «Я ошибся… но я не жалею». Его тело растаяло, оставив лишь горстку пепла и тонкий запах серы.'},
{t:'Мордред против Разлома',s:'Мордред неожиданно замирает: Разлом нащупывает её слабое место — жажду быть признанной отцом. Красная молния хлещет вокруг. «Не смей… — рычит она, — не смей играть моими чувствами!» Клараунт дрожит в её руках, а Тени тянутся к ней, как к магниту. Красная молния бьёт по стенам, и в её вспышках вы видите одинокую девочку у трона.',e:[['Тень Мордред','🩸','Saber',2,1.5],['Тень Разлома','🌑','Archer',.8,.9]],w:'Тень рассыпалась, и Мордред упала на колени: «Не позволяйте мне стать этим». Джекилл положил ей руку на плечо: «Мы рядом. Держись».'},
{t:'Франкенштейн и Ганс Андерсен',s:'В библиотеке вас встречает Ганс Христиан Андерсен, ворчун-писатель: «Опять вы! Я просил не шуметь!» Франкенштейн грозно молчит рядом. Разлом хочет использовать их как приманку, и книги оживают, превращаясь в злобных бумажных чудищ, кусающих за руки. Страницы шелестят, словно тысячи крыльев, а чернила капают с потолка чёрным дождём.',e:[['Книжный монстр','📚','Caster',1.3,1.2],['Книжный монстр','📚','Caster',1.3,1.2],['Тень-автомат','🤖','Lancer']],w:'Книги упали, и Андерсен ворчливо проговорил: «Ну наконец-то тихо». Франкенштейн неловко кивнула, а из тумана донёсся электрический гул. Чернила высохли на полу, оставив лишь тонкие серые следы.'},
{t:'Никола Тесла',s:'Никола Тесла, «Электрический Король», стоит на башне, окутанный молниями. «Я — светоч человечества!» — восклицает он. Разлом усиливает его энергию, и молнии рвутся из всех проводов города. Мордред стискивает зубы: «Он мощнее, чем я думала!» Жанна поднимает знамя. Электрический гул сводит зубы, а по улицам змеятся синие огни, зажигая витрины.',e:[['Никола Тесла (Арчер)','⚡','Archer',2,1.5],['Электрический автоматон','🤖','Lancer',.8,1]],w:'Молния погасла, и Тесла вздохнул: «Мой свет был слишком ярок». Мэш оглянулась: «Сэмпай, мы победили?» Туман редел, но за ним открывался мрачный силуэт башни.'},
{t:'Прелати: Книга Кошмара',s:'В сердце Лондона стоит Башня Часов — логово Франсуа Прелати, друга Жиля де Рэ, чья книга умеет призывать чудовищ. «Смерть — лишь дверь», — шепчет он. Разлом сплетает его книгу с туманом, и стены Башни оживают, наполняясь щупальцами. Книга шепчет на забытых языках, и от этого шёпота гаснут лампы в окнах.',e:[['Прелати (Кастер)','📖','Caster',1.8,1.4],['Морской демон','🐙','Berserker',1],['Морской демон','🐙','Berserker',1]],w:'Книга Прелати сгорела, и он упал на колени: «Всё… впустую». Его голос стих, а над Лондоном вдруг стал виден чистый кусочек неба.'},
{t:'Гранд Кастер',s:'Сквозь остатки тумана вы видите высокого человека в золотом плаще. Он смотрит на вас из далёкого времени: Соломон, Король Магов. «Я — Гранд Кастер, — говорит он спокойно. — Человечество сгорит». Разлом вспыхивает вокруг него, как корона. Голос звучит спокойно и глубоко, будто говорит сама вечность, а не человек.',e:[['Тень Соломона','👁️','Caster',2,1.5],['Сфера Разлома','🌑','Caster',.9]],w:'Тень Соломона исчезла, оставив лишь эхо: «До встречи в Храме Времени». Мэш прошептала: «Это был он, сэмпай?» Роман тихо выдохнул: «Держитесь. Всё только начинается».'},
{t:'Лондонский Грааль',b:1,s:'Разлом сплетает Грааль Лондона с Тенью Теслы: над городом возникает гигантский электрический паук. «Я освещу мир!» — гремит голос. Мордред вскидывает меч: «Я не позволю тебе, отец!» Жанна поднимает знамя, и круг призыва сияет, отвечая ударам молний. Небо над Лондоном трещит, а по крышам ползёт металлический гул, от которого дрожит земля.',e:[['Электрический Паук','🕷️','Archer',4,1.5],['Тень Грааля','🌑','Caster',.7,.9]],w:'Паук рассыпался искрами, и туман окончательно растаял. Мордред улыбнулась: «Я вернусь, Призыватель». Лондон затих, а рейсифт снова зовёт вас — на этот раз в Америку.'},
]);

EXT_PART('fate',[
{t:'Америка: Война Двух Королей',s:'1783 год: Северная Америка расколота надвое. Восток держат Кельты под властью королевы Медб, запад — Американская армия президента-короля Эдисона. Роман бормочет: «Тут кто-то вставил Грааль в самую сердцевину истории». Рейсифт выбрасывает вас посреди прерии, и Тени Разлома уже мчатся по выжженной траве. Над горизонтом поднимается дым двух армий, и стук копыт слышен даже сквозь ветер.',e:[['Кельтский воин','🛡️','Saber'],['Тень-гончая','🐺','Berserker'],['Тень слуги','👤','Archer']],w:'Тени рассыпались среди пожухлой травы. Мэш вгляделась в горизонт: «Сэмпай, впереди дым от двух армий». Жанна кивнула: «Идём, пока обе стороны не растоптали всё, что осталось».'},
{t:'Сопротивление: Джеронимо',s:'В каньоне вас встречает Джеронимо, вождь апачей, и его отряд сопротивления. Он недоверчиво смотрит на пришельцев: «Ни Кельты, ни Эдисон не защищают землю. Докажите, что вы не с ними». Внезапно из-за скал выезжают Львиные Стражи Эдисона — стальные механизмы, от которых дрожит земля. Раскалённые скалы звенят от жары, а вдали крутится песчаный вихрь.',e:[['Стальной лев','🦁','Berserker',1.3,1.2],['Стальной лев','🦁','Berserker',1.3,1.2],['Тень слуги','👤','Lancer']],w:'Механические львы рухнули грудой металла. Джеронимо кивнул: «Хорошо. Вы бьётесь честно». Он повёл вас вглубь каньона, к лагерю, где пылали костры и ждали раненые.'},
{t:'Эдисон: Президент-Лев',s:'В столице Американской армии, огромном сияющем городе, вас встречает Томас Эдисон — Кастер с львиной головой и голосом трибуна. «Мы — величайшая нация! Присоединитесь или падёте!» Его электрические Стальные Львы идут строем, а Разлом заставляет реакторы гореть красным светом. Пыль оседает на мундирах, а знамёна с орлами хлопают на ветру.',e:[['Томас Эдисон (Кастер)','🦁','Caster',1.8,1.4],['Стальной лев','⚙️','Berserker',1],['Стальной лев','⚙️','Berserker',1]],w:'Эдисон отшатнулся, и грива потухла: «Невозможно! Я — Американская мечта!» Он растворился в электрических искрах, а город затих, словно кто-то выключил гигантский рубильник.'},
{t:'Арджуна и Карна',s:'Воин в белых одеждах шагает по равнине: Арджуна, Арчер, желающий сразиться с Карной. Рядом Медб хохочет, подпитывая Разломом обоих героев. «Мы встретимся на поле, что достойно нас!» — говорит Арджуна. Лучи солнца и стрелы небес сталкиваются над головами, обжигая землю. Стрелы небесного огня падают дождём, оставляя в земле пылающие воронки.',e:[['Арджуна (Арчер)','🏹','Archer',1.9,1.5],['Карна (Лансер)','☀️','Lancer',1.8,1.4]],w:'Небо потемнело и снова прояснилось. Арджуна кивнул: «Хорошая битва». Карна тоже склонил голову. Медб, раздосадованная, яростно топнула, а Разлом над её головой завихрился ещё жаднее.'},
{t:'Медб и Волк-Король',s:'Королева Медб на троне из костей и золота получила Грааль и жаждет мужа-короля, что подчинил бы даже небо. Рядом воет Ку Хулин Альтер, Волк-Король Кельтов, чьё сердце залито проклятием. «Все вы будете моими!» — хохочет Медб. Разлом обвивает трон щупальцами, а Жанна поднимает знамя: «Довольно, королева. Твоя война закончена». Жаркий ветер шепчет над руинами, и на границе дюн вспыхивают факелы стражей.',e:[['Медб (Райдер)','👸','Rider',2.1,1.5],['Ку Хулин Альтер (Берсеркер)','🐺','Berserker',1.5,1.4]],w:'Трон рассыпался, Медб упала на колени: «Я хотела лишь любви…» Грааль Америки распался золотой пылью, а Ку Хулин Альтер прошептал: «Спасибо». Мэш выдохнула: «Мы справились, сэмпай», — но в небе уже вспыхнули золотые стены Камелота.'},
{t:'Камелот: Иерусалим Святого Круга',s:'1273 год, Иерусалим. Пустыня раскалена, а вдали на холме возвышается Святой Город — золотой Камелот. «Гмм, — задумывается Роман. — Здесь правит Лев». Из песков выходят Ассасины Горного Старца, и Тени Разлома роятся между дюн, смешиваясь с песчаными бурями и не давая разглядеть врага. Ветер швыряет в лицо песок, а над золотым городом поднимается странный тихий свет.',e:[['Ассасин-хассан','🗡️','Archer'],['Ассасин-хассан','🗡️','Archer'],['Песчаная Тень','🏜️','Berserker',1.2]],w:'Ассасины пали, песчаный вихрь улёгся. Из-за дюны выглянул лёгкий силуэт: «Вы… не из рыцарей?» Так вы впервые встретили Хассана Безмолвного, тихого проводника по дорогам Иерусалима.'},
{t:'Безмолвный Хассан',s:'В пещере Горного Старца вас встречает Хассан-и Сабба, Безмолвный, сражающийся за освобождение земель от Льва. «Я лишь тень, — шепчет он. — Но и тень может резать». Рядом Ассасины Хассана готовятся к бою, и Разлом вплетает в клинки шёпот песчаных духов. Мэш прижимает щит покрепче. Скалы отбрасывают резкие тени, и каждый шорох в них может оказаться клинком.',e:[['Хассан Безмолвный','🗡️','Archer',1.5,1.3],['Хассан-ассасин','👤','Archer',1.1],['Хассан-ассасин','👤','Archer',1.1]],w:'Хассан склонил голову: «Простите, я проверял вас». Он развернул карту Иерусалима: «Идёмте, у нас есть план». Вокруг тихо зашуршали плащи ассасинов, словно ветер в пустыне.'},
{t:'Озимандия: Король Королей',s:'Из пустыни встаёт Озимандия — Рамсес II, Райдер, могучий фараон с хохотом, что сотрясает пески. «Ха-ха! Я — Король Королей! Хотите служить мне?» Рядом с ним Нефертари, его жена и щит. Разлом раскрашивает пирамиды в багровый цвет, а Солнечный Корабль встаёт над дюнами. Солнце над пирамидами становится белым и жгучим, а песок под ногами плавится.',e:[['Озимандия (Райдер)','☀️','Rider',1.9,1.5],['Нефертари','🌹','Caster',1.2,1.1]],w:'Озимандия захохотал: «Славно! Вы мне по нраву». Он взмахнул рукой, и гигантский корабль растаял. «Присоединяйтесь ко мне, когда придёт время выбирать сторону!»'},
{t:'Гавейн: Рыцарь Солнца',s:'Шпили Камелота сияют, а перед вами выходит Гавейн, рыцарь Солнца, чья сила удваивается в полдень. Ожерелье Льва усилило его втрое. «Я — воля короля!» — гремит он. Небо раскаляется добела, а Галатин, меч-солнце, вспыхивает, ослепляя. Мэш поднимает щит: «Держитесь, это самый трудный бой!» Тени на камнях укорачиваются, будто само время сжимается перед его мечом.',e:[['Гавейн (Сэйбер)','🌞','Saber',2,1.5]],w:'Свет Галатина угас, и Гавейн, тяжело дыша, опустил меч: «Ваша стойкость… достойна восхищения». Он отступил на шаг и растаял в золотистом свете, словно исчезающий полдень.'},
{t:'Артурия Лансер: Король Льва',b:1,s:'На троне из света сидит Артурия Лансер, Король Льва, — Артурия, ставшая Богиней Копья. «Я создам мир без страданий, — говорит она. — Даже если ради этого придётся сжать человечество в вечность». Ронгоминиад в её руках дрожит светом. Жанна поднимает знамя: «Я понимаю тебя, но не позволю!» Золотые шпили Камелота гаснут один за другим, и над городом повисает торжественная тишина.',e:[['Артурия Лансер (Король Льва)','🦁','Lancer',4,1.5],['Рыцарь Круга','🛡️','Saber',.6,.9]],w:'Копьё света погасло, и Король Львов опустила голову: «Возможно, вы правы». Грааль Камелота рассыпался в золотые искры. Сквозь Врата вы видите вавилонские зиккураты — время идти в Урук.'},
{t:'Вавилония: Урук перед Бурей',s:'2655 год до н. э. Шумер расцветает, но вдали клубится тьма: Разлом слился с Гоа, Богиней Гнили, и на горизонте встают полчища Демонических Зверей. Роман шепчет: «Урук — последний оплот». Тени Ламии, Гуго и Драконов шагают по пустыне, а над башнями воет тревожный горн. Горны Урука гудят над стенами, а на площадях женщины и дети прячутся в храмах.',e:[['Демонический зверь','👹','Berserker'],['Демонический зверь','👹','Berserker'],['Тень Ламии','🦂','Lancer']],w:'Звери пали, и над Уруком загремели победные горны. Вас встретила девушка в лазурном плаще: «Я Иштар! Я вас ждала!» Так вы вошли в ворота величайшего города мира.'},
{t:'Иштар: Богиня Венеры',s:'На улицах Урука вас встречает Иштар — Богиня Венеры, Райдер, сияющая высокомерием. «Фу, вы кто такие?» — тянет она. Но когда Тень Разлома ворвалась в город, она встала на защиту: «Мой Урук никому не отдам!» Небесные лучи Золотого Венера пронзают воздух, а в облаках гудит гнев. Воздух звенит от жары, и над пустыней дрожат миражи, полные звёзд.',e:[['Иштар (Арчер)','⭐','Archer',1.6,1.4],['Тень Разлома','🌑','Lancer',1]],w:'Иштар опустила лук и надулась: «Ладно, ладно, вы ничего. Идите к Гильгамешу, он вас ждёт». Она гордо отвернулась, но уголки губ дрогнули — по-настоящему довольная.'},
{t:'Гильгамеш: Царь Урука',s:'В тронном зале Урука восседает Гильгамеш — юный царь, «Кид-Гиль», Кастер, а в бою — Арчер. «Ха! Призыватель! Ты будешь служить моему городу». Врата Вавилона распахиваются, но тени Разлома стоят вокруг трона. «Докажи, что достоин моего доверия», — усмехается он, сжимая ключ Ворот. Ступени зиккурата раскалены солнцем, а стражи в бронзовых шлемах не смеют поднять глаз.',e:[['Гильгамеш (Арчер)','👑','Archer',2,1.4],['Тень Гильгамеша','👤','Archer',.9,1]],w:'Гильгамеш хмыкнул и опустил руку: «Хорошо. Ты не бесполезен». Врата закрылись. Царь наконец кивнул: «Отправляйтесь в Ниппур. Там Эрешкигаль ждёт помощи».'},
{t:'Эрешкигаль: Богиня Нижнего Мира',s:'Вы спускаетесь в Кур, подземное царство мёртвых. Эрешкигаль, хозяйка Нижнего Мира, встречает вас с натянутой улыбкой: «Не смейте смеяться над моим царством!» Тени умерших воют, а Разлом искажает их лица. «Я не хочу ни с кем драться, но вы мои гости», — шепчет богиня, поднимая посох. Холод подземелья пробирает до костей, а стены шепчут забытые имена.',e:[['Эрешкигаль (Ассасин)','🌑','Archer',1.7,1.4],['Тень мертвеца','👻','Berserker'],['Тень мертвеца','👻','Lancer']],w:'Эрешкигаль опустила посох и покраснела: «Ну, ладно… Вы неплохо справились». Она отвела взгляд: «Возьмите этот дар Нижнего Мира. И берегитесь Гоа».'},
{t:'Кингу: Небесная Цепь',s:'Кингу, муж Тиамат и воплощение Разлома, встаёт на пути в Ниппур. «Вы не пройдёте, — гулко произносит он. — Я — Небесная Цепь!» Из его рук вырываются цепи, разрывающие землю. Его тело сплетено из тени и глины, а глаза горят золотом. Мэш раскрывает щит: «Держитесь, сэмпай!» Земля трескается, и над руинами взвиваются цепи, звенящие как далёкий колокол.',e:[['Кингу (Райдер)','⛓️','Rider',2,1.5],['Тень Разлома','🌑','Berserker',.9]],w:'Кингу рассыпался в глиняную пыль. Земля дрогнула, а в небе над Уруком вспыхнули алые молнии. Гильгамеш ударил по столу: «Богиня Гоа идёт. Готовьтесь!»'},
{t:'Тиамат: Первая Мать',s:'Богиня Гоа рушится, но из её тела встаёт Тиамат — Первая Мать, воплощение Моря Жизни. Небо и земля дрожат, а Разлом впитывает её мощь. «Дети мои… идите ко мне», — шепчет она. Драконы, чудовища и тени вырываются из её волн. Гильгамеш кричит с башни Урука: «Держите её, пока я не смогу ударить!» Небо на юге чернеет, и ветер несёт запах гнили и пепла.',e:[['Тиамат (Первая Мать)','🌊','Berserker',2.2,1.5],['Гоа (Горгона)','🐍','Rider',1.2,1.2]],w:'Волны Тиамат схлынули, оставив лишь тишину. Гильгамеш вздохнул: «Спасибо, что дали мне шанс». Над Уруком взошло солнце, а рядом мерцала последняя дверь — за ней ждал Храм Времён.'},
{t:'Храм Времён: Фларос и Форнеус',s:'Вы стоите у белых ступеней Храма Времён — последней сингулярности. Воздух звенит, как натянутая струна. Первыми вас встречают Демоны-Столпы: Фларос, чей огонь плавит камень, и Форнеус, поднимающий шторм прямо в зале. «Человеческий порядок будет стёрт!» — гремят они. Нерон, Цезарь и Дрейк из прошлого приходят на помощь. Глиняные волосы Энкиду шевелятся на ветру, а во взгляде светится древняя нежность.',e:[['Фларос (Столп)','🔥','Caster',1.6,1.4],['Форнеус (Столп)','🌊','Rider',1.6,1.4],['Тень Слуги','👤','Saber',.8,.9]],w:'Столпы обратились в пепел и пену. Нерон поклонилась: «Вот теперь я довольна!» Дрейк вскинула пистолет: «Отличный выстрел, капитан!» Створки следующего зала приоткрылись сами.'},
{t:'Барбатос и Гальфас',s:'В следующем зале туман смешивается с электрическими разрядами: Барбатос, Столп Лондона, и Гальфас, Столп Америки, встали спиной к спине. «Вы — лишь мелкие искры!» — смеётся Барбатос. Мордред, Билли Кид и Найтингейл врываются в бой, а Разлом сжимает туман в иглы, жалящие лицо. Андерсен ворчит: «Финал близок, не расслабляйтесь». Море жизни вздымается над пустыней, отражая в волнах лица всех, кто когда-либо жил.',e:[['Барбатос (Столп)','🌫️','Archer',1.7,1.4],['Гальфас (Столп)','🦅','Archer',1.7,1.4],['Железная птица','🤖','Lancer',.8,.9]],w:'Столпы рухнули, рассыпавшись мглой и искрами. Мордред вскинула меч: «Вот вам за отца!» Двери в Тронный Зал озарились холодным светом, а Роман тихо шепнул: «Дальше я пойду с вами».'},
{t:'Роман Архаман: Настоящий Соломон',s:'Перед Тронным Залом стражи Андромалиус, Набериус и Сабнок пытаются остановить вас. Роман снимает перчатку: на его пальце — десятое кольцо Соломона. «Я — Король Магов, — тихо говорит он. — Я хотел быть человеком, и вы мне это позволили». Ars Nova поднимается в его руках, а Мэш и Жанна склоняют головы. Небо над Уруком разрывается золотыми трещинами, и мир на миг затихает перед бурей.',e:[['Андромалиус (Столп)','⚖️','Saber',1.6,1.4],['Набериус (Столп)','🔮','Caster',1.5,1.3],['Сабнок (Столп)','🏰','Lancer',1.5,1.3]],w:'Роман растворился в золотом свете, разрывая цепи Гоэтии. Мэш зарыдала: «Доктор…» Жанна обняла её: «Он выбрал, сэмпай. Идите — теперь Гоэтия смертна». Двери Трона распахнулись сами.'},
{t:'Гоэтия: Король Магов',b:1,s:'На троне восседает Гоэтия, Зверь I, — исполинская тварь из глаз и колец, слившаяся с Разломом. «Человечество — ошибка», — гремит голос Соломона, искажённый ненавистью. Мэш закрывает вас щитом, а Жанна поднимает знамя: «Ради Романа. Ради всех, кто был с нами!» Круг призыва пылает. Комната наполнена шёпотом, и каждое кольцо на пальцах Короля мерцает, как маленькая звезда.',e:[['Гоэтия (Зверь I)','👁️','Caster',5,1.5],['Демонический Столп','🗿','Berserker',.6,.9]],w:'Гоэтия рухнула, и золотой свет затопил Храм. Рейсифт вернул вас в Чалдеа. Мэш молчала, глядя на пустой стул Романа. Но круг призыва ещё горел: Разлом искал новый путь.'},
{t:'Тени Возвращаются',s:'Чалдеа тиха, но Врата Астрала вспыхивают тревожным светом. Разлом не закрылся: он смялся в комок и ждёт. Из зала призыва хлещут Тени всех Слуг, что вы победили, — слабее, но всё ещё опасные. Мэш поднимает щит: «Сэмпай, они ищут выход!» Пол дрожит, а по стенам Чалдеа ползут тревожные красные полосы.',e:[['Тень Слуги','👤','Saber'],['Тень Слуги','👤','Archer'],['Тень Слуги','👤','Lancer']],w:'Тени растворились, оставив лишь холод на полу. Жанна глубоко вздохнула: «Разлом всё ещё в мире. Нужно найти его источник». Панель Чалдеа мигнула красным.'},
{t:'Эхо Фуюки',s:'Следы Разлома ведут обратно в Фуюки, туда, где всё началось. Рин Тосака встречает вас у горы Энзо и хмурится: «Грааль умер, но трещина осталась». Вместе вы спускаетесь в пещеру, где чёрные корни Разлома оплели камни. Из тьмы поднимаются искажённые эхо давно павших Слуг. Чёрные корни оплели камень, и пещера вздыхает, как живая, дыша холодной сыростью.',e:[['Эхо Сэйбер','🖤','Saber',1.3,1.2],['Эхо Лансера','🔱','Lancer',1.3,1.2],['Эхо Арчера','🏹','Archer',1.2]],w:'Эхо угасло, и Рин потёрла лоб: «Корни уходят дальше, чем я думала». Она посмотрела на вас серьёзно: «Ты — ключ, Призыватель. Разлом хочет тебя, а не Грааль».'},
{t:'Хор Разлома',s:'Корни Разлома пульсируют, и вы слышите хор — голоса всех миров, что Разлом уже поглотил. «Присоединись к нам», — шепчут они. Жанна закрывает уши: «Не слушайте!» Из трещины выходят чудовища с лицами тех, кого вы знали: искажённые отражения, что улыбаются и тянут руки. Голоса смеются и плачут одновременно, и у вас слезятся глаза, хотя рядом нет ветра.',e:[['Отражение Друга','🎭','Caster',1.4,1.3],['Отражение Друга','🎭','Rider',1.4,1.3],['Голос Пустоты','🌑','Berserker',1.2]],w:'Хор оборвался, оставив звенящую тишину. Мэш вздрогнула: «Они говорили нашими голосами». Жанна крепко взяла вас за руку: «Мы пойдём дальше — вместе».'},
{t:'Мосты Между Мирами',s:'За трещиной открывается бесконечный мост из света и пепла, над которым проплывают обломки миров. Здесь Разлом берёт своё начало. Ветер шепчет на десятках языков, а по мосту шагают Слуги-Тени, пришедшие из других вселенных. Жанна поднимает знамя: «Мы уже далеко от дома, Призыватель». Пепел кружится вокруг, а вдали медленно плывут обломки чужих городов и небес.',e:[['Странник Разлома','🌌','Rider',1.4,1.3],['Странник Разлома','🌌','Caster',1.4,1.3],['Тень Слуги','👤','Berserker']],w:'Странники пали, и мост на миг засветился ровным светом. Мэш прошептала: «Сэмпай, мы идём по дороге, которую проложил Разлом». Впереди показался чёрный шпиль.'},
{t:'Хранитель Порога',s:'У самой трещины стоит страж — Слуга, лишённый имени и лица, собранный Разломом из осколков сотен героев. Он поднимает клинок, копьё и лук сразу. «Я — Порог. Мимо меня не пройдёт никто». Каждый удар отзывается в костях, а его тело перетекает из класса в класс. Осколки его тела звенят, как колокольчики, и каждый шаг отдаётся эхом в пустоте.',e:[['Хранитель Порога','🚪','Saber',2,1.5],['Осколок Порога','🚪','Lancer',.9,1],['Осколок Порога','🚪','Archer',.9,1]],w:'Страж рассыпался осколками, и каждый из них на миг блеснул чьим-то именем. Трещина впереди дрогнула, приоткрывая дорогу туда, где Разлом рождается.'},
{t:'Шпиль Забытых',s:'На вершине шпиля стоит башня, сложенная из забытых имён героев, которых Разлом стёр из Трона. Здесь сидит Архивариус — Кастер, что переписывает историю. «Каждый Слуга — лишь строчка, — шепчет он. — Я могу её вычеркнуть». Страницы вокруг него оживают и режут воздух. Страницы шелестят у самого лица, а чернила на них ещё влажные и пахнут кровью.',e:[['Архивариус Разлома','📜','Caster',2,1.5],['Живая страница','📄','Archer',.9],['Живая страница','📄','Lancer',.9]],w:'Страницы рассыпались пеплом, и на миг вы увидели тысячи имён, возвращающихся в Трон. Архивариус улыбнулся: «Хорошо. Пусть будут помнить». Внизу заревело нечто огромное.'},
{t:'Слуги из Пустоты',s:'Из пропасти под шпилем поднимаются Слуги, каких не знает ни один Трон: клинки без рук, лучники без лиц, всадники без коней. Это первые эксперименты Разлома, ошибки его творения. «Мы — то, чем он хочет вас сделать», — эхом звучит из глубины. Круг призыва вспыхивает. Из пропасти тянет холодом, и тишина между ударами сердца кажется бесконечной.',e:[['Пустой Клинок','🗡️','Saber',1.4,1.3],['Пустой Лучник','🏹','Archer',1.4,1.3],['Пустой Всадник','🐎','Rider',1.4,1.3]],w:'Пустые Слуги растаяли, и в ответ тишина стала глубже. Жанна тихо сказала: «Они не желали существовать». Вы чувствуете: до сердца Разлома осталось немного.'},
{t:'Последний Страж Врат',s:'Перед сердцем Разлома встаёт Последний Страж — Берсеркер размером с гору, склеенный из тел павших Слуг. «Вернитесь, — гудит он. — Не открывайте то, что закрыто». Его шаги дробят мост, а каждый удар высекает искры из самого пространства. Мэш поднимает щит и кричит: «Держитесь!» Мост стонет под тяжестью его шагов, и с неба сыплются искры расколотых звёзд.',e:[['Последний Страж','🗿','Berserker',2,1.5],['Осколок Слуги','👤','Saber',.8,.9]],w:'Страж рухнул, и мост завибрировал облегчённым гулом. Впереди открылась чёрная сфера, пульсирующая как огромное сердце. Жанна шепнула: «Вот она, Призыватель. Колыбель Разлома».'},
{t:'Колыбель Разлома',s:'Сфера раскрывается, и внутри вы видите бесконечное множество глаз, что смотрят на вас. «Ты — Призыватель, — говорит голос. — Ты — дверь. Я родился из твоей двери». Разлом сознаёт себя, и в нём звучит боль. Вокруг возникают Тени всех классов, готовые защищать своего создателя.',e:[['Тень Сэйбер','⚔️','Saber',1,1.2],['Тень Арчера','🏹','Archer',1,1.2],['Тень Лансера','🔱','Lancer',1,1.2]],w:'Тени пали, а голос Разлома стал тише и человечнее: «Я не хотел причинять боль». Жанна шагнула вперёд: «Тогда позволь нам помочь». Сфера вспыхнула, и мир вокруг сгорел белым.'},
{t:'Слуга-Пустота',b:1,s:'Разлом принимает облик Слуги-Пустоты — существа, что вобрало в себя всех героев, врагов и друзей. «Закройте меня — или примите», — шепчет оно. Вы поднимаете руку, и Врата Астрала открываются шире, чем когда-либо. Жанна, Мэш, Рин, Мордред — все ваши герои встают рядом с вами.',e:[['Слуга-Пустота','🌌','Berserker',5,1.5],['Тень Героя','👤','Saber',.6,.9],['Тень Героя','👤','Archer',.6,.9]],w:'Пустота содрогнулась и обернулась тёплым светом. Разлом закрылся, а в вашей руке остался маленький осколок печати. Жанна улыбнулась: «Это ещё не конец, Призыватель. Но это — начало». Врата Астрала засияли.'},
